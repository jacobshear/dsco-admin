<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Crashes · DSCO admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        /* Page-specific: issue title link, setup checklist spacing, raw-response lead-in. */
        .issue-link { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
        .issue-link .icon { width: 13px; height: 13px; }

        .setup-card p,
        .setup-card .setup-steps { margin-top: 12px; }
        .setup-card h3 + p { margin-top: 0; }
        .setup-steps .btn.plain { margin: 4px 0 0 -6px; }

        .raw-note { margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <div class="seg" id="days-seg" role="group" aria-label="Time window">
                <button type="button" data-days="7" aria-pressed="true">7 days</button>
                <button type="button" data-days="30" aria-pressed="false">30 days</button>
                <button type="button" data-days="90" aria-pressed="false">90 days</button>
            </div>
        </div>

        <section class="panel">
            <div class="panel-head">
                <h2>Crashlytics</h2>
                <span class="hint" id="crash-project-hint"></span>
            </div>
            <div id="crash-body"></div>
        </section>
    </div>

    <script src="assets/admin.js"></script>
    <script>
        const { ui } = AdminShell;
        const { esc } = ui;

        const body = document.getElementById('crash-body');

        let currentDays = 7;
        let loadSeq = 0;
        let hasData = false;

        // Only https links from the server are ever followed.
        const safeUrl = (url) => (typeof url === 'string' && /^https:\/\//i.test(url) ? url : '');

        // Count for display; anything non-numeric reads as a dash.
        const cell = (n) => (n == null || n === '' ? '–' : ui.number(Number(n)));

        /** Prefer API firebase_project_id; fall back to the shell's env map. */
        function projectIdFrom(data) {
            return data?.firebase_project_id
                || AdminShell.firebaseProjectId
                || 'dsco-683f6';
        }

        function applyProjectUi(data) {
            const projectId = projectIdFrom(data);
            document.getElementById('crash-project-hint').textContent = `iOS · Firebase project ${projectId}`;
            document.getElementById('console-link').href = safeUrl(data?.console)
                || `https://console.firebase.google.com/project/${encodeURIComponent(projectId)}/crashlytics`;
        }

        // "FATAL" -> "Fatal", "NON_FATAL" -> "Non-fatal", "ANR" stays an acronym.
        function errorLabel(type) {
            const text = String(type).toLowerCase().replace(/_/g, '-');
            return text === 'anr' ? 'ANR' : text.charAt(0).toUpperCase() + text.slice(1);
        }

        // ---- Loading ----

        // A refresh keeps the current table on screen (the button shows the wait).
        async function loadPage({ quiet = false } = {}) {
            const seq = ++loadSeq;
            if (!quiet || !hasData) ui.loading(body, `Loading crashes for the last ${currentDays} days…`);
            try {
                const data = await AdminShell.api('realtime', '/admin/metrics/crashes', { days: currentDays });
                if (seq !== loadSeq) return;
                hasData = true;
                renderIssues(data);
            } catch (error) {
                if (seq !== loadSeq) return;
                hasData = false;
                ui.error(body, { title: "Couldn't load crashes", error, onRetry: () => loadPage() });
            }
        }

        // ---- Rendering ----

        function renderSetup(data) {
            const steps = (data.setup_steps || []).map((step, i) => {
                const url = safeUrl(step.url);
                return `
                    <li>
                        <div class="n">${i + 1}</div>
                        <div>
                            <div class="t">${esc(step.title)}</div>
                            <div class="d">${esc(step.detail)}</div>
                            ${url ? `<a class="btn plain sm" href="${esc(url)}" target="_blank" rel="noopener">Open${ui.icon('external')}</a>` : ''}
                        </div>
                    </li>`;
            }).join('');

            return `
                <span class="badge warn">Setup needed</span>
                <div class="setup-card">
                    <h3>Finish Crashlytics monitoring</h3>
                    <p class="muted">${esc(data.reason || 'The Crashlytics API is not reachable yet.')}</p>
                    ${data.service_account ? `<p class="muted">Service account: <span class="mono">${esc(data.service_account)}</span></p>` : ''}
                    <ol class="setup-steps">${steps}</ol>
                    <p class="muted">
                        After enabling, wait a minute and refresh this page. The Firebase console works even before the API is wired.
                    </p>
                </div>`;
        }

        function issueRow(row) {
            // v1alpha topIssues returns { groups: [{ issue, metrics: [{ eventsCount, impactedUsersCount }] }] }
            const issue = row.issue || row;
            const metrics = (row.metrics && row.metrics[0]) || row.metrics || {};
            const title = issue.title || row.title || row.displayName || 'Unknown issue';
            const subtitle = issue.subtitle || row.subtitle || '';
            const errorType = issue.errorType || row.errorType || '';
            const events = metrics.eventsCount ?? row.eventCount ?? row.crashCount ?? row.count;
            const users = metrics.impactedUsersCount ?? row.impactedUserCount ?? row.userCount;
            const href = safeUrl(issue.uri || row.uri);

            const titleHtml = href
                ? `<a class="issue-link" href="${esc(href)}" target="_blank" rel="noopener">${esc(title)}${ui.icon('external')}</a>`
                : `<strong>${esc(title)}</strong>`;
            const typeBadge = errorType
                ? ` <span class="badge${String(errorType).toUpperCase() === 'FATAL' ? ' bad' : ''}">${esc(errorLabel(errorType))}</span>`
                : '';
            return `
                <tr>
                    <td>${titleHtml}${typeBadge}${subtitle ? `<div class="faint">${esc(subtitle)}</div>` : ''}</td>
                    <td class="num">${esc(cell(events))}</td>
                    <td class="num">${esc(cell(users))}</td>
                </tr>`;
        }

        function renderIssues(data) {
            applyProjectUi(data);

            if (!data.available) {
                body.innerHTML = renderSetup(data);
                return;
            }

            const report = data.top_issues || {};
            const issues = report.issues || report.topIssues || report.groups || report.rows || null;

            if (Array.isArray(issues) && issues.length) {
                body.innerHTML = `
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>Issue</th><th class="num">Events</th><th class="num">Users</th></tr></thead>
                            <tbody>${issues.map(issueRow).join('')}</tbody>
                        </table>
                    </div>`;
            } else if (Array.isArray(issues)) {
                ui.empty(body, {
                    title: 'No crashes in this window',
                    body: `Crashlytics reported no issues in the last ${currentDays} days.`,
                    icon: 'check',
                });
            } else {
                body.innerHTML = `
                    <p class="muted raw-note">Connected, but the report shape isn't recognized. Raw response:</p>
                    <pre class="raw">${esc(JSON.stringify(report, null, 2))}</pre>`;
            }
        }

        // ---- Wiring ----

        document.getElementById('days-seg').addEventListener('click', (e) => {
            const button = e.target.closest('button[data-days]');
            if (!button) return;
            currentDays = Number(button.dataset.days);
            document.querySelectorAll('#days-seg button').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
            loadPage();
        });

        AdminShell.init({ active: 'crashes.html', title: 'Crashes', onReady: () => loadPage() });

        document.getElementById('page-actions').innerHTML = `
            <a class="btn" id="console-link" href="#" target="_blank" rel="noopener">Open Firebase console${ui.icon('external')}</a>
            <button type="button" class="btn" id="refresh">${ui.icon('refresh')}Refresh</button>`;
        document.getElementById('refresh').addEventListener('click', (e) =>
            ui.busy(e.currentTarget, () => loadPage({ quiet: true })));

        // Seed the project hint and console link now: the env is known before auth or the API.
        applyProjectUi(null);
    </script>
</body>
</html>
