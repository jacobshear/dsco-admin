<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Users · DSCO admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        /* Page-specific: initials avatar, the profile header and history meta. */
        .person .avatar.initials {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
        }

        .profile-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .profile-head .person { gap: 14px; }
        .profile-head .person .avatar { width: 56px; height: 56px; }
        .profile-head .person .avatar.initials { font-size: 18px; }
        .profile-head .name { font-size: 18px; line-height: 1.25; }
        .profile-head .handle { font-size: 13px; }

        .meta-line {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-3);
        }

        /* The "find a person" prompt is redundant once a result list is on screen. */
        #results:not([hidden]) ~ #user .find-prompt { display: none; }

        /* Opening a profile from far down the page scrolls it into view. */
        #user { scroll-margin-top: 16px; }

        @media (max-width: 900px) {
            #user { scroll-margin-top: 64px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <form class="toolbar" id="search-form" role="search">
            <div class="search">
                <input type="text" id="search-input" aria-label="Search people" placeholder="Search by handle, name or user id" autocomplete="off">
            </div>
            <button type="submit" class="btn primary" id="search-btn">Search</button>
            <button type="button" class="btn" id="recent-signups-btn">Recent signups</button>
        </form>

        <section class="panel" id="results" hidden></section>

        <div id="user"></div>

        <section class="panel">
            <div class="panel-head">
                <h2>Recent account deletions</h2>
                <span class="hint">Select one to see its history.</span>
            </div>
            <div id="deletions"></div>
        </section>
    </div>

    <script src="assets/admin.js"></script>
    <script>
        const { ui } = AdminShell;
        const { esc } = ui;

        let currentUserId = null;
        let currentUser = null;
        let actionInFlight = false;
        let detailSeq = 0;

        const UUID_RE = /^(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[0-9a-f]{32,})$/i;

        const REASON_LABELS = {
            HARASSMENT: 'Harassment',
            HATE_SPEECH: 'Hate speech',
            SEXUAL_CONTENT: 'Sexual content',
            MINOR_SAFETY: 'Minor safety',
            SPAM: 'Spam',
            IMPERSONATION: 'Impersonation',
            SELF_HARM: 'Self-harm',
            VIOLENCE: 'Violence',
            ILLEGAL_CONTENT: 'Illegal content',
            PRIVACY_VIOLATION: 'Privacy violation',
            OTHER: 'Other',
        };

        const REASON_CODES = Object.entries(REASON_LABELS);

        // Badge tone per account status; anything else renders neutral.
        const STATUS_TONES = { verified: 'good', warned: 'warn', suspended: 'orange', banned: 'bad' };

        // Label and badge tone per moderation history entry.
        const HISTORY_TYPES = {
            warned: { label: 'Warned', tone: 'warn' },
            suspended: { label: 'Suspended', tone: 'orange' },
            banned: { label: 'Banned', tone: 'bad' },
            reversed: { label: 'Reversed', tone: 'good' },
            content_removed: { label: 'Content removed', tone: 'purple' },
            account_deleted: { label: 'Account deleted', tone: 'bad' },
        };

        // Moderation actions. Titles are questions, buttons keep the verb.
        // timed: the backend sets an end date from duration_hours (warn and suspend only).
        const MODERATION = {
            warned: {
                title: (who) => `Warn ${who}?`,
                body: 'They get a warning notification.',
                confirmLabel: 'Warn',
                verb: 'warn',
                destructive: false,
                timed: true,
            },
            suspended: {
                title: (who) => `Suspend ${who}?`,
                body: 'They lose access until the suspension ends.',
                confirmLabel: 'Suspend',
                verb: 'suspend',
                destructive: true,
                timed: true,
            },
            banned: {
                title: (who) => `Ban ${who}?`,
                body: 'They lose access permanently.',
                confirmLabel: 'Ban',
                verb: 'ban',
                destructive: true,
                timed: false,
            },
        };

        // The other account actions. run() gets the user id captured when the
        // button was pressed; reload refreshes the profile afterwards.
        const COMMANDS = {
            'force-signout': {
                title: (who) => `Sign ${who} out everywhere?`,
                body: 'Every active session ends and they have to sign in again.',
                confirmLabel: 'Force sign-out',
                destructive: true,
                failure: (who) => `Couldn't sign out ${who}`,
                run: (userId) => AdminShell.api('realtime', '/admin/users/force_signout', {
                    user_id: userId,
                }),
                success: 'Signed out all sessions.',
            },
            'reset-avatar': {
                title: (who) => `Reset the avatar for ${who}?`,
                body: 'Removes their current avatar.',
                confirmLabel: 'Reset avatar',
                destructive: true,
                failure: (who) => `Couldn't reset the avatar for ${who}`,
                run: (userId) => AdminShell.api('realtime', '/admin/content/remove', {
                    content_type: 'avatar',
                    content_id: userId,
                    reason_code: 'OTHER',
                    reason_text: 'Admin avatar reset',
                }),
                reload: true,
                success: 'Avatar reset.',
            },
            'comp-roam': {
                title: (who) => `Comp 7 days of Roam for ${who}?`,
                body: 'Gives them 7 days of Roam.',
                confirmLabel: 'Comp 7 days',
                destructive: false,
                failure: (who) => `Couldn't comp Roam for ${who}`,
                run: (userId) => AdminShell.api('realtime', '/admin/users/roam', {
                    user_id: userId,
                    action: 'comp',
                    days: 7,
                }),
                reload: true,
            },
            'revoke-roam': {
                title: (who) => `Revoke Roam for ${who}?`,
                body: 'They lose their Roam entitlement.',
                confirmLabel: 'Revoke',
                destructive: true,
                failure: (who) => `Couldn't revoke Roam for ${who}`,
                run: (userId) => AdminShell.api('realtime', '/admin/users/roam', {
                    user_id: userId,
                    action: 'revoke',
                }),
                reload: true,
            },
            export: {
                title: (who) => `Export data for ${who}?`,
                body: 'Downloads a JSON file with this account\'s data.',
                confirmLabel: 'Export',
                destructive: false,
                failure: (who) => `Couldn't export data for ${who}`,
                run: async (userId) => {
                    const data = await AdminShell.api('realtime', '/admin/users/export', {
                        user_id: userId,
                    });
                    downloadJson(data, `user-export-${userId}.json`);
                },
                success: (userId) => `Export saved as user-export-${userId}.json.`,
            },
        };

        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const recentBtn = document.getElementById('recent-signups-btn');
        const resultsEl = document.getElementById('results');
        const userEl = document.getElementById('user');
        const deletionsEl = document.getElementById('deletions');

        // ---- Small helpers ----

        function looksLikeUuid(query) {
            return UUID_RE.test((query || '').trim());
        }

        function normalizeUsers(data) {
            if (!data) return [];
            if (Array.isArray(data.users)) return data.users;
            if (Array.isArray(data.results)) return data.results;
            if (Array.isArray(data.items)) return data.items;
            if (Array.isArray(data)) return data;
            return [];
        }

        // Own keys only: statuses and codes come from the server, so a value
        // like "constructor" must not resolve to something on Object.prototype.
        function lookup(map, key) {
            return Object.prototype.hasOwnProperty.call(map, key) ? map[key] : undefined;
        }

        function sentence(value) {
            const text = String(value ?? '').replace(/_/g, ' ').trim();
            return text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
        }

        function roleLabel(role) {
            return String(role || 'admin').replace(/_/g, ' ');
        }

        function shortId(id) {
            return String(id || '').slice(0, 8);
        }

        function statusBadge(status) {
            const tone = lookup(STATUS_TONES, status) || '';
            return `<span class="badge ${tone}">${esc(sentence(status || 'unknown'))}</span>`;
        }

        function avatarHtml(user) {
            if (user.avatar_url) return `<img class="avatar" src="${esc(user.avatar_url)}" alt="">`;
            const initials = (user.screen_name || user.username || 'U').substring(0, 2).toUpperCase();
            return `<span class="avatar initials" aria-hidden="true">${esc(initials)}</span>`;
        }

        // A state (loading, empty, error) needs a panel to sit in when it
        // replaces the profile, which is itself several panels.
        function panelIn(region) {
            region.innerHTML = '<div class="panel"></div>';
            return region.firstElementChild;
        }

        function personLabel() {
            const name = currentUser && currentUser.username;
            return name ? `@${name}` : 'this person';
        }

        function downloadJson(data, filename) {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        // Rows open with a click or Enter/Space. Bound once to a region that
        // stays put while its contents are replaced.
        function bindRows(region) {
            const open = (e) => {
                const row = e.target.closest('tr[data-user-id]');
                if (!row || !region.contains(row) || !row.dataset.userId) return;
                loadUserDetail(row.dataset.userId);
                userEl.scrollIntoView({ block: 'start' });
            };
            region.addEventListener('click', open);
            region.addEventListener('keydown', (e) => {
                if (e.key !== 'Enter' && e.key !== ' ') return;
                if (!e.target.matches('tr[data-user-id]')) return;
                e.preventDefault();
                open(e);
            });
        }

        // ---- Search ----

        // Search and Recent signups share the toolbar: the one that ran shows
        // the wait, the other waits its turn.
        async function runSearch(button, fn) {
            if (searchBtn.disabled || recentBtn.disabled) return;
            [searchBtn, recentBtn].forEach(b => { if (b !== button) b.disabled = true; });
            try {
                await ui.busy(button, fn);
            } finally {
                [searchBtn, recentBtn].forEach(b => { b.disabled = false; });
            }
        }

        function hideResults() {
            resultsEl.hidden = true;
            resultsEl.innerHTML = '';
        }

        function clearProfile() {
            detailSeq++;
            currentUserId = null;
            currentUser = null;
            userEl.innerHTML = '';
        }

        function showFindPrompt() {
            const panel = panelIn(userEl);
            panel.classList.add('find-prompt');
            ui.empty(panel, {
                title: 'Find a person',
                body: 'Search by handle, name or user id, or open the newest signups.',
                icon: 'users',
            });
        }

        async function searchUsers() {
            const query = searchInput.value.trim();
            if (!query) {
                ui.notice('Enter a handle, name or user id to search.');
                searchInput.focus();
                return;
            }

            resultsEl.hidden = false;
            ui.loading(resultsEl, 'Searching…');
            clearProfile();

            try {
                const data = await AdminShell.api('realtime', '/admin/users/search', {
                    query,
                    mode: 'search',
                    limit: 25,
                });
                const users = normalizeUsers(data);

                if (users.length === 1 && users[0].user_id) {
                    hideResults();
                    await loadUserDetail(users[0].user_id);
                    return;
                }

                if (looksLikeUuid(query)) {
                    // A bare id may belong to someone search doesn't index (for
                    // example a deleted account), so try its history directly.
                    hideResults();
                    if (await loadUserDetail(query, { renderErrors: false })) return;
                    clearProfile();
                }

                renderSearchResults(users, {
                    title: 'Search results',
                    empty: {
                        title: `No one matches "${query}"`,
                        body: 'Try a handle, a name or the full user id.',
                        actionLabel: 'Recent signups',
                        onAction: () => runSearch(recentBtn, loadRecentSignups),
                    },
                });
            } catch (error) {
                ui.error(resultsEl, {
                    title: "Couldn't search people",
                    error,
                    onRetry: () => runSearch(searchBtn, searchUsers),
                });
            }
        }

        async function loadRecentSignups() {
            resultsEl.hidden = false;
            ui.loading(resultsEl, 'Loading recent signups…');

            try {
                const data = await AdminShell.api('realtime', '/admin/users/search', {
                    mode: 'recent',
                    limit: 25,
                });
                renderSearchResults(normalizeUsers(data), {
                    title: 'Recent signups',
                    empty: {
                        title: 'No recent signups',
                        body: 'New accounts appear here as people finish signing up.',
                    },
                });
            } catch (error) {
                ui.error(resultsEl, {
                    title: "Couldn't load recent signups",
                    error,
                    onRetry: () => runSearch(recentBtn, loadRecentSignups),
                });
            }
        }

        function renderSearchResults(users, { title, empty }) {
            resultsEl.hidden = false;

            if (!users.length) {
                ui.empty(resultsEl, { ...empty, icon: 'users' });
                return;
            }

            // Every field is untrusted (users type their own names), so all of
            // it goes through esc(); rows carry the id in a data attribute.
            resultsEl.innerHTML = `
                <div class="panel-head">
                    <h2>${esc(title)}</h2>
                    <span class="hint">${esc(ui.number(users.length))} ${users.length === 1 ? 'person' : 'people'}. Select one to open their profile.</span>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Person</th>
                                <th>Status</th>
                                <th>Signed up</th>
                                <th>User id</th>
                            </tr>
                        </thead>
                        <tbody>${users.map(resultRow).join('')}</tbody>
                    </table>
                </div>`;
        }

        function resultRow(user) {
            const id = user.user_id || '';
            return `
                <tr class="clickable" tabindex="0" data-user-id="${esc(id)}">
                    <td>
                        <div class="person">
                            ${avatarHtml(user)}
                            <div>
                                <div class="name">${esc(user.screen_name || 'Unknown')}</div>
                                <div class="handle">@${esc(user.username || 'unknown')}</div>
                                ${user.email ? `<div class="handle">${esc(user.email)}</div>` : ''}
                            </div>
                        </div>
                    </td>
                    <td>${statusBadge(user.account_status)}</td>
                    <td class="nowrap">${ui.timeTag(user.signup_completed_at)}</td>
                    <td><span class="mono faint" title="${esc(id)}">${esc(shortId(id))}</span></td>
                </tr>`;
        }

        // ---- Profile ----

        // Resolves true once the profile is on screen. It never throws: a
        // failure renders its own state (or a notice, when a refresh keeps the
        // current profile visible), so callers only branch on the result.
        async function loadUserDetail(userId, { quiet = false, renderErrors = true } = {}) {
            const seq = ++detailSeq;
            const keepOnScreen = quiet && !!userEl.querySelector('[data-profile]');
            if (!keepOnScreen) {
                currentUserId = null;
                currentUser = null;
                ui.loading(panelIn(userEl), 'Loading profile…');
            }

            try {
                const data = await AdminShell.api('realtime', '/admin/users/history', { user_id: userId });
                const id = data.user_id || userId;

                let roam = null;
                let roamError = null;
                try {
                    roam = await AdminShell.api('realtime', '/admin/users/roam', {
                        user_id: id,
                        action: 'get',
                    });
                } catch (error) {
                    roamError = error;
                }

                if (seq !== detailSeq) return false;
                currentUserId = id;
                currentUser = data.user || {};
                renderUser(data, roam, roamError);
                syncUrl(id);
                return true;
            } catch (error) {
                if (seq !== detailSeq) return false;
                if (keepOnScreen) {
                    ui.notice(`Couldn't refresh this profile: ${error.message}`, { tone: 'bad' });
                    return false;
                }
                if (!renderErrors) return false;
                if (/not found|404/i.test(error.message || '')) {
                    ui.empty(panelIn(userEl), {
                        title: 'Person not found',
                        body: 'No account matches that id. A deleted account may be fully purged.',
                        icon: 'users',
                    });
                } else {
                    ui.error(panelIn(userEl), {
                        title: "Couldn't load this profile",
                        error,
                        onRetry: () => loadUserDetail(userId),
                    });
                }
                return false;
            }
        }

        // Keep the deep link shareable without forcing a reload.
        function syncUrl(id) {
            try {
                const url = new URL(window.location.href);
                url.searchParams.set('id', id);
                window.history.replaceState({}, '', url);
            } catch (_) { /* the link is a convenience */ }
        }

        function premiumUntilHtml(epoch) {
            const n = Number(epoch);
            const date = n > 0 ? ui.toDate(n) : null;
            if (!date) return '<span class="faint">None</span>';
            if (date.getTime() < Date.now()) return `<span class="muted">Expired ${esc(ui.time(date))}</span>`;
            return esc(ui.time(date));
        }

        function kvRows(rows) {
            return rows.filter(Boolean).map(([label, html]) => `<dt>${esc(label)}</dt><dd>${html}</dd>`).join('');
        }

        function historyItem(action) {
            const kind = lookup(HISTORY_TYPES, action.action_type)
                || { label: sentence(action.action_type) || 'Action', tone: '' };
            const reason = lookup(REASON_LABELS, action.reason_code) || action.reason_code || '';
            return `
                <article class="item">
                    <div class="item-head">
                        <div class="item-title">
                            <span class="badge ${kind.tone}">${esc(kind.label)}</span>
                            ${reason ? `<span>${esc(reason)}</span>` : ''}
                        </div>
                        <span class="item-time">${ui.timeTag(action.created_at)}</span>
                    </div>
                    ${action.reason_text ? `<div class="quote">${esc(action.reason_text)}</div>` : ''}
                    <div class="meta-line">
                        By ${esc(roleLabel(action.actor_role))}${action.expires_at ? ` · Expires ${ui.timeTag(action.expires_at)}` : ''}
                    </div>
                </article>`;
        }

        function appealItem(appeal) {
            const tone = appeal.status === 'approved' ? 'good' : appeal.status === 'denied' ? 'bad' : 'warn';
            const text = appeal.reason || appeal.statement || '';
            return `
                <article class="item">
                    <div class="item-head">
                        <div class="item-title">
                            Appeal
                            ${appeal.status ? `<span class="badge ${tone}">${esc(sentence(appeal.status))}</span>` : ''}
                        </div>
                        <span class="item-time">${ui.timeTag(appeal.created_at)}</span>
                    </div>
                    ${text ? `<div class="quote">${esc(text)}</div>` : ''}
                </article>`;
        }

        function renderUser(data, roam, roamError) {
            const user = data.user || {};
            const history = Array.isArray(data.history) ? data.history
                : (Array.isArray(data.actions) ? data.actions : []);
            const appeals = Array.isArray(data.appeals) ? data.appeals : [];
            const status = data.account_status || user.account_status || 'unknown';
            const statusReason = data.account_status_reason || user.account_status_reason || '';
            const id = data.user_id || user.user_id || currentUserId || '';

            const referrals = roam && roam.referral_count != null
                ? (typeof roam.referral_count === 'number' ? ui.number(roam.referral_count) : esc(roam.referral_count))
                : '–';
            const roamGate = roam ? esc(roam.roam_gate_mode || 'off') : '–';

            userEl.innerHTML = `
                <section class="panel" data-profile>
                    <div class="profile-head">
                        <div class="person">
                            ${avatarHtml(user)}
                            <div>
                                <h2 class="name">${esc(user.screen_name || 'Unknown')}</h2>
                                <div class="handle">@${esc(user.username || 'unknown')} · <span class="mono" title="${esc(id)}">${esc(shortId(id))}</span></div>
                            </div>
                        </div>
                        ${statusBadge(status)}
                    </div>

                    <dl class="kv">${kvRows([
                        statusReason ? ['Status reason', esc(statusReason)] : null,
                        ['User id', `<span class="mono">${esc(id)}</span>`],
                        user.email ? ['Email', esc(user.email)] : null,
                        user.signup_completed_at ? ['Signed up', ui.timeTag(user.signup_completed_at)] : null,
                    ])}</dl>

                    <div class="item-actions">
                        <button type="button" class="btn" data-action="warned">Warn</button>
                        <button type="button" class="btn" data-action="export">${ui.icon('download')}Export data</button>
                        <span class="spacer"></span>
                        <button type="button" class="btn danger" data-action="force-signout">Force sign-out</button>
                        <button type="button" class="btn danger" data-action="reset-avatar">Reset avatar</button>
                        <button type="button" class="btn danger" data-action="suspended">Suspend</button>
                        <button type="button" class="btn danger" data-action="banned">Ban</button>
                        <button type="button" class="btn danger" data-action="delete">Delete account</button>
                    </div>
                </section>

                <section class="panel">
                    <div class="panel-head">
                        <h2>Roam</h2>
                        <div class="panel-actions">
                            <button type="button" class="btn sm" data-action="comp-roam">Comp 7 days</button>
                            <button type="button" class="btn sm danger" data-action="revoke-roam">Revoke Roam</button>
                        </div>
                    </div>
                    <dl class="kv">${kvRows([
                        ['Premium until', roam ? premiumUntilHtml(roam.premium_until) : '–'],
                        ['Referral count', referrals],
                        ['Roam gate mode', roamGate],
                    ])}</dl>
                    ${roamError ? `<p class="meta-line">Couldn't load Roam details: ${esc(roamError.message)}</p>` : ''}
                </section>

                <section class="panel">
                    <div class="panel-head">
                        <h2>Moderation history</h2>
                        <span class="hint">${esc(ui.number(history.length))} ${history.length === 1 ? 'action' : 'actions'}</span>
                    </div>
                    <div id="moderation-history">${history.length ? `<div class="item-list">${history.map(historyItem).join('')}</div>` : ''}</div>
                </section>

                ${appeals.length ? `
                    <section class="panel">
                        <div class="panel-head">
                            <h2>Appeals</h2>
                            <span class="hint">${esc(ui.number(appeals.length))} ${appeals.length === 1 ? 'appeal' : 'appeals'}</span>
                        </div>
                        <div class="item-list">${appeals.map(appealItem).join('')}</div>
                    </section>` : ''}`;

            if (!history.length) {
                ui.empty(document.getElementById('moderation-history'), {
                    title: 'No moderation history',
                    body: 'Warnings, suspensions and bans against this account appear here.',
                    icon: 'list',
                });
            }
        }

        // ---- Account actions ----

        function setActionsDisabled(disabled) {
            userEl.querySelectorAll('button[data-action]').forEach(b => { b.disabled = disabled; });
        }

        // One action at a time. The pressed button shows the wait until the
        // request (and the profile reload, when asked for) finishes.
        async function perform(button, failure, fn, { reload = false } = {}) {
            const userId = currentUserId;
            actionInFlight = true;
            setActionsDisabled(true);
            try {
                await ui.busy(button, async () => {
                    await fn();
                    if (reload) await loadUserDetail(userId, { quiet: true });
                });
                return true;
            } catch (error) {
                ui.notice(`${failure}: ${error.message}`, { tone: 'bad' });
                return false;
            } finally {
                actionInFlight = false;
                setActionsDisabled(false);
            }
        }

        async function moderate(action, button) {
            const spec = MODERATION[action];
            const userId = currentUserId;
            const who = personLabel();

            const fields = [
                { name: 'reason_code', label: 'Reason', type: 'select', options: REASON_CODES, required: true, placeholder: 'Choose a reason…' },
            ];
            if (spec.timed) {
                fields.push({ name: 'duration', label: 'Duration in hours', type: 'text', placeholder: 'Optional', hint: 'Leave empty for no end date.' });
            }
            fields.push({ name: 'reason_text', label: 'Explanation', type: 'textarea', required: true, placeholder: 'Explain the reason for this action' });

            const values = await ui.confirm({
                title: spec.title(who),
                body: esc(spec.body),
                confirmLabel: spec.confirmLabel,
                destructive: spec.destructive,
                fields,
            });
            if (!values) return;

            let durationHours = null;
            if (values.duration) {
                durationHours = parseInt(values.duration, 10);
                if (!(durationHours > 0)) {
                    ui.notice(`Couldn't ${spec.verb} ${who}: duration must be a whole number of hours.`, { tone: 'bad' });
                    return;
                }
            }

            await perform(button, `Couldn't ${spec.verb} ${who}`, () => AdminShell.api('realtime', '/admin/moderation/action', {
                target_type: 'user',
                target_id: userId,
                action_type: action,
                reason_code: values.reason_code,
                reason_text: values.reason_text,
                duration_hours: durationHours,
            }), { reload: true });
        }

        async function runCommand(spec, button) {
            const userId = currentUserId;
            const who = personLabel();
            const values = await ui.confirm({
                title: spec.title(who),
                body: esc(spec.body),
                confirmLabel: spec.confirmLabel,
                destructive: spec.destructive,
            });
            if (!values) return;

            const ok = await perform(button, spec.failure(who), () => spec.run(userId), { reload: !!spec.reload });
            if (ok && spec.success) {
                ui.notice(typeof spec.success === 'function' ? spec.success(userId) : spec.success, { tone: 'good' });
            }
        }

        async function deleteAccount(button) {
            const userId = currentUserId;
            const expected = ((currentUser && (currentUser.username || currentUser.UsernamePK)) || userId || '').trim();

            const values = await ui.confirm({
                title: 'Delete this account permanently?',
                body: `This permanently deletes the account and purges user data. Type <span class="mono">${esc(expected)}</span> to confirm.`,
                confirmLabel: 'Delete account',
                destructive: true,
                fields: [
                    { name: 'username', label: 'Username', type: 'text', required: true, placeholder: 'Type the username to confirm' },
                    { name: 'reason_text', label: 'Reason for deletion', type: 'textarea', required: true, placeholder: 'Why this account is being deleted' },
                ],
            });
            if (!values) return;

            const typed = values.username.replace(/^@/, '');
            if (typed.toLowerCase() !== expected.toLowerCase()) {
                ui.notice(`Couldn't delete @${expected}: the username you typed doesn't match.`, { tone: 'bad' });
                return;
            }

            const ok = await perform(button, `Couldn't delete @${expected}`, () => AdminShell.api('realtime', '/admin/users/delete', {
                user_id: userId,
                reason_text: values.reason_text,
            }));
            if (!ok) return;

            clearProfile();
            ui.empty(panelIn(userEl), {
                title: 'Account deleted',
                body: `@${expected} was deleted and its data purged.`,
                icon: 'check',
            });
            loadRecentDeletions();
        }

        function handleAction(action, button) {
            if (!currentUserId || actionInFlight) return;
            if (MODERATION[action]) return moderate(action, button);
            if (action === 'delete') return deleteAccount(button);
            if (COMMANDS[action]) return runCommand(COMMANDS[action], button);
        }

        // ---- Recent deletions ----

        async function loadRecentDeletions() {
            ui.loading(deletionsEl, 'Loading deletions…');
            try {
                const data = await AdminShell.api('realtime', '/admin/audit', {
                    action_type: 'account_deleted',
                    limit: 10,
                });
                const items = Array.isArray(data.items) ? data.items
                    : (Array.isArray(data.actions) ? data.actions : []);

                if (!items.length) {
                    ui.empty(deletionsEl, {
                        title: 'No recent deletions',
                        body: 'Deleted accounts appear here, newest first.',
                        icon: 'inbox',
                    });
                    return;
                }

                deletionsEl.innerHTML = `
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Deleted</th>
                                    <th>Account</th>
                                    <th>By</th>
                                </tr>
                            </thead>
                            <tbody>${items.map(item => {
                                const id = item.target_id || '';
                                return `
                                    <tr${id ? ` class="clickable" tabindex="0" data-user-id="${esc(id)}"` : ''}>
                                        <td class="nowrap">${ui.timeTag(item.created_at)}</td>
                                        <td>${id ? `<span class="mono" title="${esc(id)}">${esc(shortId(id))}</span>` : '<span class="faint">Unknown</span>'}</td>
                                        <td>${esc(roleLabel(item.actor_role))}</td>
                                    </tr>`;
                            }).join('')}</tbody>
                        </table>
                    </div>`;
            } catch (error) {
                ui.error(deletionsEl, {
                    title: "Couldn't load recent deletions",
                    error,
                    onRetry: loadRecentDeletions,
                });
            }
        }

        // ---- Wiring ----

        function onReady() {
            loadRecentDeletions();

            // reports.html links here with ?id=<userId>.
            const userId = new URLSearchParams(window.location.search).get('id');
            if (userId) {
                searchInput.value = userId;
                loadUserDetail(userId);
            } else {
                showFindPrompt();
            }
        }

        document.querySelector('.search').insertAdjacentHTML('afterbegin', ui.icon('search'));

        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            runSearch(searchBtn, searchUsers);
        });
        recentBtn.addEventListener('click', () => runSearch(recentBtn, loadRecentSignups));

        bindRows(resultsEl);
        bindRows(deletionsEl);

        userEl.addEventListener('click', (e) => {
            const button = e.target.closest('button[data-action]');
            if (button && userEl.contains(button)) handleAction(button.dataset.action, button);
        });

        AdminShell.init({ active: 'users.html', title: 'Users', onReady });
    </script>
</body>
</html>
