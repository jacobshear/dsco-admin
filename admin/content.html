<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Content · DSCO admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        /* Page-specific: the content card grid, its preview well, and the details dialog. */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .content-grid > .state { grid-column: 1 / -1; }

        .content-card {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .content-card .item-head { align-items: center; }
        .content-card .item-title { flex: none; }
        .content-card .kv { margin-bottom: 14px; }
        .content-card .item-actions { margin-top: auto; }

        .content-title {
            min-width: 0;
            overflow: hidden;
            font-size: 13px;
            color: var(--text-2);
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .content-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 160px;
            margin-bottom: 14px;
            padding: 8px;
            overflow: hidden;
            border-radius: var(--r);
            background: var(--surface-2);
        }

        .preview-btn {
            position: relative;
            display: flex;
            max-width: 100%;
            padding: 0;
            border: none;
            background: none;
            color: inherit;
            font: inherit;
            cursor: zoom-in;
        }

        .preview-btn img,
        .preview-btn video {
            display: block;
            max-width: 100%;
            max-height: 200px;
            border-radius: var(--r-sm);
        }

        .play-badge {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            filter: drop-shadow(0 1px 3px var(--scrim));
            pointer-events: none;
        }

        .play-badge .icon { width: 28px; height: 28px; fill: currentColor; stroke: none; }

        .text-preview {
            padding: 8px;
            color: var(--text);
            text-align: center;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .no-preview { font-size: 13px; color: var(--text-3); }

        /* Details dialog */
        .preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding: 12px;
            border-radius: var(--r);
            background: var(--surface-2);
        }

        .preview-area img,
        .preview-area video {
            max-width: 100%;
            max-height: 400px;
            border-radius: var(--r-sm);
        }

        .dlg-body .quote { margin-bottom: 14px; }

        .detail-heading {
            margin: 18px 0 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .report-rows { display: flex; flex-direction: column; gap: 8px; }

        .report-row {
            padding: 10px 12px;
            border-radius: var(--r);
            background: var(--surface-2);
        }

        .report-row-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }

        .report-reason { font-weight: 600; color: var(--text); }

        .report-details {
            margin-top: 6px;
            color: var(--text-2);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .pager {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="toolbar" id="tabs">
            <div class="seg" role="group" aria-label="Reported content">
                <button type="button" data-type="all" aria-pressed="true">All <span class="count" data-count-for="all"></span></button>
                <button type="button" data-type="story" aria-pressed="false">Stories <span class="count" data-count-for="story"></span></button>
                <button type="button" data-type="pin" aria-pressed="false">Pins <span class="count" data-count-for="pin"></span></button>
                <button type="button" data-type="message" aria-pressed="false">Messages <span class="count" data-count-for="message"></span></button>
                <button type="button" data-type="channel" aria-pressed="false">Channels <span class="count" data-count-for="channel"></span></button>
            </div>
            <div class="seg" role="group" aria-label="Recent content">
                <button type="button" data-type="recent_story" aria-pressed="false">Recent stories</button>
                <button type="button" data-type="recent_pin" aria-pressed="false">Recent pins</button>
            </div>
        </div>

        <div class="content-grid" id="content-grid"></div>
        <div class="pager" id="pager" hidden></div>
    </div>

    <script src="assets/admin.js"></script>
    <script>
        const { ui } = AdminShell;
        const { esc } = ui;

        const grid = document.getElementById('content-grid');
        const pager = document.getElementById('pager');

        // Reported tabs read the pending-report queue grouped by content;
        // recent tabs page through /admin/content/recent.
        let currentTab = 'all';
        let reportedContent = null;     // null until the first successful load
        let reportedLoading = false;
        let recentContent = [];
        let recentSeq = 0;              // drops responses from a superseded recent load
        let recentPage = 1;
        let storedLastKey = null;

        const REASON_LABELS = {
            HARASSMENT: 'Harassment',
            HATE_SPEECH: 'Hate speech',
            SEXUAL_CONTENT: 'Sexual content',
            MINOR_SAFETY: 'Minor safety',
            SPAM: 'Spam',
            IMPERSONATION: 'Impersonation',
            SELF_HARM: 'Self-harm',
            VIOLENCE: 'Violence',
            ILLEGAL_CONTENT: 'Illegal content',
            PRIVACY_VIOLATION: 'Privacy violation',
            OTHER: 'Other',
        };

        // Older reports carry the app's lowercase category instead of a reason code.
        const LEGACY_REASON_LABELS = {
            harassment: 'Harassment or bullying',
            spam: 'Spam or scam',
            inappropriate: 'Inappropriate content',
            underage: 'Underage user',
            impersonation: 'Impersonation',
            other: 'Other',
        };

        const REASON_OPTIONS = Object.entries(REASON_LABELS);

        const TYPE_META = {
            story: { label: 'Story', tone: 'purple' },
            pin: { label: 'Pin', tone: 'info' },
            message: { label: 'Message', tone: 'good' },
            channel: { label: 'Channel', tone: 'warn' },
        };

        const REPORTED_EMPTY = {
            all: { title: 'No reported content', body: 'Pending reports on stories, pins, messages and channels appear here.' },
            story: { title: 'No reported stories', body: 'Pending story reports appear here.' },
            pin: { title: 'No reported pins', body: 'Pending pin reports appear here.' },
            message: { title: 'No reported messages', body: 'Pending message reports appear here.' },
            channel: { title: 'No reported channels', body: 'Pending channel reports appear here.' },
        };

        const VIDEO_EXTS = new Set(['mp4', 'mov', 'm4v', 'webm', 'qt']);

        // ---- Small helpers ----

        function humanize(value) {
            const text = String(value ?? '').replace(/_/g, ' ').toLowerCase();
            return text.charAt(0).toUpperCase() + text.slice(1);
        }

        function reasonLabel(code) {
            if (!code) return 'Unknown';
            return REASON_LABELS[code] || LEGACY_REASON_LABELS[code] || humanize(code);
        }

        function typeMeta(type) {
            return TYPE_META[type] || { label: humanize(type || 'content'), tone: '' };
        }

        function typeBadge(type) {
            const meta = typeMeta(type);
            return `<span class="badge ${meta.tone}">${esc(meta.label)}</span>`;
        }

        function shortId(id) {
            const text = String(id ?? '');
            return text.length > 16 ? `${text.slice(0, 8)}…${text.slice(-4)}` : text;
        }

        function idLabel(id) {
            if (!id) return '<span class="faint">Unknown</span>';
            return `<span class="mono" title="${esc(id)}">${esc(shortId(id))}</span>`;
        }

        function ownerLink(id, full = false) {
            if (!id) return '<span class="faint">Unknown</span>';
            const href = `users.html?id=${encodeURIComponent(id)}&env=${AdminShell.env}`;
            return `<a class="mono" href="${esc(href)}" title="${esc(id)}">${esc(full ? id : shortId(id))}</a>`;
        }

        // Only the backend's signed https URLs are ever loaded into the page.
        function safeMediaUrl(url) {
            return typeof url === 'string' && /^https:\/\//i.test(url) ? url : null;
        }

        function mediaKindOf(url) {
            let ext = '';
            try {
                ext = new URL(url).pathname.split('.').pop().toLowerCase();
            } catch (_) { /* not a URL: treat as image */ }
            return VIDEO_EXTS.has(ext) || url.includes('.mp4') ? 'video' : 'image';
        }

        function contentKey(content) {
            return `${content.content_type}:${content.content_id}`;
        }

        function isRecentTab(type = currentTab) {
            return type === 'recent_story' || type === 'recent_pin';
        }

        function recentContentType(type = currentTab) {
            return type === 'recent_pin' ? 'pin' : 'story';
        }

        function recentNoun() {
            return recentContentType() === 'pin' ? 'pins' : 'stories';
        }

        function getFilteredContent() {
            if (isRecentTab()) return recentContent;
            const all = reportedContent || [];
            return currentTab === 'all' ? all : all.filter(c => c.content_type === currentTab);
        }

        // ---- Loading: reported content ----

        function resolveContentId(report) {
            // Prefer explicit content_id from reports/submit.
            if (report.content_id) return report.content_id;
            // Legacy story/pin clients stored the content primary key as reported_id
            // with no content_id field. Never invent a path for messages: reported_id
            // is the sender user id, not an RTDB path.
            if (report.content_type === 'story' || report.content_type === 'pin') {
                return report.reported_id || null;
            }
            return null;
        }

        function groupReportsByContent(reports) {
            const grouped = {};

            for (const report of reports) {
                if (!report.content_type || report.content_type === 'user') continue;

                const contentId = resolveContentId(report);
                if (!contentId) continue;

                const key = `${report.content_type}:${contentId}`;
                if (!grouped[key]) {
                    grouped[key] = {
                        content_type: report.content_type,
                        content_id: String(contentId),
                        // reported_id is content owner for message reports; for legacy
                        // story/pin it may still be the content primary key.
                        content_owner_id: report.reported_id || report.reported_user_id || report.target_id,
                        content_preview_url: report.content_preview_url,
                        content_text: report.content_text,
                        reports: [],
                    };
                }
                grouped[key].reports.push(report);
            }

            return Object.values(grouped).sort((a, b) => b.reports.length - a.reports.length);
        }

        // A refresh keeps the current cards on screen (the button shows the wait).
        async function loadContent({ quiet = false } = {}) {
            reportedLoading = true;
            if (!isRecentTab() && (!quiet || reportedContent === null)) {
                ui.loading(grid, 'Loading reported content…');
            }
            try {
                // Backend is GET /reports/list?status=… (has_content filtered client-side).
                const data = await AdminShell.api(
                    'social',
                    '/reports/list?status=' + encodeURIComponent('pending'),
                    null,
                    { method: 'GET' }
                );
                reportedContent = groupReportsByContent(data.reports || data.items || []);
                updateCounts();
                if (!isRecentTab()) renderContent();
            } catch (error) {
                if (!isRecentTab()) {
                    ui.error(grid, { title: "Couldn't load reported content", error, onRetry: () => loadContent() });
                }
            } finally {
                reportedLoading = false;
            }
        }

        function updateCounts() {
            const all = reportedContent || [];
            const counts = { all: all.length };
            ['story', 'pin', 'message', 'channel'].forEach(type => {
                counts[type] = all.filter(c => c.content_type === type).length;
            });
            document.querySelectorAll('[data-count-for]').forEach(el => {
                el.textContent = reportedContent ? String(counts[el.dataset.countFor]) : '';
            });
        }

        // ---- Loading: recent stories and pins ----

        function normalizeRecentItem(item, contentType) {
            const contentId =
                item.content_id ||
                item.id ||
                item.story_id ||
                item.pin_id ||
                '';
            const ownerId =
                item.owner_id ||
                item.user_id ||
                item.content_owner_id ||
                item.uid ||
                item.author_id ||
                null;
            const title =
                item.title ||
                item.name ||
                item.type ||
                item.pin_type ||
                item.media_type ||
                contentType;
            const previewUrl =
                item.content_preview_url ||
                item.preview_url ||
                item.media_url ||
                item.image_url ||
                item.thumbnail_url ||
                null;
            const text =
                item.content_text ||
                item.text ||
                item.caption ||
                item.body ||
                item.message ||
                null;

            return {
                content_type: contentType,
                content_id: String(contentId),
                content_owner_id: ownerId,
                created_at: item.created_at || item.createdAt || item.timestamp || null,
                title: title,
                content_preview_url: previewUrl,
                content_text: text,
                reports: [],
            };
        }

        async function loadRecent({ lastKey = null, page = 1, quiet = false } = {}) {
            const seq = ++recentSeq;
            const contentType = recentContentType();
            const noun = recentNoun();
            if (!quiet || !recentContent.length) {
                ui.loading(grid, `Loading recent ${noun}…`);
                clearPager();
            }

            const body = { content_type: contentType, limit: 20 };
            if (lastKey) body.last_key = lastKey;

            try {
                const data = await AdminShell.api('realtime', '/admin/content/recent', body);
                if (seq !== recentSeq || !isRecentTab()) return;

                const rawItems =
                    data.items ||
                    data.stories ||
                    data.pins ||
                    data.content ||
                    [];

                recentContent = rawItems.map(item => normalizeRecentItem(item, contentType));
                storedLastKey = data.last_key || null;
                recentPage = page;
                renderRecent();
            } catch (error) {
                if (seq !== recentSeq || !isRecentTab()) return;
                ui.error(grid, { title: `Couldn't load recent ${noun}`, error, onRetry: () => loadRecent({ lastKey, page }) });
                clearPager();
            }
        }

        // ---- Tabs ----

        function selectTab(type) {
            currentTab = type;
            document.querySelectorAll('#tabs button[data-type]').forEach(btn => {
                btn.setAttribute('aria-pressed', String(btn.dataset.type === type));
            });

            if (isRecentTab()) {
                recentContent = [];
                storedLastKey = null;
                recentPage = 1;
                loadRecent();
                return;
            }

            clearPager();
            if (reportedContent !== null) {
                renderContent();
            } else if (reportedLoading) {
                ui.loading(grid, 'Loading reported content…');
            } else {
                loadContent();
            }
        }

        // ---- Rendering ----

        function renderContent() {
            const items = getFilteredContent();
            if (!items.length) {
                const next = { all: 'recent_story', story: 'recent_story', pin: 'recent_pin' }[currentTab];
                ui.empty(grid, {
                    ...REPORTED_EMPTY[currentTab],
                    icon: 'flag',
                    ...(next ? {
                        actionLabel: next === 'recent_pin' ? 'Browse recent pins' : 'Browse recent stories',
                        onAction: () => selectTab(next),
                    } : {}),
                });
                return;
            }
            // Every field is untrusted, so all of it goes through esc(); actions
            // read data attributes and find the content by key.
            grid.innerHTML = items.map(renderReportedCard).join('');
        }

        function renderRecent() {
            if (!recentContent.length) {
                const noun = recentNoun();
                ui.empty(grid, {
                    title: `No recent ${noun}`,
                    body: `${humanize(noun)} appear here as people post them.`,
                    icon: recentContentType() === 'pin' ? 'pin' : 'image',
                });
            } else {
                grid.innerHTML = recentContent.map(renderRecentCard).join('');
            }
            renderPager();
        }

        function renderReportedCard(content) {
            const count = content.reports.length;
            return `
                <article class="item content-card" data-key="${esc(contentKey(content))}">
                    <div class="item-head">
                        <div class="item-title">${typeBadge(content.content_type)}</div>
                        <span class="badge bad">${count} report${count === 1 ? '' : 's'}</span>
                    </div>
                    <div class="content-preview" data-preview>${cardPreview(content)}</div>
                    <dl class="kv">
                        <dt>Content ID</dt><dd>${idLabel(content.content_id)}</dd>
                        <dt>Owner</dt><dd>${ownerLink(content.content_owner_id)}</dd>
                        <dt>Top reason</dt><dd>${esc(getTopReason(content.reports))}</dd>
                    </dl>
                    <div class="item-actions">
                        <button type="button" class="btn sm" data-action="details">View details</button>
                        <button type="button" class="btn sm" data-action="dismiss">Dismiss</button>
                        <span class="spacer"></span>
                        <button type="button" class="btn sm danger" data-action="remove">Remove</button>
                    </div>
                </article>`;
        }

        function renderRecentCard(content) {
            const title = String(content.title || '');
            const showTitle = title && title.toLowerCase() !== content.content_type;
            return `
                <article class="item content-card" data-key="${esc(contentKey(content))}">
                    <div class="item-head">
                        <div class="item-title">${typeBadge(content.content_type)}</div>
                        ${showTitle ? `<span class="content-title" title="${esc(title)}">${esc(title)}</span>` : ''}
                    </div>
                    <div class="content-preview" data-preview>${cardPreview(content)}</div>
                    <dl class="kv">
                        <dt>Content ID</dt><dd>${idLabel(content.content_id)}</dd>
                        <dt>Owner</dt><dd>${ownerLink(content.content_owner_id)}</dd>
                        <dt>Created</dt><dd>${ui.timeTag(content.created_at)}</dd>
                    </dl>
                    <div class="item-actions">
                        <span class="spacer"></span>
                        <button type="button" class="btn sm danger" data-action="remove">Remove</button>
                    </div>
                </article>`;
        }

        // Card preview: media opens full size (ui.media); text is clipped.
        function cardPreview(content) {
            const url = safeMediaUrl(content.content_preview_url);
            if (url) {
                const kind = mediaKindOf(url);
                const label = kind === 'video' ? 'Open video' : 'Open image';
                const face = kind === 'video'
                    ? `<video src="${esc(url)}" preload="metadata" muted playsinline></video><span class="play-badge">${ui.icon('play')}</span>`
                    : `<img src="${esc(url)}" alt="" loading="lazy">`;
                return `<button type="button" class="preview-btn" data-media-src="${esc(url)}" data-media-kind="${kind}"
                            title="${label}" aria-label="${label}">${face}</button>`;
            }
            if (content.content_text) {
                const text = String(content.content_text);
                const shown = text.length > 100 ? `${text.slice(0, 100)}…` : text;
                return `<div class="text-preview">"${esc(shown)}"</div>`;
            }
            if (content.content_preview_url) return '<span class="no-preview">Preview unavailable</span>';
            return '<span class="no-preview">No preview available</span>';
        }

        function getTopReason(reports) {
            const counts = {};
            for (const report of reports) {
                const reason = report.reason_code || report.reason || 'UNKNOWN';
                counts[reason] = (counts[reason] || 0) + 1;
            }
            const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
            return top ? reasonLabel(top[0]) : 'Unknown';
        }

        // ---- Pager (recent tabs). Keys stay in JS (storedLastKey), never in the DOM. ----

        function clearPager() {
            pager.hidden = true;
            pager.innerHTML = '';
        }

        function renderPager() {
            if (recentPage <= 1 && !storedLastKey) {
                clearPager();
                return;
            }
            pager.hidden = false;
            pager.innerHTML = `
                <button type="button" class="btn sm" data-page="first"${recentPage <= 1 ? ' disabled' : ''}>First page</button>
                <span class="muted">Page ${recentPage}</span>
                <button type="button" class="btn sm" data-page="next"${storedLastKey ? '' : ' disabled'}>Next page</button>`;
        }

        // ---- Details dialog ----

        function detailsBody(content) {
            const url = safeMediaUrl(content.content_preview_url);
            const reports = content.reports || [];
            let preview = '';
            if (url) {
                const face = mediaKindOf(url) === 'video'
                    ? `<video src="${esc(url)}" controls preload="metadata" playsinline></video>`
                    : `<img src="${esc(url)}" alt="Reported content">`;
                preview = `<div class="preview-area" data-preview>${face}</div>`;
            } else if (content.content_preview_url) {
                preview = '<div class="preview-area"><span class="no-preview">Preview unavailable</span></div>';
            }
            const text = content.content_text
                ? `<div class="label-sm">Text</div><div class="quote">${esc(content.content_text)}</div>`
                : '';
            if (!preview && !text) {
                preview = '<div class="preview-area"><span class="no-preview">No preview available</span></div>';
            }

            return `
                ${preview}
                ${text}
                <dl class="kv">
                    <dt>Content ID</dt><dd class="mono">${esc(content.content_id)}</dd>
                    <dt>Content owner</dt><dd>${ownerLink(content.content_owner_id, true)}</dd>
                </dl>
                <h3 class="detail-heading">Reports (${reports.length})</h3>
                <div class="report-rows">${reports.map(reportRow).join('')}</div>`;
        }

        function reportRow(report) {
            return `
                <div class="report-row">
                    <div class="report-row-head">
                        <span class="report-reason">${esc(reasonLabel(report.reason_code || report.reason))}</span>
                        <span class="item-time">${ui.timeTag(report.created_at)}</span>
                    </div>
                    ${report.details ? `<div class="report-details">${esc(report.details)}</div>` : ''}
                </div>`;
        }

        function showDetails(content) {
            ui.dialog({
                title: `${typeMeta(content.content_type).label} details`,
                wide: true,
                body: detailsBody(content),
                actions: [
                    { label: 'Dismiss reports', onClick: async (close, button) => { if (await dismissReports(content, button)) close(); } },
                    { label: 'Remove content', kind: 'danger', onClick: async (close, button) => { if (await removeContent(content, button)) close(); } },
                ],
            });
        }

        // ---- Actions ----

        // Both lists drop the content, then the current view redraws.
        function dropContent(content, { fromRecent = true } = {}) {
            const same = (c) => contentKey(c) === contentKey(content);
            if (reportedContent) reportedContent = reportedContent.filter(c => !same(c));
            if (fromRecent) recentContent = recentContent.filter(c => !same(c));
            updateCounts();
            if (isRecentTab()) renderRecent(); else renderContent();
        }

        // Resolves true when the content was removed.
        async function removeContent(content, button) {
            const noun = typeMeta(content.content_type).label.toLowerCase();
            const values = await ui.confirm({
                title: `Remove this ${noun}?`,
                body: esc(`This permanently removes the ${noun} and notifies the owner.`),
                confirmLabel: 'Remove',
                destructive: true,
                fields: [
                    { name: 'reason_code', label: 'Reason', type: 'select', options: REASON_OPTIONS, required: true, placeholder: 'Choose a reason…' },
                    { name: 'notes', label: 'Notes', type: 'textarea', placeholder: 'Explain the removal decision (optional)' },
                ],
            });
            if (!values) return false;

            const firstReportId = (content.reports || [])
                .map(r => r.report_id || r.id)
                .find(Boolean);
            const body = {
                content_type: content.content_type,
                content_id: content.content_id,
                reason_code: values.reason_code,
                reason_text: values.notes,
            };
            if (firstReportId) body.source_report_id = firstReportId;

            try {
                await ui.busy(button, () => AdminShell.api('realtime', '/admin/content/remove', body));
            } catch (error) {
                ui.notice(`Couldn't remove content: ${error.message}`, { tone: 'bad' });
                return false;
            }
            // The card leaves the grid, which is the confirmation.
            dropContent(content);
            return true;
        }

        // Resolves true when every report was dismissed.
        async function dismissReports(content, button) {
            const reports = content.reports || [];
            const confirmed = await ui.confirm({
                title: 'Dismiss all reports for this content?',
                body: esc(`Closes ${reports.length} report${reports.length === 1 ? '' : 's'} with no action. The content stays visible.`),
                confirmLabel: 'Dismiss',
            });
            if (!confirmed) return false;

            let done = 0;
            try {
                await ui.busy(button, async () => {
                    for (const report of reports) {
                        const reportId = report.report_id || report.id;
                        if (!reportId) continue;
                        await AdminShell.api('social', '/reports/action', {
                            report_id: reportId,
                            action: 'dismissed',
                        });
                        done++;
                    }
                });
            } catch (error) {
                ui.notice(`Couldn't dismiss reports: ${error.message}`, { tone: 'bad' });
                // Reports dismissed before the failure are already closed on the server.
                if (done) loadContent({ quiet: true });
                return false;
            }
            dropContent(content, { fromRecent: false });
            return true;
        }

        // ---- Wiring ----

        document.getElementById('tabs').addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-type]');
            if (btn && btn.dataset.type !== currentTab) selectTab(btn.dataset.type);
        });

        grid.addEventListener('click', (e) => {
            const tile = e.target.closest('[data-media-src]');
            if (tile) {
                ui.media(tile.dataset.mediaSrc, tile.dataset.mediaKind);
                return;
            }
            const button = e.target.closest('button[data-action]');
            const card = button && button.closest('[data-key]');
            if (!card) return;
            const content = getFilteredContent().find(c => contentKey(c) === card.dataset.key);
            if (!content) return;
            if (button.dataset.action === 'details') showDetails(content);
            else if (button.dataset.action === 'dismiss') dismissReports(content, button);
            else if (button.dataset.action === 'remove') removeContent(content, button);
        });

        pager.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-page]');
            if (!btn || !isRecentTab()) return;
            if (btn.dataset.page === 'first') {
                ui.busy(btn, () => loadRecent({ quiet: true }));
            } else if (storedLastKey) {
                ui.busy(btn, () => loadRecent({ lastKey: storedLastKey, page: recentPage + 1, quiet: true }));
            }
        });

        // Signed URLs expire after an hour (Refresh re-signs); label the preview
        // instead of showing a broken image. Media errors don't bubble.
        document.addEventListener('error', (e) => {
            if (!e.target || !['IMG', 'VIDEO'].includes(e.target.tagName)) return;
            const holder = e.target.closest('[data-preview]');
            if (holder) holder.innerHTML = '<span class="no-preview">Preview unavailable</span>';
        }, true);

        AdminShell.init({ active: 'content.html', title: 'Content', onReady: () => loadContent() });

        document.getElementById('page-actions').innerHTML =
            `<button type="button" class="btn" id="refresh">${ui.icon('refresh')}Refresh</button>`;
        document.getElementById('refresh').addEventListener('click', (e) => ui.busy(
            e.currentTarget,
            () => (isRecentTab() ? loadRecent({ quiet: true }) : loadContent({ quiet: true }))
        ));
    </script>
</body>
</html>
