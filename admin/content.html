<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content — DSCO Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        /* Page-specific: tabs, content grid, remove/preview modals */

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            background: var(--panel);
            padding: 6px;
            border-radius: var(--radius-sm);
            width: fit-content;
            border: 1px solid var(--line);
        }

        .tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: var(--ink-50);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
        }

        .tab:hover {
            color: var(--ink);
            background: var(--accent-dim);
        }

        .tab.active {
            background: var(--info-bg);
            color: var(--info);
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .content-card {
            background: var(--panel);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--line);
        }

        .content-card-header {
            padding: 16px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content-type-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .content-type-badge.story { background: var(--purple-bg); color: var(--purple); }
        .content-type-badge.pin { background: var(--info-bg); color: var(--info); }
        .content-type-badge.message { background: var(--good-bg); color: var(--good); }

        .report-count {
            font-size: 0.8rem;
            color: var(--bad);
        }

        .content-preview {
            padding: 16px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel-2);
        }

        .content-preview img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
        }

        .content-preview .text-preview {
            color: var(--ink-50);
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        .content-preview .no-preview {
            color: var(--ink-35);
            font-size: 0.9rem;
        }

        .content-meta {
            padding: 16px;
            border-top: 1px solid var(--line);
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .meta-row:last-child {
            margin-bottom: 0;
        }

        .meta-label {
            color: var(--ink-50);
        }

        .meta-value {
            color: var(--ink);
        }

        .meta-value.user-link {
            color: var(--info);
            text-decoration: none;
        }

        .meta-value.user-link:hover {
            text-decoration: underline;
        }

        .content-actions {
            padding: 16px;
            display: flex;
            gap: 8px;
            border-top: 1px solid var(--line);
        }

        .content-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: inherit;
        }

        .btn-view {
            background: var(--accent-dim);
            color: var(--ink);
        }

        .btn-view:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .btn-remove {
            background: var(--bad);
            color: #fff;
        }

        .btn-remove:hover {
            filter: brightness(0.9);
        }

        .btn-dismiss {
            background: var(--good);
            color: #0a0a0c;
        }

        .btn-dismiss:hover {
            filter: brightness(0.95);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--ink-50);
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--ink-50);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .error-message {
            background: var(--bad-bg);
            border: 1px solid var(--bad);
            color: var(--bad);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: var(--good-bg);
            border: 1px solid var(--good);
            color: var(--good);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        /* Remove / Preview Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--panel);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
        }

        .modal h3 {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal .close-btn {
            background: none;
            border: none;
            color: var(--ink);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--ink-50);
        }

        .modal select,
        .modal textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            background: var(--panel-2);
            color: var(--ink);
            font-size: 14px;
            font-family: inherit;
        }

        .modal select option {
            background: var(--panel-2);
        }

        .modal textarea {
            min-height: 100px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
        }

        .modal-actions .btn-cancel {
            background: var(--accent-dim);
            color: var(--ink);
        }

        .modal-actions .btn-confirm {
            background: var(--bad);
            color: #fff;
        }

        .modal-actions .btn-confirm:hover {
            filter: brightness(0.9);
        }

        .modal-actions .btn-confirm:disabled {
            background: var(--ink-35);
            cursor: not-allowed;
            filter: none;
        }

        .preview-modal-content {
            max-width: 700px;
        }

        .preview-modal-content .preview-area {
            background: var(--panel-2);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            text-align: center;
        }

        .preview-modal-content .preview-area img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
        }

        .preview-modal-content .preview-area video {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
        }

        .preview-modal-content .message-bubble {
            background: var(--info-bg);
            color: var(--info);
            padding: 12px 16px;
            border-radius: 16px;
            display: inline-block;
            max-width: 80%;
            text-align: left;
        }

        .report-list {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
        }

        .report-item {
            background: var(--panel-2);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .report-item:last-child {
            margin-bottom: 0;
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .report-reason {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .report-time {
            font-size: 0.75rem;
            color: var(--ink-50);
        }

        .report-details {
            font-size: 0.85rem;
            color: var(--ink-70);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 16px;
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--ink);
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--info-bg);
            color: var(--info);
            border-color: var(--info);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>

        <div class="tabs">
            <button class="tab active" data-type="all" onclick="switchTab('all')">All</button>
            <button class="tab" data-type="story" onclick="switchTab('story')">Stories</button>
            <button class="tab" data-type="pin" onclick="switchTab('pin')">Pins</button>
            <button class="tab" data-type="message" onclick="switchTab('message')">Messages</button>
            <button class="tab" data-type="recent_story" onclick="switchTab('recent_story')">Recent stories</button>
            <button class="tab" data-type="recent_pin" onclick="switchTab('recent_pin')">Recent pins</button>
        </div>

        <div class="content-grid" id="content-grid">
            <div class="loading">Loading reported content...</div>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>

    <!-- Remove Content Modal -->
    <div class="modal" id="remove-modal">
        <div class="modal-content">
            <h3>
                Remove Content
                <button class="close-btn" onclick="closeRemoveModal()">&times;</button>
            </h3>
            <p style="margin-bottom: 16px; color: var(--ink-50);">
                This will permanently remove the content and notify the owner.
            </p>
            <label>Reason Code</label>
            <select id="remove-reason-code">
                <option value="">Select reason...</option>
                <option value="HARASSMENT">Harassment</option>
                <option value="HATE_SPEECH">Hate Speech</option>
                <option value="SEXUAL_CONTENT">Sexual Content</option>
                <option value="MINOR_SAFETY">Minor Safety</option>
                <option value="SPAM">Spam</option>
                <option value="IMPERSONATION">Impersonation</option>
                <option value="SELF_HARM">Self-Harm</option>
                <option value="VIOLENCE">Violence</option>
                <option value="ILLEGAL_CONTENT">Illegal Content</option>
                <option value="PRIVACY_VIOLATION">Privacy Violation</option>
                <option value="OTHER">Other</option>
            </select>
            <label>Additional Notes (optional)</label>
            <textarea id="remove-notes" placeholder="Explain the removal decision..."></textarea>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeRemoveModal()">Cancel</button>
                <button class="btn-confirm" id="confirm-remove-btn" onclick="confirmRemove()">Remove Content</button>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal" id="preview-modal">
        <div class="modal-content preview-modal-content">
            <h3>
                <span id="preview-title">Content Preview</span>
                <button class="close-btn" onclick="closePreviewModal()">&times;</button>
            </h3>
            <div class="preview-area" id="preview-area">
                <!-- Content loaded dynamically -->
            </div>
            <div id="preview-meta"></div>
            <div class="report-list" id="report-list">
                <h4 style="margin-bottom: 12px; font-size: 0.9rem; color: var(--ink-50);">Reports</h4>
                <!-- Reports loaded dynamically -->
            </div>
            <div class="modal-actions" style="margin-top: 16px;">
                <button class="btn-dismiss" onclick="dismissReports()">Dismiss Reports</button>
                <button class="btn-remove" onclick="showRemoveFromPreview()">Remove Content</button>
            </div>
        </div>
    </div>

    <script src="assets/admin.js"></script>
    <script>
        let currentTab = 'all';
        let reportedContent = [];
        let recentContent = [];
        let selectedContent = null;
        let storedLastKey = null;
        let hasMore = false;

        const REASON_LABELS = {
            'HARASSMENT': 'Harassment',
            'HATE_SPEECH': 'Hate Speech',
            'SEXUAL_CONTENT': 'Sexual Content',
            'MINOR_SAFETY': 'Minor Safety',
            'SPAM': 'Spam',
            'IMPERSONATION': 'Impersonation',
            'SELF_HARM': 'Self-Harm',
            'VIOLENCE': 'Violence',
            'ILLEGAL_CONTENT': 'Illegal Content',
            'PRIVACY_VIOLATION': 'Privacy Violation',
            'OTHER': 'Other'
        };

        // --- Content Management ---

        function isRecentTab(type = currentTab) {
            return type === 'recent_story' || type === 'recent_pin';
        }

        function recentContentType(type = currentTab) {
            return type === 'recent_pin' ? 'pin' : 'story';
        }

        function clearPagination() {
            storedLastKey = null;
            hasMore = false;
            const pagination = document.getElementById('pagination');
            if (pagination) pagination.innerHTML = '';
        }

        async function loadContent() {
            const grid = document.getElementById('content-grid');
            grid.innerHTML = '<div class="loading">Loading reported content...</div>';
            clearPagination();
            hideError();
            hideSuccess();

            try {
                // Backend is GET /reports/list?status=… (has_content filtered client-side).
                const data = await AdminShell.api(
                    'social',
                    '/reports/list?status=' + encodeURIComponent('pending'),
                    null,
                    { method: 'GET' }
                );

                reportedContent = data.reports || data.items || [];

                // Group reports by content
                reportedContent = groupReportsByContent(reportedContent);

                if (!isRecentTab()) renderContent();

            } catch (error) {
                console.error('Error loading content:', error);
                showError(error.message || 'Failed to load reported content.');
                if (!isRecentTab()) {
                    grid.innerHTML = '<div class="empty"><div class="empty-icon">❌</div><p>Failed to load content</p></div>';
                }
            }
        }

        async function loadRecentContent(lastKey = null) {
            const grid = document.getElementById('content-grid');
            const contentType = recentContentType();
            grid.innerHTML = `<div class="loading">Loading recent ${contentType === 'pin' ? 'pins' : 'stories'}...</div>`;
            hideError();
            hideSuccess();

            const body = {
                content_type: contentType,
                limit: 20,
            };
            if (lastKey) body.last_key = lastKey;

            try {
                const data = await AdminShell.api('realtime', '/admin/content/recent', body);

                const rawItems =
                    data.items ||
                    data.stories ||
                    data.pins ||
                    data.content ||
                    [];

                recentContent = rawItems.map(item => normalizeRecentItem(item, contentType));
                storedLastKey = data.last_key || null;
                hasMore = !!storedLastKey;

                renderRecentContent();
            } catch (error) {
                console.error('Error loading recent content:', error);
                showError(error.message || 'Failed to load recent content.');
                grid.innerHTML = '<div class="empty"><div class="empty-icon">❌</div><p>Failed to load content</p></div>';
                clearPagination();
            }
        }

        function normalizeRecentItem(item, contentType) {
            const contentId =
                item.content_id ||
                item.id ||
                item.story_id ||
                item.pin_id ||
                '';
            const ownerId =
                item.owner_id ||
                item.user_id ||
                item.content_owner_id ||
                item.uid ||
                item.author_id ||
                null;
            const title =
                item.title ||
                item.name ||
                item.type ||
                item.pin_type ||
                item.media_type ||
                contentType;
            const previewUrl =
                item.content_preview_url ||
                item.preview_url ||
                item.media_url ||
                item.image_url ||
                item.thumbnail_url ||
                null;
            const text =
                item.content_text ||
                item.text ||
                item.caption ||
                item.body ||
                item.message ||
                null;

            return {
                content_type: contentType,
                content_id: String(contentId),
                content_owner_id: ownerId,
                created_at: item.created_at || item.createdAt || item.timestamp || null,
                title: title,
                content_preview_url: previewUrl,
                content_text: text,
                reports: [],
            };
        }

        function loadRecentFirstPage() {
            storedLastKey = null;
            loadRecentContent(null);
        }

        function loadRecentNextPage() {
            if (storedLastKey) loadRecentContent(storedLastKey);
        }

        function resolveContentId(report) {
            // Prefer explicit content_id from reports/submit.
            if (report.content_id) return report.content_id;
            // Legacy story/pin clients stored the content primary key as reported_id
            // with no content_id field. Never invent a path for messages — reported_id
            // is the sender user id, not an RTDB path.
            if (report.content_type === 'story' || report.content_type === 'pin') {
                return report.reported_id || null;
            }
            return null;
        }

        function groupReportsByContent(reports) {
            const grouped = {};

            for (const report of reports) {
                if (!report.content_type || report.content_type === 'user') continue;

                const contentId = resolveContentId(report);
                if (!contentId) continue;

                const key = `${report.content_type}:${contentId}`;
                if (!grouped[key]) {
                    grouped[key] = {
                        content_type: report.content_type,
                        content_id: contentId,
                        // reported_id is content owner for message reports; for legacy
                        // story/pin it may still be the content primary key.
                        content_owner_id: report.reported_id || report.reported_user_id || report.target_id,
                        content_preview_url: report.content_preview_url,
                        content_text: report.content_text,
                        reports: []
                    };
                }
                grouped[key].reports.push(report);
            }

            return Object.values(grouped).sort((a, b) => b.reports.length - a.reports.length);
        }

        function switchTab(type) {
            currentTab = type;
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.type === type);
            });

            if (isRecentTab(type)) {
                storedLastKey = null;
                loadRecentContent(null);
            } else {
                clearPagination();
                renderContent();
            }
        }

        function renderContent() {
            const grid = document.getElementById('content-grid');

            let filtered = reportedContent;
            if (currentTab !== 'all') {
                filtered = reportedContent.filter(c => c.content_type === currentTab);
            }

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty" style="grid-column: 1 / -1;">
                        <div class="empty-icon">✨</div>
                        <p>No reported content to review</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map((content, idx) => `
                <div class="content-card" data-index="${idx}">
                    <div class="content-card-header">
                        <span class="content-type-badge ${content.content_type}">${content.content_type}</span>
                        <span class="report-count">${content.reports.length} report${content.reports.length > 1 ? 's' : ''}</span>
                    </div>
                    <div class="content-preview">
                        ${getPreviewHtml(content)}
                    </div>
                    <div class="content-meta">
                        <div class="meta-row">
                            <span class="meta-label">Content ID</span>
                            <span class="meta-value" style="font-family:monospace;font-size:0.8rem;">${content.content_id.substring(0, 16)}...</span>
                        </div>
                        <div class="meta-row">
                            <span class="meta-label">Owner</span>
                            <a href="users.html?id=${content.content_owner_id}" class="meta-value user-link">${content.content_owner_id?.substring(0, 16) || 'Unknown'}...</a>
                        </div>
                        <div class="meta-row">
                            <span class="meta-label">Top reason</span>
                            <span class="meta-value">${getTopReason(content.reports)}</span>
                        </div>
                    </div>
                    <div class="content-actions">
                        <button class="btn-view" onclick="showPreview(${idx})">View details</button>
                        <button class="btn-remove" onclick="showRemoveModal(${idx})">Remove</button>
                    </div>
                </div>
            `).join('');
        }

        function renderRecentContent() {
            const grid = document.getElementById('content-grid');
            const contentType = recentContentType();

            if (recentContent.length === 0) {
                grid.innerHTML = `
                    <div class="empty" style="grid-column: 1 / -1;">
                        <div class="empty-icon">📭</div>
                        <p>No recent ${contentType === 'pin' ? 'pins' : 'stories'}</p>
                    </div>
                `;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            grid.innerHTML = recentContent.map((content, idx) => {
                const idDisplay = content.content_id
                    ? (content.content_id.length > 16
                        ? content.content_id.substring(0, 16) + '...'
                        : content.content_id)
                    : 'Unknown';
                const ownerDisplay = content.content_owner_id
                    ? (content.content_owner_id.length > 16
                        ? content.content_owner_id.substring(0, 16) + '...'
                        : content.content_owner_id)
                    : 'Unknown';
                const titleDisplay = escapeHtml(String(content.title || contentType));

                return `
                <div class="content-card" data-index="${idx}">
                    <div class="content-card-header">
                        <span class="content-type-badge ${content.content_type}">${content.content_type}</span>
                        <span class="meta-value" style="font-size:0.85rem;">${titleDisplay}</span>
                    </div>
                    <div class="content-preview">
                        ${getPreviewHtml(content)}
                    </div>
                    <div class="content-meta">
                        <div class="meta-row">
                            <span class="meta-label">Content ID</span>
                            <span class="meta-value" style="font-family:monospace;font-size:0.8rem;" title="${escapeHtml(content.content_id)}">${escapeHtml(idDisplay)}</span>
                        </div>
                        <div class="meta-row">
                            <span class="meta-label">Owner</span>
                            ${content.content_owner_id
                                ? `<a href="users.html?id=${encodeURIComponent(content.content_owner_id)}" class="meta-value user-link">${escapeHtml(ownerDisplay)}</a>`
                                : `<span class="meta-value">Unknown</span>`}
                        </div>
                        <div class="meta-row">
                            <span class="meta-label">Created</span>
                            <span class="meta-value">${formatTime(content.created_at)}</span>
                        </div>
                    </div>
                    <div class="content-actions">
                        <button class="btn-remove" onclick="showRemoveModal(${idx})">Remove</button>
                    </div>
                </div>
            `;
            }).join('');

            // Pagination — keys stay in JS (storedLastKey), never JSON-in-attribute
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = `
                <button type="button" id="page-first">First</button>
                <button type="button" id="page-next" ${!hasMore ? 'disabled' : ''}>Next</button>
            `;
            document.getElementById('page-first').addEventListener('click', loadRecentFirstPage);
            document.getElementById('page-next').addEventListener('click', loadRecentNextPage);
        }

        function getPreviewHtml(content) {
            if (content.content_preview_url) {
                if (content.content_type === 'story') {
                    return `<img src="${content.content_preview_url}" alt="Story preview" onerror="this.parentElement.innerHTML='<span class=\\'no-preview\\'>Preview unavailable</span>'">`;
                }
                return `<img src="${content.content_preview_url}" alt="Content preview" onerror="this.parentElement.innerHTML='<span class=\\'no-preview\\'>Preview unavailable</span>'">`;
            }

            if (content.content_text) {
                const truncated = content.content_text.length > 100
                    ? content.content_text.substring(0, 100) + '...'
                    : content.content_text;
                return `<div class="text-preview">"${escapeHtml(truncated)}"</div>`;
            }

            return '<span class="no-preview">No preview available</span>';
        }

        function getTopReason(reports) {
            const counts = {};
            for (const report of reports) {
                const reason = report.reason_code || report.reason || 'UNKNOWN';
                counts[reason] = (counts[reason] || 0) + 1;
            }
            const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
            return REASON_LABELS[top[0]] || top[0];
        }

        function showPreview(idx) {
            const content = getFilteredContent()[idx];
            if (!content) return;

            selectedContent = content;

            document.getElementById('preview-title').textContent =
                `${content.content_type.charAt(0).toUpperCase() + content.content_type.slice(1)} preview`;

            const previewArea = document.getElementById('preview-area');
            if (content.content_preview_url) {
                if (content.content_type === 'story' && content.content_preview_url.includes('.mp4')) {
                    previewArea.innerHTML = `<video src="${content.content_preview_url}" controls></video>`;
                } else {
                    previewArea.innerHTML = `<img src="${content.content_preview_url}" alt="Preview" onerror="this.outerHTML='<span class=\\'no-preview\\'>Preview unavailable</span>'">`;
                }
            } else if (content.content_text) {
                previewArea.innerHTML = `<div class="message-bubble">${escapeHtml(content.content_text)}</div>`;
            } else {
                previewArea.innerHTML = '<span class="no-preview">No preview available</span>';
            }

            document.getElementById('preview-meta').innerHTML = `
                <div class="meta-row">
                    <span class="meta-label">Content ID</span>
                    <span class="meta-value" style="font-family:monospace;">${content.content_id}</span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">Content owner</span>
                    <a href="users.html?id=${content.content_owner_id}" class="meta-value user-link">${content.content_owner_id}</a>
                </div>
            `;

            const reportList = document.getElementById('report-list');
            reportList.innerHTML = `
                <h4 style="margin-bottom: 12px; font-size: 0.9rem; color: var(--ink-50);">Reports (${content.reports.length})</h4>
                ${content.reports.map(report => `
                    <div class="report-item">
                        <div class="report-header">
                            <span class="report-reason">${REASON_LABELS[report.reason_code || report.reason] || report.reason_code || report.reason}</span>
                            <span class="report-time">${formatTime(report.created_at)}</span>
                        </div>
                        ${report.details ? `<div class="report-details">${escapeHtml(report.details)}</div>` : ''}
                    </div>
                `).join('')}
            `;

            document.getElementById('preview-modal').classList.add('active');
        }

        function closePreviewModal() {
            document.getElementById('preview-modal').classList.remove('active');
            selectedContent = null;
        }

        function showRemoveFromPreview() {
            if (!selectedContent) return;
            // Keep selection; only close preview (do not null selectedContent).
            document.getElementById('preview-modal').classList.remove('active');
            document.getElementById('remove-reason-code').value = '';
            document.getElementById('remove-notes').value = '';
            document.getElementById('remove-modal').classList.add('active');
        }

        function getFilteredContent() {
            if (isRecentTab()) return recentContent;
            if (currentTab === 'all') return reportedContent;
            return reportedContent.filter(c => c.content_type === currentTab);
        }

        function showRemoveModal(idx) {
            const content = getFilteredContent()[idx];
            if (!content) return;

            selectedContent = content;
            document.getElementById('remove-reason-code').value = '';
            document.getElementById('remove-notes').value = '';
            document.getElementById('remove-modal').classList.add('active');
        }

        function closeRemoveModal() {
            document.getElementById('remove-modal').classList.remove('active');
        }

        async function confirmRemove() {
            if (!selectedContent) return;

            const reasonCode = document.getElementById('remove-reason-code').value;
            const notes = document.getElementById('remove-notes').value.trim();

            if (!reasonCode) {
                alert('Please select a reason code.');
                return;
            }

            const btn = document.getElementById('confirm-remove-btn');
            btn.disabled = true;
            btn.textContent = 'Removing...';

            const content = selectedContent;
            const firstReportId = (content.reports || [])
                .map(r => r.report_id || r.id)
                .find(Boolean);

            try {
                const body = {
                    content_type: content.content_type,
                    content_id: content.content_id,
                    reason_code: reasonCode,
                    reason_text: notes,
                };
                if (firstReportId) body.source_report_id = firstReportId;

                await AdminShell.api('realtime', '/admin/content/remove', body);

                showSuccess('Content removed successfully.');
                closeRemoveModal();

                if (isRecentTab()) {
                    recentContent = recentContent.filter(c =>
                        !(c.content_type === content.content_type && c.content_id === content.content_id)
                    );
                    selectedContent = null;
                    renderRecentContent();
                } else {
                    reportedContent = reportedContent.filter(c =>
                        !(c.content_type === content.content_type && c.content_id === content.content_id)
                    );
                    selectedContent = null;
                    renderContent();
                }

            } catch (error) {
                console.error('Error removing content:', error);
                showError(`Failed to remove content: ${error.message}`);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Remove content';
            }
        }

        async function dismissReports() {
            if (!selectedContent) return;

            if (!confirm('Dismiss all reports for this content? The content will remain visible.')) {
                return;
            }

            const content = selectedContent;

            try {
                for (const report of (content.reports || [])) {
                    const reportId = report.report_id || report.id;
                    if (!reportId) continue;

                    await AdminShell.api('social', '/reports/action', {
                        report_id: reportId,
                        action: 'dismissed'
                    });
                }

                showSuccess('Reports dismissed.');
                document.getElementById('preview-modal').classList.remove('active');

                reportedContent = reportedContent.filter(c =>
                    !(c.content_type === content.content_type && c.content_id === content.content_id)
                );
                selectedContent = null;
                renderContent();

            } catch (error) {
                console.error('Error dismissing reports:', error);
                showError(`Failed to dismiss reports: ${error.message}`);
            }
        }

        // --- Utilities ---

        function formatTime(isoString) {
            if (!isoString) return 'Unknown';
            const date = new Date(isoString);
            return date.toLocaleString();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            const el = document.getElementById('error-message');
            el.textContent = message;
            el.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }

        function showSuccess(message) {
            const el = document.getElementById('success-message');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(hideSuccess, 3000);
        }

        function hideSuccess() {
            document.getElementById('success-message').style.display = 'none';
        }

        // --- Event Listeners ---

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeRemoveModal();
                closePreviewModal();
            }
        });

        document.getElementById('remove-modal').addEventListener('click', (e) => {
            if (e.target.id === 'remove-modal') closeRemoveModal();
        });

        document.getElementById('preview-modal').addEventListener('click', (e) => {
            if (e.target.id === 'preview-modal') closePreviewModal();
        });

        AdminShell.init({ active: 'content.html', title: 'Content', onReady: loadContent });
    </script>
</body>
</html>
