<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit — DSCO Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-group label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--ink-50);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .filter-group input,
        .filter-group select {
            padding: 9px 14px;
            border: 1px solid var(--line-strong);
            border-radius: var(--pill);
            background: rgba(0, 0, 0, 0.35);
            color: var(--ink);
            font-family: var(--body);
            font-size: 0.9rem;
            min-width: 150px;
            outline: none;
            transition: border-color 0.15s;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            border-color: rgba(255, 255, 255, 0.35);
        }

        .filter-group select option {
            background: var(--panel);
        }

        .audit-table-wrap {
            overflow-x: auto;
        }

        .action-type {
            display: inline-block;
            padding: 3px 10px;
            border-radius: var(--pill);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .action-type.warned { background: var(--warn-bg); color: var(--warn); }
        .action-type.suspended { background: var(--orange-bg); color: var(--orange); }
        .action-type.banned { background: var(--bad-bg); color: var(--bad); }
        .action-type.reversed { background: var(--good-bg); color: var(--good); }
        .action-type.content_removed { background: var(--purple-bg); color: var(--purple); }

        .reason-code {
            font-size: 0.85rem;
            color: var(--ink-70);
        }

        .user-link {
            color: var(--info);
            text-decoration: none;
            font-weight: 600;
        }

        .user-link:hover { text-decoration: underline; }

        .timestamp {
            font-size: 0.85rem;
            color: var(--ink-50);
        }

        .link-btn {
            background: none;
            border: none;
            color: var(--info);
            cursor: pointer;
            font-family: var(--body);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0;
        }
        .link-btn:hover { text-decoration: underline; }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--ink-50);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .detail-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .detail-modal.active { display: flex; }

        .detail-modal-content {
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .detail-modal h3 {
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detail-modal .close-btn {
            background: none;
            border: none;
            color: var(--ink);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .detail-row {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
        }

        .detail-row:last-child { border-bottom: none; }

        .detail-label {
            width: 140px;
            color: var(--ink-50);
            font-size: 0.85rem;
        }

        .detail-value { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-banner" id="error-message"></div>

        <div class="filters">
            <div class="filter-group">
                <label>Target User ID</label>
                <input type="text" id="filter-target" placeholder="USER#...">
            </div>
            <div class="filter-group">
                <label>Actor (Admin) ID</label>
                <input type="text" id="filter-actor" placeholder="USER#...">
            </div>
            <div class="filter-group">
                <label>Action Type</label>
                <select id="filter-type">
                    <option value="">All</option>
                    <option value="warned">Warned</option>
                    <option value="suspended">Suspended</option>
                    <option value="banned">Banned</option>
                    <option value="reversed">Reversed</option>
                    <option value="content_removed">Content Removed</option>
                </select>
            </div>
            <div class="filter-group">
                <label>From Date</label>
                <input type="date" id="filter-from">
            </div>
            <div class="filter-group">
                <label>To Date</label>
                <input type="date" id="filter-to">
            </div>
            <button class="btn" onclick="applyFilters()">Search</button>
            <button class="btn ghost" onclick="clearFilters()">Clear</button>
        </div>

        <div class="section audit-table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Action</th>
                        <th>Target</th>
                        <th>Reason</th>
                        <th>Actor</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="audit-body">
                    <tr><td colspan="6" class="loading">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" id="pagination"></div>
    </div>

    <!-- Detail Modal -->
    <div class="detail-modal" id="detail-modal">
        <div class="detail-modal-content">
            <h3>
                Action Details
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </h3>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="assets/admin.js"></script>
    <script>
        let storedLastKey = null;
        let currentPage = null;
        let hasMore = false;

        const REASON_LABELS = {
            'HARASSMENT': 'Harassment',
            'HATE_SPEECH': 'Hate Speech',
            'SEXUAL_CONTENT': 'Sexual Content',
            'MINOR_SAFETY': 'Minor Safety',
            'SPAM': 'Spam',
            'IMPERSONATION': 'Impersonation',
            'SELF_HARM': 'Self-Harm',
            'VIOLENCE': 'Violence',
            'ILLEGAL_CONTENT': 'Illegal Content',
            'PRIVACY_VIOLATION': 'Privacy Violation',
            'OTHER': 'Other'
        };

        async function loadAuditLog(lastKey = null) {
            const tbody = document.getElementById('audit-body');
            tbody.innerHTML = '<tr><td colspan="6" class="loading">Loading audit log...</td></tr>';
            hideError();

            const targetId = document.getElementById('filter-target').value.trim();
            const actorId = document.getElementById('filter-actor').value.trim();
            const actionType = document.getElementById('filter-type').value;
            const fromDate = document.getElementById('filter-from').value;
            const toDate = document.getElementById('filter-to').value;

            // Backend requires at least one filter
            if (!targetId && !actorId && !actionType) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty">
                            <div class="empty-icon">🔍</div>
                            <p>Enter a filter to search the audit log</p>
                        </td>
                    </tr>
                `;
                document.getElementById('pagination').innerHTML = '';
                storedLastKey = null;
                currentPage = null;
                hasMore = false;
                return;
            }

            const requestBody = {};
            if (targetId) requestBody.target_id = targetId;
            if (actorId) requestBody.actor_id = actorId;
            if (actionType) requestBody.action_type = actionType;
            if (fromDate) requestBody.start_date = fromDate;
            if (toDate) requestBody.end_date = toDate;
            if (lastKey) requestBody.last_key = lastKey;

            try {
                const data = await AdminShell.api('realtime', '/admin/audit', requestBody);
                const actions = data.items || [];
                currentPage = lastKey;
                storedLastKey = data.last_key || null;
                hasMore = !!storedLastKey;

                renderAuditLog(actions);
            } catch (error) {
                console.error('Error loading audit log:', error);
                showError(error.message || 'Failed to load audit log.');
                tbody.innerHTML = '<tr><td colspan="6" class="empty">Failed to load</td></tr>';
                document.getElementById('pagination').innerHTML = '';
            }
        }

        function loadFirstPage() {
            storedLastKey = null;
            loadAuditLog(null);
        }

        function loadNextPage() {
            if (storedLastKey) loadAuditLog(storedLastKey);
        }

        function renderAuditLog(actions) {
            const tbody = document.getElementById('audit-body');

            if (actions.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty">
                            <div class="empty-icon">📋</div>
                            <p>No audit records found</p>
                        </td>
                    </tr>
                `;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            tbody.innerHTML = actions.map(action => `
                <tr>
                    <td class="timestamp">${formatTime(action.created_at)}</td>
                    <td>
                        <span class="action-type ${action.action_type}">${action.action_type}</span>
                        ${action.target_type !== 'user' ? `<br><small class="muted">${action.target_type}</small>` : ''}
                    </td>
                    <td>
                        <a href="users.html?id=${action.target_id}" class="user-link">${action.target_id.substring(0, 20)}...</a>
                    </td>
                    <td class="reason-code">${REASON_LABELS[action.reason_code] || action.reason_code || '-'}</td>
                    <td>${action.actor_role || 'admin'}</td>
                    <td>
                        <button class="link-btn" onclick="showDetail('${action.action_id}')">View</button>
                    </td>
                </tr>
            `).join('');

            // Pagination — keys stay in JS (storedLastKey), never JSON-in-attribute
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = `
                <button type="button" class="btn ghost" id="page-first" ${!currentPage ? 'disabled' : ''}>First</button>
                <button type="button" class="btn ghost" id="page-next" ${!hasMore ? 'disabled' : ''}>Next</button>
            `;
            document.getElementById('page-first').addEventListener('click', loadFirstPage);
            document.getElementById('page-next').addEventListener('click', loadNextPage);

            // Store actions for detail view
            window.auditActions = actions;
        }

        function applyFilters() {
            storedLastKey = null;
            loadAuditLog(null);
        }

        function clearFilters() {
            document.getElementById('filter-target').value = '';
            document.getElementById('filter-actor').value = '';
            document.getElementById('filter-type').value = '';
            document.getElementById('filter-from').value = '';
            document.getElementById('filter-to').value = '';
            storedLastKey = null;
            loadAuditLog(null);
        }

        function showDetail(actionId) {
            const action = window.auditActions?.find(a => a.action_id === actionId);
            if (!action) return;

            const modal = document.getElementById('detail-modal');
            const body = document.getElementById('modal-body');

            body.innerHTML = `
                <div class="detail-row">
                    <div class="detail-label">Action ID</div>
                    <div class="detail-value" style="font-family:monospace;font-size:0.85rem;">${action.action_id}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Timestamp</div>
                    <div class="detail-value">${formatTime(action.created_at)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Action Type</div>
                    <div class="detail-value"><span class="action-type ${action.action_type}">${action.action_type}</span></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Target Type</div>
                    <div class="detail-value">${action.target_type}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Target ID</div>
                    <div class="detail-value" style="font-family:monospace;font-size:0.85rem;">${action.target_id}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Reason Code</div>
                    <div class="detail-value">${REASON_LABELS[action.reason_code] || action.reason_code || '-'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Reason Text</div>
                    <div class="detail-value">${action.reason_text || '-'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Actor ID</div>
                    <div class="detail-value" style="font-family:monospace;font-size:0.85rem;">${action.actor_id || '-'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Actor Role</div>
                    <div class="detail-value">${action.actor_role || '-'}</div>
                </div>
                ${action.expires_at ? `
                <div class="detail-row">
                    <div class="detail-label">Expires At</div>
                    <div class="detail-value">${formatTime(action.expires_at)}</div>
                </div>
                ` : ''}
                ${action.source_report_id ? `
                <div class="detail-row">
                    <div class="detail-label">Source Report</div>
                    <div class="detail-value" style="font-family:monospace;font-size:0.85rem;">${action.source_report_id}</div>
                </div>
                ` : ''}
            `;

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.remove('active');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        document.getElementById('detail-modal').addEventListener('click', (e) => {
            if (e.target.id === 'detail-modal') closeModal();
        });

        function formatTime(isoString) {
            if (!isoString) return 'Unknown';
            const date = new Date(isoString);
            return date.toLocaleString();
        }

        function showError(message) {
            const el = document.getElementById('error-message');
            el.textContent = message;
            el.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }

        AdminShell.init({ active: 'audit.html', title: 'Audit', onReady: () => loadAuditLog(null) });
    </script>
</body>
</html>
