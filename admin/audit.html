<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Audit log · DSCO admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        /* Page-specific: labelled filter fields share one toolbar row. */
        .toolbar.filters { align-items: flex-end; }
        .toolbar.filters .field { margin-bottom: 0; }
        .toolbar.filters input[type="text"] { width: 220px; max-width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <form class="toolbar filters" id="filters" autocomplete="off">
            <div class="field">
                <label for="filter-target">Target ID</label>
                <input type="text" id="filter-target" placeholder="Person or content ID" spellcheck="false">
            </div>
            <div class="field">
                <label for="filter-actor">Actor ID</label>
                <input type="text" id="filter-actor" placeholder="Admin's user ID" spellcheck="false">
            </div>
            <div class="field">
                <label for="filter-type">Action type</label>
                <select id="filter-type">
                    <option value="">All</option>
                    <option value="warned">Warned</option>
                    <option value="suspended">Suspended</option>
                    <option value="banned">Banned</option>
                    <option value="reversed">Reversed</option>
                    <option value="content_removed">Content removed</option>
                </select>
            </div>
            <div class="field">
                <label for="filter-from">From date</label>
                <input type="date" id="filter-from">
            </div>
            <div class="field">
                <label for="filter-to">To date</label>
                <input type="date" id="filter-to">
            </div>
            <button type="submit" class="btn primary" id="search">Search</button>
            <button type="button" class="btn" id="clear">Clear</button>
        </form>

        <div id="audit"></div>

        <div class="toolbar" id="pager" hidden></div>
    </div>

    <script src="assets/admin.js"></script>
    <script>
        const { ui } = AdminShell;
        const { esc } = ui;

        // Active search: the request body without last_key, snapshotted when
        // Search is pressed so paging and Refresh ignore half-typed filters.
        let query = null;
        let pageKey = null;   // last_key that produced the page on screen (null = first page)
        let nextKey = null;
        let rows = [];

        const REASON_LABELS = {
            HARASSMENT: 'Harassment',
            HATE_SPEECH: 'Hate speech',
            SEXUAL_CONTENT: 'Sexual content',
            MINOR_SAFETY: 'Minor safety',
            SPAM: 'Spam',
            IMPERSONATION: 'Impersonation',
            SELF_HARM: 'Self-harm',
            VIOLENCE: 'Violence',
            ILLEGAL_CONTENT: 'Illegal content',
            PRIVACY_VIOLATION: 'Privacy violation',
            OTHER: 'Other',
        };

        // Label and badge tone per action type.
        const ACTIONS = {
            warned: { label: 'Warned', tone: 'warn' },
            suspended: { label: 'Suspended', tone: 'orange' },
            banned: { label: 'Banned', tone: 'bad' },
            reversed: { label: 'Reversed', tone: 'good' },
            content_removed: { label: 'Content removed', tone: 'purple' },
        };

        const ROLE_LABELS = {
            super_admin: 'Super admin',
            admin: 'Admin',
            moderator: 'Moderator',
        };

        const region = document.getElementById('audit');
        const pager = document.getElementById('pager');
        const refreshButton = () => document.getElementById('refresh');

        // ---- Loading ----

        function search() {
            const targetId = document.getElementById('filter-target').value.trim();
            const actorId = document.getElementById('filter-actor').value.trim();
            const actionType = document.getElementById('filter-type').value;
            const fromDate = document.getElementById('filter-from').value;
            const toDate = document.getElementById('filter-to').value;

            // The backend requires at least one of these filters.
            if (!targetId && !actorId && !actionType) {
                query = null;
                rows = [];
                pageKey = null;
                nextKey = null;
                pager.hidden = true;
                refreshButton().hidden = true;
                ui.empty(region, {
                    title: 'Search the audit log',
                    body: 'Enter a target ID, an actor ID or an action type. The date range narrows the results.',
                    icon: 'search',
                });
                return Promise.resolve();
            }

            const body = {};
            if (targetId) body.target_id = targetId;
            if (actorId) body.actor_id = actorId;
            if (actionType) body.action_type = actionType;
            if (fromDate) body.start_date = fromDate;
            // ISO string comparison server-side: include all of the end day.
            if (toDate) body.end_date = `${toDate}T23:59:59Z`;
            query = body;
            refreshButton().hidden = false;
            return loadPage(null);
        }

        // Paging and Refresh keep the current rows on screen (the button shows the wait).
        async function loadPage(key, { quiet = false } = {}) {
            if (!query) return;
            if (!quiet || !rows.length) ui.loading(region, 'Loading audit log…');
            try {
                const data = await AdminShell.api('realtime', '/admin/audit', key ? { ...query, last_key: key } : query);
                rows = data.items || [];
                pageKey = key;
                nextKey = data.last_key || null;
                render();
            } catch (error) {
                rows = [];
                pager.hidden = true;
                ui.error(region, { title: "Couldn't load the audit log", error, onRetry: () => loadPage(key) });
            }
        }

        // ---- Rendering ----

        function shortId(id) {
            return String(id || '').slice(0, 8);
        }

        function userHref(id) {
            return `users.html?id=${encodeURIComponent(id)}&env=${encodeURIComponent(AdminShell.env)}`;
        }

        function isUserTarget(action) {
            return !action.target_type || action.target_type === 'user';
        }

        function reasonLabel(code) {
            return REASON_LABELS[code] || code || '–';
        }

        function roleLabel(role) {
            return ROLE_LABELS[role] || role || 'Admin';
        }

        function actionBadge(type) {
            const action = ACTIONS[type] || { label: type || 'Unknown', tone: '' };
            return `<span class="badge ${action.tone}">${esc(action.label)}</span>`;
        }

        function render() {
            if (!rows.length) {
                pager.hidden = !pageKey;
                if (pageKey) renderPager();
                ui.empty(region, {
                    title: 'No audit records',
                    body: 'Nothing matches these filters. Try a wider date range or fewer filters.',
                    icon: 'list',
                });
                return;
            }
            // Every field is untrusted (reason text is admin-typed, ids come
            // from the request), so all of it goes through esc().
            region.innerHTML = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Action</th>
                                <th>Target</th>
                                <th>Reason</th>
                                <th>Actor</th>
                                <th><span class="sr-only">Details</span></th>
                            </tr>
                        </thead>
                        <tbody>${rows.map(renderRow).join('')}</tbody>
                    </table>
                </div>`;
            renderPager();
        }

        function renderRow(action) {
            const id = action.target_id || '';
            const idLabel = `<span class="mono" title="${esc(id)}">${esc(shortId(id))}</span>`;
            const target = isUserTarget(action) && id ? `<a href="${esc(userHref(id))}">${idLabel}</a>` : idLabel;
            return `
                <tr>
                    <td class="nowrap">${ui.timeTag(action.created_at)}</td>
                    <td>
                        ${actionBadge(action.action_type)}
                        ${isUserTarget(action) ? '' : `<div class="faint">${esc(action.target_type)}</div>`}
                    </td>
                    <td>${target}</td>
                    <td>${esc(reasonLabel(action.reason_code))}</td>
                    <td>${esc(roleLabel(action.actor_role))}</td>
                    <td class="num"><button type="button" class="btn plain sm" data-action-id="${esc(action.action_id)}">Details</button></td>
                </tr>`;
        }

        // Page keys stay in JS (pageKey / nextKey), never in attributes.
        function renderPager() {
            pager.hidden = false;
            pager.innerHTML = `
                <span class="muted">${esc(ui.number(rows.length))} ${rows.length === 1 ? 'record' : 'records'} on this page</span>
                <span class="spacer"></span>
                <button type="button" class="btn" data-page="first"${pageKey ? '' : ' disabled'}>First</button>
                <button type="button" class="btn" data-page="next"${nextKey ? '' : ' disabled'}>Next</button>`;
        }

        // ---- Detail ----

        function showDetail(action) {
            const row = (label, value) => `<dt>${esc(label)}</dt><dd>${value}</dd>`;
            const mono = (value) => (value ? `<span class="mono">${esc(value)}</span>` : '–');
            const targetId = action.target_id
                ? (isUserTarget(action)
                    ? `<a class="mono" href="${esc(userHref(action.target_id))}">${esc(action.target_id)}</a>`
                    : mono(action.target_id))
                : '–';

            ui.dialog({
                title: 'Action details',
                body: `<dl class="kv">
                    ${row('Action ID', mono(action.action_id))}
                    ${row('Time', esc(ui.time(action.created_at, { seconds: true }) || '–'))}
                    ${row('Action', actionBadge(action.action_type))}
                    ${row('Target type', esc(action.target_type || '–'))}
                    ${row('Target ID', targetId)}
                    ${row('Reason code', esc(reasonLabel(action.reason_code)))}
                    ${row('Reason text', esc(action.reason_text || '–'))}
                    ${row('Actor ID', mono(action.actor_id))}
                    ${row('Actor role', esc(action.actor_role || '–'))}
                    ${action.expires_at ? row('Expires', esc(ui.time(action.expires_at, { seconds: true }) || '–')) : ''}
                    ${action.source_report_id ? row('Source report', mono(action.source_report_id)) : ''}
                </dl>`,
            });
        }

        // ---- Wiring ----

        document.getElementById('filters').addEventListener('submit', (e) => {
            e.preventDefault();
            search();
        });

        document.getElementById('clear').addEventListener('click', (e) => {
            e.currentTarget.form.reset();
            search();
        });

        region.addEventListener('click', (e) => {
            const button = e.target.closest('button[data-action-id]');
            if (!button) return;
            const action = rows.find(a => a.action_id === button.dataset.actionId);
            if (action) showDetail(action);
        });

        pager.addEventListener('click', (e) => {
            const button = e.target.closest('button[data-page]');
            if (!button) return;
            const key = button.dataset.page === 'next' ? nextKey : null;
            ui.busy(button, () => loadPage(key, { quiet: true }));
        });

        AdminShell.init({ active: 'audit.html', title: 'Audit log', onReady: search });

        document.getElementById('page-actions').innerHTML =
            `<button type="button" class="btn" id="refresh" hidden>${ui.icon('refresh')}Refresh</button>`;
        refreshButton().addEventListener('click', (e) => ui.busy(e.currentTarget, () => loadPage(pageKey, { quiet: true })));
    </script>
</body>
</html>
