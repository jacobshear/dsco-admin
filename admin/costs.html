<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Costs · DSCO admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        /* Page-specific: spacing under the Mapbox usage block. */
        .mapbox-note { margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <p class="page-note">
            Cost Explorer results are cached for 6 hours. Refresh live skips the cache and costs about $0.03 per fetch
            in Cost Explorer API calls.
        </p>

        <div id="content"></div>
    </div>

    <script src="assets/admin.js"></script>
    <script>
        const { ui } = AdminShell;
        const { esc } = ui;

        const content = document.getElementById('content');
        const MAPBOX_DASHBOARD = 'https://console.mapbox.com/account/usage/';

        let hasData = false;

        function money(amount) {
            if (amount == null || amount === '' || !Number.isFinite(Number(amount))) return '–';
            return Number(amount).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
        }

        // Only https links from the server are ever followed.
        function safeUrl(url, fallback) {
            return typeof url === 'string' && /^https:\/\//i.test(url) ? url : fallback;
        }

        // ---- Loading ----

        // A refresh keeps the current numbers on screen (the button shows the wait).
        async function loadPage({ refresh = false, quiet = false } = {}) {
            if (!quiet || !hasData) ui.loading(content, refresh ? 'Fetching live costs…' : 'Loading costs…');
            try {
                const data = await AdminShell.api('realtime', '/admin/metrics/costs', refresh ? { refresh: true } : {});
                hasData = true;
                render(data);
            } catch (error) {
                hasData = false;
                ui.error(content, { title: "Couldn't load costs", error, onRetry: () => loadPage() });
            }
        }

        // ---- Rendering ----

        function render(data) {
            const aws = data.aws || {};
            const daily = aws.daily || [];
            const total = aws.month_to_date?.total;
            const asOf = data.fetched_at ? `As of ${ui.time(data.fetched_at)}` : '';
            const freshness = [asOf, data.cached ? 'cached' : 'live'].filter(Boolean).join(' · ');
            const yesterday = daily.length >= 2 ? daily[daily.length - 2].amount : null;

            content.innerHTML = `
                <div class="stats">
                    <div class="stat">
                        <div class="label">AWS month to date</div>
                        <div class="value">${esc(money(total))}</div>
                        <div class="sub">${esc(freshness)}</div>
                    </div>
                    <div class="stat">
                        <div class="label">Forecast (month end)</div>
                        <div class="value">${esc(money(aws.forecast_month_end))}</div>
                    </div>
                    <div class="stat">
                        <div class="label">Yesterday</div>
                        <div class="value">${esc(money(yesterday))}</div>
                    </div>
                </div>

                <section class="panel">
                    <div class="panel-head">
                        <h2>Daily AWS spend</h2>
                        <span class="hint">Last 30 days, unblended</span>
                    </div>
                    <div data-slot="chart"></div>
                </section>

                <section class="panel">
                    <div class="panel-head"><h2>Month to date by service</h2></div>
                    <div data-slot="services"></div>
                </section>

                <section class="panel">
                    <div class="panel-head">
                        <h2>Mapbox</h2>
                        <div class="panel-actions" data-slot="mapbox-link"></div>
                    </div>
                    <div data-slot="mapbox"></div>
                </section>`;

            const slot = (name) => content.querySelector(`[data-slot="${name}"]`);
            renderChart(slot('chart'), daily);
            renderServices(slot('services'), aws.month_to_date?.by_service || []);
            renderMapbox(slot('mapbox'), slot('mapbox-link'), data.mapbox || {});
        }

        function renderChart(el, daily) {
            if (!daily.length) {
                ui.empty(el, { title: 'No spend data', body: 'Daily spend appears here once Cost Explorer returns data.', icon: 'dollar' });
                return;
            }
            const max = Math.max(...daily.map(d => Number(d.amount) || 0), 0.01);
            el.innerHTML = `<div class="bar-chart" role="img" aria-label="Daily AWS spend over the last 30 days">${daily.map(d => {
                const amount = Number(d.amount) || 0;
                return `<div class="bar" style="height:${Math.max(2, (amount / max) * 100)}%"><div class="tip">${esc(d.date)}: ${esc(money(amount))}</div></div>`;
            }).join('')}</div>`;
        }

        function renderServices(el, services) {
            if (!services.length) {
                ui.empty(el, { title: 'No cost data', body: 'Spend by service appears here once Cost Explorer returns data.', icon: 'dollar' });
                return;
            }
            el.innerHTML = `
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Service</th><th class="num">Amount</th></tr></thead>
                        <tbody>${services.map(s =>
                            `<tr><td>${esc(s.service)}</td><td class="num">${esc(money(s.amount))}</td></tr>`
                        ).join('')}</tbody>
                    </table>
                </div>`;
        }

        function renderMapbox(el, linkEl, mapbox) {
            const dashboard = safeUrl(mapbox.dashboard, MAPBOX_DASHBOARD);
            linkEl.innerHTML = `<a class="btn sm" href="${esc(dashboard)}" target="_blank" rel="noopener">Usage dashboard${ui.icon('external')}</a>`;

            // Mapbox has no usage API; the backend only ever returns the dashboard link.
            const body = mapbox.available
                ? `<pre class="raw">${esc(JSON.stringify(mapbox.usage, null, 2))}</pre>`
                : `<p class="muted">${esc(mapbox.reason || 'Usage lives in the Mapbox dashboard.')}</p>`;
            el.innerHTML = `${body}
                <p class="muted mapbox-note">
                    For attribution by call site and type, see
                    <a href="geocode.html?env=${esc(encodeURIComponent(AdminShell.env))}">Geocoding</a>.
                </p>`;
        }

        // ---- Wiring ----

        AdminShell.init({ active: 'costs.html', title: 'Costs', onReady: () => loadPage() });

        document.getElementById('page-actions').innerHTML =
            `<button type="button" class="btn" id="refresh">${ui.icon('refresh')}Refresh live</button>`;
        document.getElementById('refresh').addEventListener('click', (e) =>
            ui.busy(e.currentTarget, () => loadPage({ refresh: true, quiet: true })));
    </script>
</body>
</html>
