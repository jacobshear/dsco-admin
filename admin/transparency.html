<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Transparency · DSCO admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        /* Page-specific: horizontal share bars inside the breakdown tables. */
        .meter-cell { width: 40%; min-width: 120px; }

        .meter {
            height: 8px;
            border-radius: var(--r-full);
            background: var(--surface-3);
            overflow: hidden;
        }

        .meter > span {
            display: block;
            height: 100%;
            border-radius: var(--r-full);
            background: var(--accent);
        }

        /* Print report: drop the console chrome and use the page's own colours. */
        @media print {
            :root {
                color-scheme: light;
                --bg: Canvas;
                --surface: Canvas;
                --surface-2: Canvas;
                --surface-3: GrayText;
                --border: GrayText;
                --border-strong: GrayText;
                --text: CanvasText;
                --text-2: CanvasText;
                --text-3: GrayText;
            }

            .sidebar, .topbar, .sidebar-scrim, .page-actions, .toolbar, .notices { display: none !important; }
            body.shell-on .container { margin-left: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="panel">
            <div class="panel-head"><h2>DSA transparency reporting</h2></div>
            <p class="muted">This report provides aggregated moderation statistics required under the Digital Services Act (DSA).
               Export quarterly data for regulatory compliance and public transparency reports.</p>
        </section>

        <div class="toolbar">
            <div class="seg" role="group" aria-label="Quick ranges" id="ranges">
                <button type="button" data-range="q1" aria-pressed="false">Q1</button>
                <button type="button" data-range="q2" aria-pressed="false">Q2</button>
                <button type="button" data-range="q3" aria-pressed="false">Q3</button>
                <button type="button" data-range="q4" aria-pressed="false">Q4</button>
                <button type="button" data-range="full" aria-pressed="false">Full year</button>
                <button type="button" data-range="30d" aria-pressed="true">Last 30 days</button>
            </div>
            <span class="spacer"></span>
            <label for="date-from" class="muted">From</label>
            <input type="date" id="date-from">
            <label for="date-to" class="muted">To</label>
            <input type="date" id="date-to">
            <button type="button" class="btn primary" id="generate">Generate</button>
        </div>

        <div id="report-content"></div>
    </div>

    <script src="assets/admin.js"></script>
    <script>
        const { ui } = AdminShell;
        const { esc } = ui;

        // Raw API response, the normalised figures shown on the page, and the
        // date range they were generated for (exports use this, not the inputs).
        let reportData = null;
        let report = null;
        let reportPeriod = null;

        const REASON_LABELS = {
            HARASSMENT: 'Harassment',
            HATE_SPEECH: 'Hate speech',
            SEXUAL_CONTENT: 'Sexual content',
            MINOR_SAFETY: 'Minor safety',
            SPAM: 'Spam',
            IMPERSONATION: 'Impersonation',
            SELF_HARM: 'Self-harm',
            VIOLENCE: 'Violence',
            ILLEGAL_CONTENT: 'Illegal content',
            PRIVACY_VIOLATION: 'Privacy violation',
            OTHER: 'Other',
        };

        const ACTION_LABELS = {
            warned: 'Warning issued',
            suspended: 'Account suspended',
            banned: 'Account banned',
            content_removed: 'Content removed',
            reversed: 'Action reversed',
        };

        const content = document.getElementById('report-content');
        const fromInput = document.getElementById('date-from');
        const toInput = document.getElementById('date-to');
        const EXPORT_IDS = ['export-csv', 'export-json', 'export-print'];

        // ---- Date range ----

        function formatDateInput(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function labelQuarterButtons() {
            const year = new Date().getFullYear();
            ['q1', 'q2', 'q3', 'q4'].forEach(range => {
                document.querySelector(`#ranges button[data-range="${range}"]`).textContent = `${range.toUpperCase()} ${year}`;
            });
        }

        function setDefaultRange() {
            const today = new Date();
            const thirtyDaysAgo = new Date(today);
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
            toInput.value = formatDateInput(today);
            fromInput.value = formatDateInput(thirtyDaysAgo);
        }

        // Marks one quick range as pressed; null clears them (custom dates).
        function pressRange(range) {
            document.querySelectorAll('#ranges button').forEach(btn => {
                btn.setAttribute('aria-pressed', String(btn.dataset.range === range));
            });
        }

        function setRange(range) {
            const today = new Date();
            const year = today.getFullYear();
            let from, to;

            pressRange(range);

            switch (range) {
                case 'q1':
                    from = new Date(year, 0, 1);
                    to = new Date(year, 2, 31);
                    break;
                case 'q2':
                    from = new Date(year, 3, 1);
                    to = new Date(year, 5, 30);
                    break;
                case 'q3':
                    from = new Date(year, 6, 1);
                    to = new Date(year, 8, 30);
                    break;
                case 'q4':
                    from = new Date(year, 9, 1);
                    to = new Date(year, 11, 31);
                    break;
                case 'full':
                    from = new Date(year, 0, 1);
                    to = new Date(year, 11, 31);
                    break;
                case '30d':
                default:
                    from = new Date(today);
                    from.setDate(from.getDate() - 30);
                    to = today;
                    break;
            }

            fromInput.value = formatDateInput(from);
            toInput.value = formatDateInput(to);
            loadData();
        }

        // ---- Loading ----

        function setExports(enabled) {
            EXPORT_IDS.forEach(id => { document.getElementById(id).disabled = !enabled; });
        }

        function figure(value) {
            return typeof value === 'number' && Number.isFinite(value) ? value : null;
        }

        // The export response nests the figures under `statistics` and reports
        // appeals as `appeals_by_status`; flat fields are still honoured. A
        // figure the API doesn't supply stays null and shows as a dash rather
        // than a made-up zero.
        function normalise(data) {
            const s = { ...data, ...(data.statistics || {}) };
            const byStatus = s.appeals_by_status || {};
            return {
                totalActions: figure(s.total_actions) ?? 0,
                totalReports: figure(s.total_reports),
                totalAppeals: figure(s.total_appeals) ?? 0,
                appealsApproved: figure(s.appeals_approved) ?? figure(byStatus.approved) ?? 0,
                appealsDenied: figure(s.appeals_denied) ?? figure(byStatus.denied) ?? 0,
                appealsPending: figure(s.appeals_pending) ?? figure(byStatus.pending) ?? 0,
                avgResponseHours: figure(s.avg_response_hours),
                actionsByType: s.actions_by_type || {},
                actionsByReason: s.actions_by_reason || {},
                contentRemoved: s.content_removed || {},
            };
        }

        // A new range replaces the report; Generate keeps the current one on
        // screen while the button shows the wait.
        async function loadData({ quiet = false } = {}) {
            const fromDate = fromInput.value;
            const toDate = toInput.value;

            if (!fromDate || !toDate) {
                reportData = null;
                setExports(false);
                ui.empty(content, {
                    title: 'Choose a date range',
                    body: 'Pick a start and end date, or use a quick range.',
                    icon: 'file',
                });
                return;
            }

            if (!quiet || !reportData) {
                reportData = null;
                setExports(false);
                ui.loading(content, 'Loading transparency data…');
            }

            try {
                // The backend compares ISO strings with `between`, so a bare end
                // date would drop everything on that day; send its last second.
                const data = await AdminShell.api('realtime', '/admin/transparency/export', {
                    start_date: fromDate,
                    end_date: `${toDate}T23:59:59Z`,
                });
                reportData = data;
                report = normalise(data);
                reportPeriod = { from: fromDate, to: toDate };
                renderReport(report);
                setExports(true);
            } catch (error) {
                reportData = null;
                setExports(false);
                ui.error(content, { title: "Couldn't load the transparency report", error, onRetry: () => loadData() });
            }
        }

        // ---- Rendering ----

        function percent(count, total) {
            return total ? (count / total * 100).toFixed(1) : '0';
        }

        // One breakdown table: label, a bar scaled to the largest row, count and share.
        function breakdownPanel(title, columnLabel, counts, labels, total) {
            const entries = Object.entries(counts)
                .map(([key, count]) => [key, Number(count) || 0])
                .sort((a, b) => b[1] - a[1]);
            const max = Math.max(...entries.map(([, count]) => count), 1);
            const body = entries.length ? `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>${esc(columnLabel)}</th>
                                <th class="meter-cell"><span class="sr-only">Relative size</span></th>
                                <th class="num">Count</th>
                                <th class="num">% of total</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${entries.map(([key, count]) => `
                                <tr>
                                    <td>${esc(labels[key] || key)}</td>
                                    <td class="meter-cell"><div class="meter" aria-hidden="true"><span style="width:${Math.round(count / max * 100)}%"></span></div></td>
                                    <td class="num">${esc(ui.number(count))}</td>
                                    <td class="num muted">${esc(percent(count, total))}%</td>
                                </tr>`).join('')}
                        </tbody>
                    </table>
                </div>` : '<p class="muted">Nothing recorded in this period.</p>';
            return `
                <section class="panel">
                    <div class="panel-head"><h2>${esc(title)}</h2></div>
                    ${body}
                </section>`;
        }

        function contentRemovedPanel(contentRemoved) {
            const entries = Object.entries(contentRemoved);
            const body = entries.length ? `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr><th>Content type</th><th class="num">Count</th></tr>
                        </thead>
                        <tbody>
                            ${entries.map(([type, count]) => `
                                <tr>
                                    <td>${esc(type.charAt(0).toUpperCase() + type.slice(1))}s</td>
                                    <td class="num">${esc(ui.number(Number(count) || 0))}</td>
                                </tr>`).join('')}
                        </tbody>
                    </table>
                </div>` : '<p class="muted">No content removed in this period.</p>';
            return `
                <section class="panel">
                    <div class="panel-head"><h2>Content removed by type</h2></div>
                    ${body}
                </section>`;
        }

        function appealsPanel(r) {
            const rate = r.totalAppeals ? Math.round(r.appealsApproved / r.totalAppeals * 100) : 0;
            const rows = [
                ['Appeals submitted', ui.number(r.totalAppeals)],
                ['Appeals approved', ui.number(r.appealsApproved)],
                ['Appeals denied', ui.number(r.appealsDenied)],
                ['Appeals pending', ui.number(r.appealsPending)],
                ['Approval rate', `${rate}%`],
            ];
            return `
                <section class="panel">
                    <div class="panel-head"><h2>Appeals overview</h2></div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr><th>Metric</th><th class="num">Value</th></tr>
                            </thead>
                            <tbody>
                                ${rows.map(([metric, value]) => `
                                    <tr><td>${esc(metric)}</td><td class="num">${esc(value)}</td></tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </section>`;
        }

        function renderReport(r) {
            const rate = r.totalAppeals ? Math.round(r.appealsApproved / r.totalAppeals * 100) : 0;
            const missing = '<div class="sub">Not provided by the API</div>';

            content.innerHTML = `
                <div class="stats">
                    <div class="stat">
                        <div class="label">Total moderation actions</div>
                        <div class="value">${esc(ui.number(r.totalActions))}</div>
                    </div>
                    <div class="stat">
                        <div class="label">Reports received</div>
                        <div class="value">${esc(ui.number(r.totalReports))}</div>
                        ${r.totalReports === null ? missing : ''}
                    </div>
                    <div class="stat">
                        <div class="label">Appeals submitted</div>
                        <div class="value">${esc(ui.number(r.totalAppeals))}</div>
                        <div class="sub">${esc(ui.number(r.appealsApproved))} approved (${rate}%)</div>
                    </div>
                    <div class="stat">
                        <div class="label">Average response time</div>
                        <div class="value">${r.avgResponseHours === null ? '–' : `${esc(r.avgResponseHours)}h`}</div>
                        ${r.avgResponseHours === null ? missing : '<div class="sub">Report to action</div>'}
                    </div>
                </div>

                ${breakdownPanel('Actions by type', 'Action type', r.actionsByType, ACTION_LABELS, r.totalActions)}
                ${breakdownPanel('Actions by reason code', 'Reason code', r.actionsByReason, REASON_LABELS, r.totalActions)}

                <div class="grid-2">
                    ${contentRemovedPanel(r.contentRemoved)}
                    ${appealsPanel(r)}
                </div>`;
        }

        // ---- Export ----

        function exportCSV() {
            if (!reportData || !report) return;
            const { from, to } = reportPeriod;
            const blank = (value) => (value === null ? '' : value);

            let csv = 'DSCO Transparency Report\n';
            csv += `Period: ${from} to ${to}\n`;
            csv += `Generated: ${new Date().toISOString()}\n\n`;

            csv += 'Summary Statistics\n';
            csv += `Total Moderation Actions,${report.totalActions}\n`;
            csv += `Total Reports Received,${blank(report.totalReports)}\n`;
            csv += `Total Appeals Submitted,${report.totalAppeals}\n`;
            csv += `Appeals Approved,${report.appealsApproved}\n`;
            csv += `Appeals Denied,${report.appealsDenied}\n\n`;

            csv += 'Actions by Type\n';
            csv += 'Action Type,Count\n';
            for (const [type, count] of Object.entries(report.actionsByType)) {
                csv += `${ACTION_LABELS[type] || type},${count}\n`;
            }
            csv += '\n';

            csv += 'Actions by Reason Code\n';
            csv += 'Reason Code,Count\n';
            for (const [reason, count] of Object.entries(report.actionsByReason)) {
                csv += `${REASON_LABELS[reason] || reason},${count}\n`;
            }
            csv += '\n';

            csv += 'Content Removed by Type\n';
            csv += 'Content Type,Count\n';
            for (const [type, count] of Object.entries(report.contentRemoved)) {
                csv += `${type},${count}\n`;
            }

            downloadFile(csv, `dsco-transparency-${from}-${to}.csv`, 'text/csv');
        }

        function exportJSON() {
            if (!reportData) return;
            const { from, to } = reportPeriod;

            const exportData = {
                report_period: {
                    start_date: from,
                    end_date: to,
                },
                generated_at: new Date().toISOString(),
                platform: 'DSCO',
                ...reportData,
            };

            downloadFile(
                JSON.stringify(exportData, null, 2),
                `dsco-transparency-${from}-${to}.json`,
                'application/json'
            );
        }

        // The file lands in the browser's downloads, off the page, so say so.
        function downloadFile(body, filename, mimeType) {
            const blob = new Blob([body], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            ui.notice(`Exported ${filename}`, { tone: 'good' });
        }

        // ---- Wiring ----

        document.getElementById('ranges').addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-range]');
            if (btn) setRange(btn.dataset.range);
        });

        // Typing your own dates leaves no quick range selected.
        [fromInput, toInput].forEach(input => input.addEventListener('change', () => pressRange(null)));

        document.getElementById('generate').addEventListener('click', (e) => ui.busy(e.currentTarget, () => loadData({ quiet: true })));

        AdminShell.init({
            active: 'transparency.html',
            title: 'Transparency',
            onReady: () => {
                labelQuarterButtons();
                setDefaultRange();
                loadData();
            },
        });

        document.getElementById('page-actions').innerHTML = `
            <button type="button" class="btn" id="export-csv" disabled>${ui.icon('download')}Export CSV</button>
            <button type="button" class="btn" id="export-json" disabled>${ui.icon('download')}Export JSON</button>
            <button type="button" class="btn" id="export-print" disabled>${ui.icon('file')}Print report</button>`;
        document.getElementById('export-csv').addEventListener('click', exportCSV);
        document.getElementById('export-json').addEventListener('click', exportJSON);
        document.getElementById('export-print').addEventListener('click', () => window.print());
    </script>
</body>
</html>
