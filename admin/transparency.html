<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparency — DSCO Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-header h2 {
            font-size: 1.5rem;
        }

        .date-range {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .date-range label {
            font-size: 0.85rem;
            color: var(--ink-50);
        }

        .date-range input {
            padding: 8px 12px;
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            background: var(--panel-2);
            color: var(--ink);
            font-size: 14px;
            font-family: inherit;
        }

        .date-range button {
            padding: 8px 16px;
            background: var(--ink);
            border: none;
            color: var(--room);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
        }

        .date-range button:hover { background: rgba(255, 255, 255, 0.9); }

        .quick-ranges {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .quick-ranges button {
            padding: 6px 12px;
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--ink-50);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
        }

        .quick-ranges button:hover {
            background: var(--accent-dim);
            color: var(--ink);
        }

        .quick-ranges button.active {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--room);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--panel);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--line);
        }

        .stat-card .stat-label {
            font-size: 0.85rem;
            color: var(--ink-50);
            margin-bottom: 8px;
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }

        .stat-card .stat-sub {
            font-size: 0.8rem;
            color: var(--ink-35);
            margin-top: 4px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-header h3 {
            font-size: 1.1rem;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }

        .data-table th {
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--ink-50);
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .data-table .number {
            text-align: right;
            font-family: monospace;
            font-size: 1rem;
        }

        .data-table .percent {
            text-align: right;
            color: var(--ink-50);
            font-size: 0.85rem;
        }

        .bar-container {
            height: 8px;
            background: var(--panel-2);
            border-radius: 4px;
            overflow: hidden;
            min-width: 100px;
        }

        .bar {
            height: 100%;
            background: var(--info);
            border-radius: 4px;
        }

        .export-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .export-actions button {
            padding: 12px 24px;
            background: var(--good);
            border: none;
            color: var(--room);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .export-actions button:hover {
            filter: brightness(0.95);
        }

        .export-actions button.secondary {
            background: var(--panel);
            border: 1px solid var(--line-strong);
            color: var(--ink);
        }

        .export-actions button.secondary:hover {
            background: var(--accent-dim);
            filter: none;
        }

        .dsa-notice {
            background: var(--info-bg);
            border: 1px solid rgba(110, 182, 255, 0.35);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .dsa-notice h4 {
            color: var(--info);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .dsa-notice p {
            font-size: 0.85rem;
            color: var(--ink-50);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-banner" id="error-message"></div>

        <div class="dsa-notice">
            <h4>DSA transparency reporting</h4>
            <p>This report provides aggregated moderation statistics required under the Digital Services Act (DSA).
               Export quarterly data for regulatory compliance and public transparency reports.</p>
        </div>

        <div class="page-header">
            <h2>Transparency report</h2>
            <div class="date-range">
                <label>From</label>
                <input type="date" id="date-from">
                <label>To</label>
                <input type="date" id="date-to">
                <button type="button" onclick="loadData()">Generate</button>
            </div>
        </div>

        <div class="quick-ranges">
            <button type="button" onclick="setRange('q1')" data-range="q1" id="btn-q1">Q1</button>
            <button type="button" onclick="setRange('q2')" data-range="q2" id="btn-q2">Q2</button>
            <button type="button" onclick="setRange('q3')" data-range="q3" id="btn-q3">Q3</button>
            <button type="button" onclick="setRange('q4')" data-range="q4" id="btn-q4">Q4</button>
            <button type="button" onclick="setRange('full')" data-range="full" id="btn-full">Full year</button>
            <button type="button" onclick="setRange('30d')" data-range="30d" class="active">Last 30 days</button>
        </div>

        <div id="report-content">
            <div class="loading">Select a date range to generate report…</div>
        </div>

        <div class="export-actions" id="export-actions" style="display: none;">
            <button type="button" onclick="exportCSV()">
                <span>📊</span> Export CSV
            </button>
            <button type="button" class="secondary" onclick="exportJSON()">
                <span>📄</span> Export JSON
            </button>
            <button type="button" class="secondary" onclick="printReport()">
                <span>🖨️</span> Print report
            </button>
        </div>
    </div>

    <script src="assets/admin.js"></script>
    <script>
        let reportData = null;

        const REASON_LABELS = {
            'HARASSMENT': 'Harassment',
            'HATE_SPEECH': 'Hate Speech',
            'SEXUAL_CONTENT': 'Sexual Content',
            'MINOR_SAFETY': 'Minor Safety',
            'SPAM': 'Spam',
            'IMPERSONATION': 'Impersonation',
            'SELF_HARM': 'Self-Harm',
            'VIOLENCE': 'Violence',
            'ILLEGAL_CONTENT': 'Illegal Content',
            'PRIVACY_VIOLATION': 'Privacy Violation',
            'OTHER': 'Other'
        };

        const ACTION_LABELS = {
            'warned': 'Warning Issued',
            'suspended': 'Account Suspended',
            'banned': 'Account Banned',
            'content_removed': 'Content Removed',
            'reversed': 'Action Reversed'
        };

        function formatDateInput(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function labelQuarterButtons() {
            const year = new Date().getFullYear();
            document.getElementById('btn-q1').textContent = `Q1 ${year}`;
            document.getElementById('btn-q2').textContent = `Q2 ${year}`;
            document.getElementById('btn-q3').textContent = `Q3 ${year}`;
            document.getElementById('btn-q4').textContent = `Q4 ${year}`;
        }

        function setDefaultRange() {
            const today = new Date();
            const thirtyDaysAgo = new Date(today);
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
            document.getElementById('date-to').value = formatDateInput(today);
            document.getElementById('date-from').value = formatDateInput(thirtyDaysAgo);
        }

        function setRange(range) {
            const today = new Date();
            const year = new Date().getFullYear();
            let from, to;

            document.querySelectorAll('.quick-ranges button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.range === range);
            });

            switch (range) {
                case 'q1':
                    from = new Date(year, 0, 1);
                    to = new Date(year, 2, 31);
                    break;
                case 'q2':
                    from = new Date(year, 3, 1);
                    to = new Date(year, 5, 30);
                    break;
                case 'q3':
                    from = new Date(year, 6, 1);
                    to = new Date(year, 8, 30);
                    break;
                case 'q4':
                    from = new Date(year, 9, 1);
                    to = new Date(year, 11, 31);
                    break;
                case 'full':
                    from = new Date(year, 0, 1);
                    to = new Date(year, 11, 31);
                    break;
                case '30d':
                default:
                    from = new Date(today);
                    from.setDate(from.getDate() - 30);
                    to = today;
                    break;
            }

            document.getElementById('date-from').value = formatDateInput(from);
            document.getElementById('date-to').value = formatDateInput(to);
            loadData();
        }

        async function loadData() {
            const content = document.getElementById('report-content');
            content.innerHTML = '<div class="loading">Loading transparency data…</div>';
            document.getElementById('export-actions').style.display = 'none';
            hideError();

            const fromDate = document.getElementById('date-from').value;
            const toDate = document.getElementById('date-to').value;

            if (!fromDate || !toDate) {
                content.innerHTML = '<div class="loading">Please select a date range.</div>';
                return;
            }

            try {
                reportData = await AdminShell.api('realtime', '/admin/transparency/export', {
                    start_date: fromDate,
                    end_date: toDate
                });
                renderReport(reportData);
                document.getElementById('export-actions').style.display = 'flex';
            } catch (error) {
                console.error('Error loading data:', error);
                showError(error.message || 'Failed to load transparency data.');
                content.innerHTML = '<div class="loading">Failed to load data</div>';
            }
        }

        function renderReport(data) {
            const content = document.getElementById('report-content');

            const totalActions = data.total_actions || 0;
            const totalReports = data.total_reports || 0;
            const totalAppeals = data.total_appeals || 0;
            const appealsApproved = data.appeals_approved || 0;

            const actionsByType = data.actions_by_type || {};
            const actionsByReason = data.actions_by_reason || {};
            const contentRemoved = data.content_removed || {};

            const maxActionCount = Math.max(...Object.values(actionsByType), 1);
            const maxReasonCount = Math.max(...Object.values(actionsByReason), 1);

            content.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total moderation actions</div>
                        <div class="stat-value">${totalActions.toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Reports received</div>
                        <div class="stat-value">${totalReports.toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Appeals submitted</div>
                        <div class="stat-value">${totalAppeals.toLocaleString()}</div>
                        <div class="stat-sub">${appealsApproved} approved (${totalAppeals ? Math.round(appealsApproved / totalAppeals * 100) : 0}%)</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Avg. response time</div>
                        <div class="stat-value">${data.avg_response_hours || '< 24'}h</div>
                        <div class="stat-sub">Report to action</div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">
                        <h3>Actions by type</h3>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Action type</th>
                                <th style="width: 200px;"></th>
                                <th style="text-align: right;">Count</th>
                                <th style="text-align: right;">% of total</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.entries(actionsByType).sort((a, b) => b[1] - a[1]).map(([type, count]) => `
                                <tr>
                                    <td>${ACTION_LABELS[type] || type}</td>
                                    <td>
                                        <div class="bar-container">
                                            <div class="bar" style="width: ${(count / maxActionCount * 100)}%"></div>
                                        </div>
                                    </td>
                                    <td class="number">${count.toLocaleString()}</td>
                                    <td class="percent">${totalActions ? (count / totalActions * 100).toFixed(1) : 0}%</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

                <div class="section">
                    <div class="section-header">
                        <h3>Actions by reason code</h3>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Reason code</th>
                                <th style="width: 200px;"></th>
                                <th style="text-align: right;">Count</th>
                                <th style="text-align: right;">% of total</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.entries(actionsByReason).sort((a, b) => b[1] - a[1]).map(([reason, count]) => `
                                <tr>
                                    <td>${REASON_LABELS[reason] || reason}</td>
                                    <td>
                                        <div class="bar-container">
                                            <div class="bar" style="width: ${(count / maxReasonCount * 100)}%"></div>
                                        </div>
                                    </td>
                                    <td class="number">${count.toLocaleString()}</td>
                                    <td class="percent">${totalActions ? (count / totalActions * 100).toFixed(1) : 0}%</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

                <div class="section">
                    <div class="section-header">
                        <h3>Content removed by type</h3>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Content type</th>
                                <th style="text-align: right;">Count</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.entries(contentRemoved).length > 0
                                ? Object.entries(contentRemoved).map(([type, count]) => `
                                    <tr>
                                        <td>${type.charAt(0).toUpperCase() + type.slice(1)}s</td>
                                        <td class="number">${count.toLocaleString()}</td>
                                    </tr>
                                `).join('')
                                : '<tr><td colspan="2" style="text-align: center; color: var(--ink-50);">No content removed in this period</td></tr>'
                            }
                        </tbody>
                    </table>
                </div>

                <div class="section">
                    <div class="section-header">
                        <h3>Appeals overview</h3>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Metric</th>
                                <th style="text-align: right;">Value</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Appeals submitted</td>
                                <td class="number">${totalAppeals.toLocaleString()}</td>
                            </tr>
                            <tr>
                                <td>Appeals approved</td>
                                <td class="number">${appealsApproved.toLocaleString()}</td>
                            </tr>
                            <tr>
                                <td>Appeals denied</td>
                                <td class="number">${(data.appeals_denied || 0).toLocaleString()}</td>
                            </tr>
                            <tr>
                                <td>Appeals pending</td>
                                <td class="number">${(data.appeals_pending || 0).toLocaleString()}</td>
                            </tr>
                            <tr>
                                <td>Approval rate</td>
                                <td class="number">${totalAppeals ? Math.round(appealsApproved / totalAppeals * 100) : 0}%</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
        }

        function exportCSV() {
            if (!reportData) return;

            const fromDate = document.getElementById('date-from').value;
            const toDate = document.getElementById('date-to').value;

            let csv = 'DSCO Transparency Report\n';
            csv += `Period: ${fromDate} to ${toDate}\n`;
            csv += `Generated: ${new Date().toISOString()}\n\n`;

            csv += 'Summary Statistics\n';
            csv += `Total Moderation Actions,${reportData.total_actions || 0}\n`;
            csv += `Total Reports Received,${reportData.total_reports || 0}\n`;
            csv += `Total Appeals Submitted,${reportData.total_appeals || 0}\n`;
            csv += `Appeals Approved,${reportData.appeals_approved || 0}\n`;
            csv += `Appeals Denied,${reportData.appeals_denied || 0}\n\n`;

            csv += 'Actions by Type\n';
            csv += 'Action Type,Count\n';
            for (const [type, count] of Object.entries(reportData.actions_by_type || {})) {
                csv += `${ACTION_LABELS[type] || type},${count}\n`;
            }
            csv += '\n';

            csv += 'Actions by Reason Code\n';
            csv += 'Reason Code,Count\n';
            for (const [reason, count] of Object.entries(reportData.actions_by_reason || {})) {
                csv += `${REASON_LABELS[reason] || reason},${count}\n`;
            }
            csv += '\n';

            csv += 'Content Removed by Type\n';
            csv += 'Content Type,Count\n';
            for (const [type, count] of Object.entries(reportData.content_removed || {})) {
                csv += `${type},${count}\n`;
            }

            downloadFile(csv, `dsco-transparency-${fromDate}-${toDate}.csv`, 'text/csv');
        }

        function exportJSON() {
            if (!reportData) return;

            const fromDate = document.getElementById('date-from').value;
            const toDate = document.getElementById('date-to').value;

            const exportData = {
                report_period: {
                    start_date: fromDate,
                    end_date: toDate
                },
                generated_at: new Date().toISOString(),
                platform: 'DSCO',
                ...reportData
            };

            downloadFile(
                JSON.stringify(exportData, null, 2),
                `dsco-transparency-${fromDate}-${toDate}.json`,
                'application/json'
            );
        }

        function downloadFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function printReport() {
            window.print();
        }

        function showError(message) {
            const el = document.getElementById('error-message');
            el.textContent = message;
            el.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }

        AdminShell.init({
            active: 'transparency.html',
            title: 'Transparency',
            onReady: () => {
                labelQuarterButtons();
                setDefaultRange();
                loadData();
            }
        });
    </script>
</body>
</html>
