<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Overview · DSCO admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        /* Page-specific: stat rows load into a region, so its loading and error
           states carry the row's bottom margin. */
        .region > .state { margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel-head"><h2>Needs attention</h2></div>
        <div class="region" id="attention"></div>

        <div class="panel-head"><h2>Activity</h2></div>
        <div class="region" id="kpis"></div>

        <section class="panel">
            <div class="panel-head">
                <h2>Ops health</h2>
                <span class="hint" id="ops-hint"></span>
            </div>
            <div id="ops-body"></div>
        </section>

        <div class="grid-2">
            <section class="panel">
                <div class="panel-head">
                    <h2>Daily active users</h2>
                    <span class="hint">From daily snapshots. History builds as the snapshot cron runs.</span>
                </div>
                <div id="dau-body"></div>
            </section>
            <section class="panel">
                <div class="panel-head">
                    <h2>Signups by day</h2>
                    <span class="hint">Last 30 days</span>
                </div>
                <div id="signup-body"></div>
            </section>
        </div>

        <section class="panel">
            <div class="panel-head">
                <h2>Levers</h2>
                <span class="hint" id="levers-hint"></span>
                <div class="panel-actions">
                    <a class="btn sm" data-page="levers.html">Open levers</a>
                </div>
            </div>
            <div id="levers-body"></div>
        </section>
    </div>

    <script src="assets/admin.js"></script>
    <script>
        const { ui } = AdminShell;
        const { esc } = ui;

        const els = {
            attention: document.getElementById('attention'),
            kpis: document.getElementById('kpis'),
            ops: document.getElementById('ops-body'),
            opsHint: document.getElementById('ops-hint'),
            dau: document.getElementById('dau-body'),
            signups: document.getElementById('signup-body'),
            levers: document.getElementById('levers-body'),
            leversHint: document.getElementById('levers-hint'),
        };

        const OPS_HINT = 'DLQ, crons, geocode breaker, Partiful and SES';

        // ---- Helpers ----

        const pageHref = (page) => `${page}?env=${encodeURIComponent(AdminShell.env)}`;

        // Count or amount for display; anything non-numeric reads as a dash.
        const num = (n) => (n == null || n === '' ? '–' : ui.number(Number(n)));

        function money(amount) {
            if (amount == null || amount === '' || !Number.isFinite(Number(amount))) return '–';
            return Number(amount).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
        }

        // Settle a request into { ok, value | error } so one failure never hides the rest.
        async function attempt(promise) {
            try {
                return { ok: true, value: await promise };
            } catch (error) {
                return { ok: false, error };
            }
        }

        // `value` is plain text; `sub` is HTML, so escape anything from the server.
        function stat({ label, value, sub = '', tone = '', href = '', title = '' }) {
            const body = `
                <div class="label">${esc(label)}</div>
                <div class="value${tone ? ` ${tone}` : ''}"${title ? ` title="${esc(title)}"` : ''}>${esc(value)}</div>
                ${sub ? `<div class="sub">${sub}</div>` : ''}`;
            return href
                ? `<a class="stat" href="${esc(href)}">${body}</a>`
                : `<div class="stat">${body}</div>`;
        }

        const statsRow = (cards) => `<div class="stats">${cards.join('')}</div>`;
        const failedStat = (label) => stat({ label, value: '–', sub: "Couldn't load" });

        // A quiet refresh keeps what is on screen; only the first load shows a spinner.
        function begin(el, label, quiet) {
            if (!quiet || !el.dataset.ready) ui.loading(el, label);
        }

        function fillRegion(el, html) {
            el.dataset.ready = '1';
            el.innerHTML = html;
        }

        function failRegion(el, options) {
            delete el.dataset.ready;
            ui.error(el, options);
        }

        function lastNDays(n) {
            const days = [];
            for (let i = n - 1; i >= 0; i--) {
                days.push(new Date(Date.now() - i * 86400000).toISOString().slice(0, 10));
            }
            return days;
        }

        function renderBarChart(el, points, labelFn, ariaLabel) {
            if (!points.length) {
                delete el.dataset.ready;
                ui.empty(el, { title: 'No data yet', body: 'Points appear here once there is something to chart.', icon: 'inbox' });
                return;
            }
            const values = points.map(p => ({ ...p, value: Number(p.value) || 0 }));
            const max = Math.max(...values.map(p => p.value), 1);
            fillRegion(el, `<div class="bar-chart" role="img" aria-label="${esc(ariaLabel)}">${values.map(p =>
                `<div class="bar" style="height:${Math.max(2, (p.value / max) * 100)}%"><div class="tip">${esc(labelFn(p))}</div></div>`
            ).join('')}</div>`);
        }

        // ---- Needs attention ----

        // Pending reports and appeals come from the sidebar's cached counts.
        function readCounts() {
            try {
                return JSON.parse(sessionStorage.getItem('dscoAdmin.counts.' + AdminShell.env) || 'null');
            } catch (_) {
                return null;
            }
        }

        function queueStat(label, count, page, waiting) {
            const href = pageHref(page);
            if (typeof count !== 'number') {
                return stat({ label, value: '–', sub: "Couldn't load. Open to check.", href });
            }
            return stat({
                label,
                value: ui.number(count),
                tone: count > 0 ? 'warn' : '',
                sub: count > 0 ? esc(waiting) : 'Nothing waiting',
                href,
            });
        }

        function crashStat(result) {
            const label = 'Crashes (7d)';
            const href = pageHref('crashes.html');
            if (!result.ok) return stat({ label, value: '–', sub: "Couldn't load. Open to check.", href });

            const data = result.value;
            if (!data.available) {
                return stat({ label, value: '–', sub: '<span class="badge warn">Setup needed</span>', href });
            }
            // v1alpha topIssues: { groups: [{ issue, metrics: [{ eventsCount }] }] }
            const issues = data.top_issues?.issues || data.top_issues?.topIssues || data.top_issues?.groups || [];
            if (!Array.isArray(issues)) {
                return stat({ label, value: '–', sub: 'Connected, unrecognized shape', href });
            }
            const totalEvents = issues.reduce((sum, row) => {
                const m = (row.metrics && row.metrics[0]) || {};
                return sum + Number(m.eventsCount ?? row.eventCount ?? row.crashCount ?? 0);
            }, 0);
            const value = totalEvents || issues.length;
            let sub = 'No crashes in 7 days';
            if (value) sub = totalEvents ? `${ui.number(issues.length)} top issues` : 'Distinct top issues';
            return stat({ label, value: ui.number(value), tone: value > 0 ? 'warn' : '', sub, href });
        }

        async function loadAttention({ quiet = false } = {}) {
            begin(els.attention, 'Checking what needs you…', quiet);
            const [, crashes] = await Promise.all([
                AdminShell.refreshCounts().catch(() => {}),
                attempt(AdminShell.api('realtime', '/admin/metrics/crashes', { days: 7 })),
            ]);
            const counts = readCounts() || {};
            if (!crashes.ok && typeof counts.reports !== 'number' && typeof counts.appeals !== 'number') {
                failRegion(els.attention, {
                    title: "Couldn't load what needs attention",
                    error: crashes.error,
                    onRetry: () => loadAttention(),
                });
                return;
            }
            fillRegion(els.attention, statsRow([
                queueStat('Pending reports', counts.reports, 'reports.html', 'Waiting for review'),
                queueStat('Pending appeals', counts.appeals, 'appeals.html', 'Waiting for a decision'),
                crashStat(crashes),
            ]));
        }

        // ---- Activity: KPIs and charts ----

        async function loadActivity({ quiet = false } = {}) {
            [els.kpis, els.dau, els.signups].forEach(el => begin(el, 'Loading…', quiet));
            const [users, costs] = await Promise.all([
                attempt(AdminShell.api('realtime', '/admin/metrics/users')),
                attempt(AdminShell.api('realtime', '/admin/metrics/costs')),
            ]);
            renderActivity(users, costs);
        }

        function renderActivity(users, costs) {
            const retry = () => loadActivity();

            if (!users.ok && !costs.ok) {
                failRegion(els.kpis, { title: "Couldn't load activity", error: users.error, onRetry: retry });
            }

            let userCards;
            if (users.ok) {
                const data = users.value;
                const live = data.live || {};
                const statuses = Object.entries(live.account_status_counts || {})
                    .filter(([status]) => status !== 'active')
                    .map(([status, count]) => `${esc(status)}: ${esc(count)}`).join(' · ');

                const signups = lastNDays(30).map(day => ({ day, value: live.signups_by_day?.[day] || 0 }));
                const signups7 = signups.slice(-7).reduce((sum, p) => sum + p.value, 0);
                userCards = [
                    stat({ label: 'Total users', value: num(live.total_users), sub: statuses }),
                    stat({ label: 'Online now', value: num(live.online_now) }),
                    stat({ label: 'Daily active', value: num(live.dau), sub: `WAU ${esc(num(live.wau))} · MAU ${esc(num(live.mau))}` }),
                    stat({ label: 'Signups (7d)', value: num(signups7) }),
                ];

                const history = (data.history || []).map(item => ({ day: item.date, value: Number(item.dau || 0) }));
                history.push({ day: 'today', value: live.dau });
                renderBarChart(els.dau, history, p => `${p.day}: ${p.value}`, 'Daily active users');
                renderBarChart(els.signups, signups, p => `${p.day}: ${p.value}`, 'Signups per day over the last 30 days');
            } else {
                userCards = ['Total users', 'Online now', 'Daily active', 'Signups (7d)'].map(failedStat);
                failRegion(els.dau, { title: "Couldn't load daily active users", error: users.error, onRetry: retry });
                failRegion(els.signups, { title: "Couldn't load signups", error: users.error, onRetry: retry });
            }

            if (!users.ok && !costs.ok) return;

            let awsCard;
            if (costs.ok) {
                const forecast = costs.value.aws?.forecast_month_end;
                awsCard = stat({
                    label: 'AWS month to date',
                    value: money(costs.value.aws?.month_to_date?.total),
                    sub: forecast != null ? `Forecast ${esc(money(forecast))} by month end` : '',
                    href: pageHref('costs.html'),
                });
            } else {
                awsCard = failedStat('AWS month to date');
            }
            fillRegion(els.kpis, statsRow([...userCards, awsCard]));
        }

        // ---- Ops health ----

        function opsCards(data) {
            // DLQ depth
            const dlq = data.dlq || {};
            let dlqCard;
            if (dlq.error) {
                dlqCard = stat({ label: 'DLQ depth', value: '–', sub: `<span class="badge warn">Error</span> ${esc(dlq.error)}` });
            } else if (dlq.visible == null && dlq.not_visible == null) {
                dlqCard = stat({ label: 'DLQ depth', value: '–', sub: 'No data' });
            } else {
                const visible = Number(dlq.visible || 0);
                dlqCard = stat({
                    label: 'DLQ depth',
                    value: num(visible),
                    tone: visible > 0 ? 'warn' : '',
                    sub: `${visible > 0 ? '<span class="badge warn">Messages waiting</span> ' : ''}${esc(num(Number(dlq.not_visible || 0)))} not visible · ${esc(dlq.queue_name || 'async-dlq')}`,
                });
            }

            // Geocode breaker
            const geo = data.geocode || {};
            let geoCard;
            if (geo.month_total == null && geo.ceiling == null) {
                geoCard = stat({ label: 'Geocode breaker', value: '–', sub: 'No data', href: pageHref('geocode.html') });
            } else {
                const tripped = !!geo.breaker_tripped;
                geoCard = stat({
                    label: 'Geocode breaker',
                    value: num(geo.month_total),
                    tone: tripped ? 'warn' : '',
                    sub: `of ${esc(num(geo.ceiling))} · ${tripped ? '<span class="badge warn">Tripped</span>' : '<span class="badge good">OK</span>'}${geo.month_key ? ` · ${esc(geo.month_key)}` : ''}`,
                    href: pageHref('geocode.html'),
                });
            }

            // Partiful last scrape
            const ps = data.partiful_sync;
            let psCard;
            if (!ps || ps.present === false) {
                psCard = stat({
                    label: 'Partiful last scrape',
                    value: '–',
                    sub: ps && ps.error ? `Error: ${esc(ps.error)}` : 'No scrape recorded yet',
                });
            } else {
                const s = ps.stats || {};
                const bits = [
                    s.regions_ok != null && `${num(s.regions_ok)} regions ok`,
                    s.regions_failed != null && `${num(s.regions_failed)} failed`,
                    s.pins_new != null && `${num(s.pins_new)} new pins`,
                    s.pins_updated != null && `${num(s.pins_updated)} updated`,
                    s.events_seen != null && `${num(s.events_seen)} events`,
                    ps.stage && `Stage ${ps.stage}`,
                ].filter(Boolean);
                psCard = stat({
                    label: 'Partiful last scrape',
                    value: ui.relative(ps.finished_at) || '–',
                    title: ui.time(ps.finished_at, { seconds: true }),
                    sub: esc(bits.join(' · ') || 'No stats'),
                });
            }

            // SES account send quota
            const ses = data.ses || {};
            let sesCard;
            if (ses.error) {
                sesCard = stat({ label: 'SES sends (24h)', value: '–', sub: `<span class="badge warn">Error</span> ${esc(ses.error)}` });
            } else if (ses.max_24h == null) {
                sesCard = stat({ label: 'SES sends (24h)', value: '–', sub: 'No data' });
            } else {
                const pctUsed = ses.pct_used || 0;
                const warn = pctUsed >= 80;
                let sub = `of ${esc(num(ses.max_24h))} · <span class="badge ${warn ? 'warn' : 'good'}">${esc(pctUsed)}%</span> · ${ses.production_access ? 'Production' : 'Sandbox'}`;
                if (!ses.production_access && ses.review_status) {
                    sub += ` · review ${esc(String(ses.review_status).toLowerCase())}`;
                }
                sesCard = stat({
                    label: 'SES sends (24h)',
                    value: num(ses.sent_24h),
                    tone: warn ? 'warn' : '',
                    sub,
                });
            }

            return [dlqCard, geoCard, psCard, sesCard];
        }

        // Crons shape: { window_hours, functions: { name: {...} }, error }
        function renderCrons(el, data) {
            const crons = data.crons || {};
            const fnMap = crons.functions || (typeof crons === 'object' && !crons.window_hours ? crons : {});
            const entries = Object.entries(fnMap).filter(([k]) =>
                k !== 'window_hours' && k !== 'error' && k !== 'functions'
            );
            if (crons.error) {
                ui.error(el, { title: "Couldn't read cron metrics", error: crons.error, onRetry: () => loadOps() });
                return;
            }
            if (!entries.length) {
                ui.empty(el, { title: 'No cron metrics', body: 'Cron invocations appear here once the metrics are collected.', icon: 'list' });
                return;
            }
            const rows = entries.map(([name, raw]) => {
                const row = raw && typeof raw === 'object' ? raw : {};
                const inv = row.invocations_24h ?? row.invocations ?? 0;
                const err = row.errors_24h ?? row.errors ?? 0;
                const last = row.last_invocation_bucket
                    ? ui.timeTag(row.last_invocation_bucket)
                    : '<span class="faint">–</span>';
                const errCell = Number(err) > 0 ? `<span class="badge warn">${esc(num(err))}</span>` : esc(num(err));
                return `<tr>
                    <td class="mono">${esc(name)}</td>
                    <td class="num">${esc(num(inv))}</td>
                    <td class="num">${errCell}</td>
                    <td class="muted">${last}</td>
                </tr>`;
            }).join('');
            el.innerHTML = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Cron</th>
                                <th class="num">Invocations (24h)</th>
                                <th class="num">Errors (24h)</th>
                                <th>Last invocation</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
        }

        async function loadOps({ quiet = false } = {}) {
            begin(els.ops, 'Checking ops health…', quiet);
            try {
                const data = await AdminShell.api('realtime', '/admin/metrics/ops', {});
                const stage = data.stage || '';
                const checked = data.checked_at ? ui.time(data.checked_at) : '';
                els.opsHint.textContent = [stage && `Stage ${stage}`, checked && `checked ${checked}`]
                    .filter(Boolean).join(' · ') || OPS_HINT;

                fillRegion(els.ops, `${statsRow(opsCards(data))}<div data-cron></div>`);
                renderCrons(els.ops.querySelector('[data-cron]'), data);
            } catch (error) {
                els.opsHint.textContent = OPS_HINT;
                failRegion(els.ops, { title: "Couldn't load ops health", error, onRetry: () => loadOps() });
            }
        }

        // ---- Levers ----

        function leverText(value) {
            if (value !== null && typeof value === 'object') return JSON.stringify(value);
            return String(value ?? '');
        }

        async function loadLevers({ quiet = false } = {}) {
            begin(els.levers, 'Loading levers…', quiet);
            try {
                const data = await AdminShell.api('realtime', '/admin/config/get');
                const entries = Object.entries(data.levers || {});
                els.leversHint.textContent = data.updated_at ? `Last changed ${ui.time(data.updated_at)}` : '';
                if (!entries.length) {
                    delete els.levers.dataset.ready;
                    ui.empty(els.levers, {
                        title: 'No levers set',
                        body: 'The server config has no levers yet. Set them on the Levers page.',
                        icon: 'sliders',
                        actionLabel: 'Open levers',
                        onAction: () => { window.location.href = pageHref('levers.html'); },
                    });
                    return;
                }
                const rows = entries.map(([name, value]) =>
                    `<tr><td class="mono">${esc(name)}</td><td><span class="badge">${esc(leverText(value))}</span></td></tr>`
                ).join('');
                fillRegion(els.levers, `
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>Lever</th><th>Value</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`);
            } catch (error) {
                els.leversHint.textContent = '';
                failRegion(els.levers, { title: "Couldn't load levers", error, onRetry: () => loadLevers() });
            }
        }

        // ---- Wiring ----

        function loadPage(options) {
            return Promise.all([
                loadAttention(options),
                loadActivity(options),
                loadOps(options),
                loadLevers(options),
            ]);
        }

        document.querySelectorAll('a[data-page]').forEach(a => { a.href = pageHref(a.dataset.page); });

        AdminShell.init({ active: 'index.html', title: 'Overview', onReady: () => loadPage() });

        document.getElementById('page-actions').innerHTML =
            `<button type="button" class="btn" id="refresh">${ui.icon('refresh')}Refresh</button>`;
        document.getElementById('refresh').addEventListener('click', (e) => ui.busy(e.currentTarget, () => loadPage({ quiet: true })));
    </script>
</body>
</html>
