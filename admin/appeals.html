<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSCO Admin - Appeals</title>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
        }

        .header {
            background: #16213e;
            padding: 20px;
            border-bottom: 1px solid #ffffff20;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            letter-spacing: 0.2em;
        }

        .header-nav {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .header-nav a {
            color: #ffffff80;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .header-nav a:hover {
            color: #fff;
            background: #ffffff10;
        }

        .header-nav a.active {
            color: #fff;
            background: #3182ce;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-actions button {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid #ffffff30;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .header-actions .logout-btn:hover {
            background: #e53e3e;
            border-color: #e53e3e;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .login-form {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: #16213e;
            border-radius: 12px;
        }

        .login-form h2 { margin-bottom: 20px; }

        .login-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ffffff30;
            border-radius: 8px;
            background: #1a1a2e;
            color: #fff;
            font-size: 16px;
        }

        .login-form button {
            width: 100%;
            padding: 14px;
            background: #3182ce;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-form button:hover { background: #2c5aa0; }
        .login-form button:disabled { background: #4a5568; cursor: not-allowed; }

        .login-error {
            color: #fc8181;
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: none;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #16213e;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .stat-card:hover {
            border-color: #ffffff30;
        }

        .stat-card.active {
            border-color: #3182ce;
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: bold;
            color: #3182ce;
        }

        .stat-card .label {
            color: #ffffff80;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .stat-card.pending .number { color: #f6ad55; }
        .stat-card.approved .number { color: #68d391; }
        .stat-card.denied .number { color: #e53e3e; }

        .appeals-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .appeal-card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #f6ad55;
        }

        .appeal-card.approved {
            border-left-color: #68d391;
            opacity: 0.8;
        }

        .appeal-card.denied {
            border-left-color: #e53e3e;
            opacity: 0.8;
        }

        .appeal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .appeal-user {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .appeal-user .username {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .appeal-user .user-id {
            font-size: 0.8rem;
            color: #ffffff60;
            font-family: monospace;
        }

        .appeal-time {
            font-size: 0.85rem;
            color: #ffffff60;
        }

        .appeal-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .appeal-status.pending { background: #f6ad5520; color: #f6ad55; }
        .appeal-status.approved { background: #68d39120; color: #68d391; }
        .appeal-status.denied { background: #e53e3e20; color: #e53e3e; }

        .appeal-section {
            margin-bottom: 16px;
        }

        .appeal-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #ffffff50;
            margin-bottom: 8px;
        }

        .appeal-section-content {
            background: #0f1729;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .original-action {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .original-action-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .original-action-item label {
            font-size: 0.7rem;
            color: #ffffff50;
            text-transform: uppercase;
        }

        .original-action-item span {
            font-size: 0.9rem;
        }

        .appeal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #ffffff10;
        }

        .appeal-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .appeal-actions .btn-approve {
            background: #68d391;
            color: #1a1a2e;
        }

        .appeal-actions .btn-approve:hover {
            background: #48bb78;
        }

        .appeal-actions .btn-deny {
            background: #e53e3e;
            color: #fff;
        }

        .appeal-actions .btn-deny:hover {
            background: #c53030;
        }

        .appeal-decision {
            margin-top: 16px;
            padding: 12px;
            background: #0f1729;
            border-radius: 8px;
        }

        .appeal-decision .decided-by {
            font-size: 0.8rem;
            color: #ffffff60;
        }

        .appeal-decision .decision-reason {
            margin-top: 8px;
            font-size: 0.9rem;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 16px;
            background: #16213e;
            border: 1px solid #ffffff30;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
        }

        .pagination button:hover:not(:disabled) {
            background: #3182ce;
            border-color: #3182ce;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #ffffff60;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #ffffff60;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .error-message {
            background: #e53e3e20;
            border: 1px solid #e53e3e;
            color: #fc8181;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .decision-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .decision-modal.active {
            display: flex;
        }

        .decision-modal-content {
            background: #16213e;
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
        }

        .decision-modal h3 {
            margin-bottom: 16px;
        }

        .decision-modal textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ffffff30;
            border-radius: 8px;
            background: #1a1a2e;
            color: #fff;
            font-size: 14px;
            min-height: 100px;
            resize: vertical;
            margin-bottom: 16px;
        }

        .decision-modal .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .decision-modal button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .decision-modal .btn-cancel {
            background: transparent;
            border: 1px solid #ffffff30;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>DSCO <span style="color: #3182ce;">ADMIN</span></h1>
        <div class="header-nav">
            <a href="index.html">Overview</a>
            <a href="reports.html">Reports</a>
            <a href="users.html">Users</a>
            <a href="appeals.html" class="active">Appeals</a>
            <a href="content.html">Content</a>
            <a href="audit.html">Audit</a>
            <a href="transparency.html">Transparency</a>
            <a href="levers.html">Levers</a>
            <a href="costs.html">Costs</a>
            <a href="crashes.html">Crashes</a>
        </div>
        <div class="header-actions" id="header-actions" style="display: none;">
            <button class="logout-btn" onclick="logout()">Sign Out</button>
        </div>
    </div>

    <!-- Login Section -->
    <div id="login-section" style="display: none;">
        <div class="login-form">
            <h2>Admin Sign In</h2>
            <div class="login-error" id="login-error"></div>
            <input type="email" id="email-input" placeholder="Email" autocomplete="email">
            <input type="password" id="password-input" placeholder="Password" autocomplete="current-password">
            <button id="login-btn" onclick="login()">Sign In</button>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" style="display: none;">
        <div class="container">
            <div class="error-message" id="error-message"></div>

            <div class="stats">
                <div class="stat-card pending" onclick="filterStatus('pending')">
                    <div class="number" id="pending-count">-</div>
                    <div class="label">Pending</div>
                </div>
                <div class="stat-card approved" onclick="filterStatus('approved')">
                    <div class="number" id="approved-count">-</div>
                    <div class="label">Approved</div>
                </div>
                <div class="stat-card denied" onclick="filterStatus('denied')">
                    <div class="number" id="denied-count">-</div>
                    <div class="label">Denied</div>
                </div>
            </div>

            <div class="appeals-list" id="appeals-container">
                <div class="loading">Loading appeals...</div>
            </div>

            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- Decision Modal -->
    <div class="decision-modal" id="decision-modal">
        <div class="decision-modal-content">
            <h3 id="modal-title">Decision</h3>
            <p id="modal-description" style="margin-bottom: 16px; color: #ffffff80;"></p>
            <textarea id="decision-reason" placeholder="Add a note for the user (optional)"></textarea>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeDecisionModal()">Cancel</button>
                <button id="modal-confirm-btn" onclick="confirmDecision()">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const COGNITO_USER_POOL_ID = 'us-west-1_3Z2uwqvBT';
        const COGNITO_CLIENT_ID = 'p5g5ou0a6r9la6it2c92tlje5';
        const API_BASE = 'https://api.dsco.dev/realtime';

        const poolData = {
            UserPoolId: COGNITO_USER_POOL_ID,
            ClientId: COGNITO_CLIENT_ID,
        };
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);

        let cognitoUser = null;
        let idToken = '';
        let allAppeals = [];
        let currentFilter = 'pending';
        let pendingDecision = null;

        const REASON_LABELS = {
            'HARASSMENT': 'Harassment',
            'HATE_SPEECH': 'Hate Speech',
            'SEXUAL_CONTENT': 'Sexual Content',
            'MINOR_SAFETY': 'Minor Safety',
            'SPAM': 'Spam',
            'IMPERSONATION': 'Impersonation',
            'SELF_HARM': 'Self-Harm',
            'VIOLENCE': 'Violence',
            'ILLEGAL_CONTENT': 'Illegal Content',
            'PRIVACY_VIOLATION': 'Privacy Violation',
            'OTHER': 'Other'
        };

        // --- Auth ---

        function init() {
            cognitoUser = userPool.getCurrentUser();
            if (cognitoUser) {
                cognitoUser.getSession((err, session) => {
                    if (err || !session || !session.isValid()) {
                        showLogin();
                        return;
                    }
                    idToken = session.getIdToken().getJwtToken();
                    showDashboard();
                    loadAppeals();
                });
            } else {
                showLogin();
            }
        }

        function showLogin() {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('dashboard-section').style.display = 'none';
            document.getElementById('header-actions').style.display = 'none';
        }

        function showDashboard() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            document.getElementById('header-actions').style.display = 'flex';
        }

        function login() {
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            if (!email || !password) {
                errorEl.textContent = 'Please enter email and password.';
                errorEl.style.display = 'block';
                return;
            }

            errorEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            const authDetails = new AmazonCognitoIdentity.AuthenticationDetails({
                Username: email,
                Password: password,
            });

            cognitoUser = new AmazonCognitoIdentity.CognitoUser({
                Username: email,
                Pool: userPool,
            });

            cognitoUser.authenticateUser(authDetails, {
                onSuccess: (result) => {
                    idToken = result.getIdToken().getJwtToken();
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                    showDashboard();
                    loadAppeals();
                },
                onFailure: (err) => {
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                    errorEl.textContent = err.message || 'Authentication failed.';
                    errorEl.style.display = 'block';
                },
            });
        }

        function logout() {
            if (cognitoUser) cognitoUser.signOut();
            cognitoUser = null;
            idToken = '';
            allAppeals = [];
            showLogin();
        }

        function getValidToken() {
            return new Promise((resolve, reject) => {
                if (!cognitoUser) {
                    reject(new Error('Not authenticated'));
                    return;
                }
                cognitoUser.getSession((err, session) => {
                    if (err) {
                        reject(err);
                        return;
                    }
                    if (!session.isValid()) {
                        reject(new Error('Session expired'));
                        return;
                    }
                    resolve(session.getIdToken().getJwtToken());
                });
            });
        }

        // --- Appeals ---

        async function loadAppeals() {
            const container = document.getElementById('appeals-container');
            container.innerHTML = '<div class="loading">Loading appeals...</div>';
            hideError();

            try {
                const token = await getValidToken();
                const response = await fetch(`${API_BASE}/admin/appeals/list`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });

                if (response.status === 401 || response.status === 403) {
                    showError('Access denied. Please check your permissions.');
                    setTimeout(logout, 2000);
                    return;
                }

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                allAppeals = data.appeals || [];
                updateStats();
                renderAppeals();

            } catch (error) {
                console.error('Error loading appeals:', error);
                if (error.message === 'Not authenticated' || error.message === 'Session expired') {
                    logout();
                } else {
                    showError('Failed to load appeals.');
                    container.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>Failed to load appeals</p></div>';
                }
            }
        }

        function updateStats() {
            const pending = allAppeals.filter(a => a.status === 'pending').length;
            const approved = allAppeals.filter(a => a.status === 'approved').length;
            const denied = allAppeals.filter(a => a.status === 'denied').length;

            document.getElementById('pending-count').textContent = pending;
            document.getElementById('approved-count').textContent = approved;
            document.getElementById('denied-count').textContent = denied;

            // Update active state
            document.querySelectorAll('.stat-card').forEach(card => card.classList.remove('active'));
            document.querySelector(`.stat-card.${currentFilter}`)?.classList.add('active');
        }

        function filterStatus(status) {
            currentFilter = status;
            updateStats();
            renderAppeals();
        }

        function renderAppeals() {
            const container = document.getElementById('appeals-container');

            const filtered = allAppeals.filter(a => a.status === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📋</div>
                        <p>No ${currentFilter} appeals</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(appeal => `
                <div class="appeal-card ${appeal.status}" id="appeal-${appeal.appeal_id}">
                    <div class="appeal-header">
                        <div class="appeal-user">
                            <span class="username">User Appeal</span>
                            <span class="user-id">${appeal.user_id}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <span class="appeal-status ${appeal.status}">${appeal.status}</span>
                            <span class="appeal-time">${formatTime(appeal.created_at)}</span>
                        </div>
                    </div>

                    <div class="appeal-section">
                        <div class="appeal-section-title">Original Action</div>
                        <div class="appeal-section-content">
                            <div class="original-action">
                                <div class="original-action-item">
                                    <label>Action Type</label>
                                    <span>${appeal.action_type || 'Unknown'}</span>
                                </div>
                                <div class="original-action-item">
                                    <label>Reason Code</label>
                                    <span>${REASON_LABELS[appeal.original_reason_code] || appeal.original_reason_code || '-'}</span>
                                </div>
                            </div>
                            ${appeal.original_reason_text ? `<p style="margin-top: 10px; color: #ffffff80;">${escapeHtml(appeal.original_reason_text)}</p>` : ''}
                        </div>
                    </div>

                    <div class="appeal-section">
                        <div class="appeal-section-title">User's Appeal Statement</div>
                        <div class="appeal-section-content">
                            ${escapeHtml(appeal.reason || appeal.statement || 'No statement provided')}
                        </div>
                    </div>

                    ${appeal.status === 'pending' ? `
                        <div class="appeal-actions">
                            <button class="btn-approve" onclick="showDecisionModal('${appeal.appeal_id}', 'approved')">✓ Approve Appeal</button>
                            <button class="btn-deny" onclick="showDecisionModal('${appeal.appeal_id}', 'denied')">✕ Deny Appeal</button>
                        </div>
                    ` : `
                        <div class="appeal-decision">
                            <div class="decided-by">
                                Decided ${formatTime(appeal.decided_at)} by ${appeal.decided_by || 'admin'}
                            </div>
                            ${appeal.decision_reason ? `<div class="decision-reason">${escapeHtml(appeal.decision_reason)}</div>` : ''}
                        </div>
                    `}
                </div>
            `).join('');
        }

        function showDecisionModal(appealId, decision) {
            pendingDecision = { appealId, decision };

            const modal = document.getElementById('decision-modal');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-description');
            const btn = document.getElementById('modal-confirm-btn');

            if (decision === 'approved') {
                title.textContent = 'Approve Appeal';
                desc.textContent = 'This will reverse the original moderation action and restore the user\'s account.';
                btn.textContent = 'Approve';
                btn.style.background = '#68d391';
                btn.style.color = '#1a1a2e';
            } else {
                title.textContent = 'Deny Appeal';
                desc.textContent = 'The original moderation action will remain in effect.';
                btn.textContent = 'Deny';
                btn.style.background = '#e53e3e';
                btn.style.color = '#fff';
            }

            document.getElementById('decision-reason').value = '';
            modal.classList.add('active');
        }

        function closeDecisionModal() {
            document.getElementById('decision-modal').classList.remove('active');
            pendingDecision = null;
        }

        async function confirmDecision() {
            if (!pendingDecision) return;

            const { appealId, decision } = pendingDecision;
            const reason = document.getElementById('decision-reason').value.trim();
            const btn = document.getElementById('modal-confirm-btn');

            btn.disabled = true;
            btn.textContent = 'Processing...';

            try {
                const token = await getValidToken();
                const response = await fetch(`${API_BASE}/admin/appeals/decide`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        appeal_id: appealId,
                        decision: decision,
                        decision_reason: reason
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.message || `HTTP ${response.status}`);
                }

                closeDecisionModal();
                loadAppeals();

            } catch (error) {
                console.error('Error deciding appeal:', error);
                showError(`Failed to process appeal: ${error.message}`);
                btn.disabled = false;
                btn.textContent = decision === 'approved' ? 'Approve' : 'Deny';
            }
        }

        function formatTime(isoString) {
            if (!isoString) return 'Unknown';
            const date = new Date(isoString);
            return date.toLocaleString();
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            const el = document.getElementById('error-message');
            el.textContent = message;
            el.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }

        // Handle Enter key on login form
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDecisionModal();
            if (e.key === 'Enter' && document.getElementById('login-section').style.display !== 'none') {
                login();
            }
        });

        document.getElementById('decision-modal').addEventListener('click', (e) => {
            if (e.target.id === 'decision-modal') closeDecisionModal();
        });

        init();
