<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Appeals · DSCO admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        /* Page-specific: the decision line on a decided appeal. */
        .outcome {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            color: var(--text-2);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <div class="seg" role="group" aria-label="Filter appeals" id="filters">
                <button type="button" data-filter="pending" aria-pressed="true">Pending <span class="count" data-count-for="pending"></span></button>
                <button type="button" data-filter="approved" aria-pressed="false">Approved <span class="count" data-count-for="approved"></span></button>
                <button type="button" data-filter="denied" aria-pressed="false">Denied <span class="count" data-count-for="denied"></span></button>
            </div>
        </div>

        <div id="appeals" class="item-list"></div>
    </div>

    <script src="assets/admin.js"></script>
    <script>
        const { ui } = AdminShell;
        const { esc } = ui;

        let allAppeals = [];
        let currentFilter = 'pending';

        const REASON_LABELS = {
            HARASSMENT: 'Harassment',
            HATE_SPEECH: 'Hate speech',
            SEXUAL_CONTENT: 'Sexual content',
            MINOR_SAFETY: 'Minor safety',
            SPAM: 'Spam',
            IMPERSONATION: 'Impersonation',
            SELF_HARM: 'Self-harm',
            VIOLENCE: 'Violence',
            ILLEGAL_CONTENT: 'Illegal content',
            PRIVACY_VIOLATION: 'Privacy violation',
            OTHER: 'Other',
        };

        // The action being appealed: label, badge tone and the card's headline.
        const ACTIONS = {
            warned: { label: 'Warned', tone: 'warn', title: 'Appeal against a warning' },
            suspended: { label: 'Suspended', tone: 'orange', title: 'Appeal against a suspension' },
            banned: { label: 'Banned', tone: 'bad', title: 'Appeal against a ban' },
            content_removed: { label: 'Content removed', tone: 'purple', title: 'Appeal against a content removal' },
        };

        const STATUSES = {
            pending: { label: 'Pending', tone: 'warn' },
            approved: { label: 'Approved', tone: 'good' },
            denied: { label: 'Denied', tone: 'bad' },
        };

        // Confirm copy per decision: titles are questions, buttons keep the verb.
        // Neither is destructive: approving reverses a sanction, denying leaves it as is.
        const DECISIONS = {
            approved: {
                title: 'Approve this appeal?',
                body: "Reverses the original moderation action and restores the person's account.",
                confirmLabel: 'Approve',
                verb: 'approve',
            },
            denied: {
                title: 'Deny this appeal?',
                body: 'The original moderation action stays in effect.',
                confirmLabel: 'Deny',
                verb: 'deny',
            },
        };

        const list = document.getElementById('appeals');

        // ---- Loading ----

        // A refresh keeps the current list on screen (the button shows the wait).
        async function loadAppeals({ quiet = false } = {}) {
            if (!quiet || !allAppeals.length) ui.loading(list, 'Loading appeals…');
            try {
                // The backend lists one status per call (pending by default),
                // so fetch all three and filter client-side.
                const pages = await Promise.all(['pending', 'approved', 'denied'].map(status =>
                    AdminShell.api('realtime', '/admin/appeals/list', { status })));
                allAppeals = pages.flatMap(data => data.appeals || []);
                updateCounts();
                render();
            } catch (error) {
                ui.error(list, { title: "Couldn't load appeals", error, onRetry: loadAppeals });
            }
        }

        function filtered() {
            return allAppeals.filter(a => a.status === currentFilter);
        }

        function updateCounts() {
            const counts = { pending: 0, approved: 0, denied: 0 };
            allAppeals.forEach(a => { if (Object.hasOwn(counts, a.status)) counts[a.status] += 1; });
            document.querySelectorAll('[data-count-for]').forEach(el => {
                el.textContent = String(counts[el.dataset.countFor]);
            });
            AdminShell.setCount('appeals', counts.pending);
        }

        // ---- Rendering ----

        function render() {
            const items = filtered();
            if (!items.length) {
                const copy = {
                    pending: { title: 'No appeals waiting', body: 'New appeals appear here when someone contests a moderation action.' },
                    approved: { title: 'No approved appeals', body: 'Appeals you approve move here.' },
                    denied: { title: 'No denied appeals', body: 'Appeals you deny move here.' },
                }[currentFilter];
                ui.empty(list, { ...copy, icon: 'scale' });
                return;
            }
            // Every appeal field is untrusted (the statement is user-typed), so
            // all of it goes through esc(); actions read data attributes.
            list.innerHTML = items.map(renderAppeal).join('');
        }

        function shortId(id) {
            return String(id || '').slice(0, 8);
        }

        function renderAppeal(appeal) {
            const pending = appeal.status === 'pending';
            const action = ACTIONS[appeal.action_type] || { label: appeal.action_type || 'Unknown', tone: '', title: 'Appeal' };
            const status = STATUSES[appeal.status] || { label: appeal.status || 'Unknown', tone: '' };
            const reasonCode = REASON_LABELS[appeal.original_reason_code] || appeal.original_reason_code || '–';
            const statement = appeal.reason || appeal.statement;
            return `
                <article class="item${pending ? '' : ' done'}" data-appeal-id="${esc(appeal.appeal_id)}">
                    <div class="item-head">
                        <div class="item-title">
                            ${esc(action.title)}
                            <span class="badge ${status.tone}">${esc(status.label)}</span>
                        </div>
                        <span class="item-time">${ui.timeTag(appeal.created_at)}</span>
                    </div>

                    <dl class="kv">
                        <dt>Person</dt>
                        <dd>${personLink(appeal.user_id)}</dd>
                        <dt>Original action</dt>
                        <dd><span class="badge ${action.tone}">${esc(action.label)}</span></dd>
                        <dt>Reason code</dt>
                        <dd>${esc(reasonCode)}</dd>
                        ${appeal.original_reason_text ? `
                            <dt>Reason detail</dt>
                            <dd>${esc(appeal.original_reason_text)}</dd>` : ''}
                    </dl>

                    <div style="margin-top:14px">
                        <div class="label-sm">Appeal statement</div>
                        ${statement
                            ? `<div class="quote">${esc(statement)}</div>`
                            : '<div class="faint">No statement provided</div>'}
                    </div>

                    <div class="item-actions">
                        ${pending ? `
                            <button type="button" class="btn" data-decision="approved">Approve</button>
                            <button type="button" class="btn" data-decision="denied">Deny</button>
                        ` : renderOutcome(appeal)}
                    </div>
                </article>`;
        }

        function personLink(id) {
            if (!id) return '<span class="faint">Unknown</span>';
            const href = `users.html?id=${encodeURIComponent(id)}&env=${encodeURIComponent(AdminShell.env)}`;
            return `<a class="mono" href="${esc(href)}" title="${esc(id)}">${esc(shortId(id))}</a>`;
        }

        function renderOutcome(appeal) {
            // The backend stores the decision note as admin_notes.
            const note = appeal.decision_reason || appeal.admin_notes;
            const by = appeal.decided_by
                ? `<span class="mono" title="${esc(appeal.decided_by)}">${esc(shortId(appeal.decided_by))}</span>`
                : 'admin';
            return `
                <div style="flex:1">
                    <div class="outcome">
                        <span>Decided by ${by}</span>
                        ${appeal.decided_at ? `<span>${ui.timeTag(appeal.decided_at)}</span>` : ''}
                    </div>
                    ${note ? `<div class="quote" style="margin-top:8px">${esc(note)}</div>` : ''}
                </div>`;
        }

        // ---- Actions ----

        async function decide(card, decision, button) {
            const spec = DECISIONS[decision];
            if (!spec) return;
            const values = await ui.confirm({
                title: spec.title,
                body: esc(spec.body),
                confirmLabel: spec.confirmLabel,
                fields: [
                    { name: 'reason', label: 'Note', type: 'textarea', placeholder: 'Optional, saved with the decision' },
                ],
            });
            if (!values) return;
            try {
                // appeals/decide reads admin_notes (the old page sent
                // decision_reason, which the backend dropped).
                await ui.busy(button, () => AdminShell.api('realtime', '/admin/appeals/decide', {
                    appeal_id: card.dataset.appealId,
                    decision,
                    admin_notes: values.reason,
                }));
                // The appeal leaves Pending, which is the confirmation. The
                // reload also refreshes the sidebar badge.
                await loadAppeals({ quiet: true });
            } catch (error) {
                ui.notice(`Couldn't ${spec.verb} this appeal: ${error.message}`, { tone: 'bad' });
            }
        }

        // ---- Wiring ----

        document.getElementById('filters').addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-filter]');
            if (!btn) return;
            currentFilter = btn.dataset.filter;
            document.querySelectorAll('#filters button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
            render();
        });

        list.addEventListener('click', (e) => {
            const button = e.target.closest('button[data-decision]');
            const card = button && button.closest('[data-appeal-id]');
            if (card) decide(card, button.dataset.decision, button);
        });

        AdminShell.init({ active: 'appeals.html', title: 'Appeals', onReady: loadAppeals });

        document.getElementById('page-actions').innerHTML =
            `<button type="button" class="btn" id="refresh">${ui.icon('refresh')}Refresh</button>`;
        document.getElementById('refresh').addEventListener('click', (e) => ui.busy(e.currentTarget, () => loadAppeals({ quiet: true })));
    </script>
</body>
</html>
