<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Reports · DSCO admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        /* Page-specific: report people row and the captured evidence. */
        .report-people {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px 24px;
        }

        @media (max-width: 640px) {
            .report-people { grid-template-columns: 1fr; }
        }

        .who-name { font-weight: 600; }
        .who-name.reporter { color: var(--accent); }
        .who-name.reported-user { color: var(--orange); }

        .evidence {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 14px;
        }

        .evidence-original {
            margin-top: 6px;
            font-size: 13px;
            color: var(--text-2);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .snapshot-status {
            padding: 8px 12px;
            border-radius: var(--r);
            background: var(--warn-bg);
            color: var(--warn);
            font-size: 13px;
        }

        .snapshot-status.failed { background: var(--bad-bg); color: var(--bad); }

        .snapshot {
            list-style: none;
            border: 1px solid var(--border);
            border-radius: var(--r);
            max-height: 380px;
            overflow-y: auto;
        }

        .snap-msg {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
        }

        .snap-msg:last-child { border-bottom: none; }

        .snap-msg.reported {
            background: var(--warn-bg);
            box-shadow: inset 3px 0 0 var(--warn);
        }

        .snap-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
            font-size: 13px;
        }

        .snap-time {
            margin-left: auto;
            font-size: 12px;
            color: var(--text-3);
            white-space: nowrap;
        }

        .snap-sender { font-weight: 600; color: var(--text-2); }
        .snap-sender.other { font-family: var(--mono); font-weight: 400; font-size: 12px; color: var(--text-3); }
        .snap-sender.reporter { color: var(--accent); }
        .snap-sender.reported-user { color: var(--orange); }

        .snap-text { white-space: pre-wrap; overflow-wrap: anywhere; }
        .snap-msg.deleted .snap-text { color: var(--text-2); }

        .snap-original {
            margin-top: 4px;
            padding-left: 8px;
            border-left: 2px solid var(--border-strong);
            font-size: 13px;
            color: var(--text-2);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .snap-original .label-sm { margin-bottom: 0; }
        .snap-note { margin-top: 4px; font-size: 12px; color: var(--text-3); }

        .media-strip { display: flex; flex-wrap: wrap; gap: 8px; }
        .snap-msg .media-strip { margin-top: 6px; }

        .media-thumb {
            position: relative;
            width: 96px;
            height: 96px;
            padding: 0;
            border: 1px solid var(--border-strong);
            border-radius: var(--r);
            background: var(--surface-2);
            overflow: hidden;
            cursor: zoom-in;
            font-family: inherit;
            font-size: 12px;
            color: var(--text-3);
        }

        .snap-msg .media-thumb { width: 72px; height: 72px; }
        .media-thumb:hover { border-color: var(--accent); }

        .media-thumb img,
        .media-thumb video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-thumb .media-badge {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.6));
            pointer-events: none;
        }

        .media-thumb .media-badge .icon { width: 22px; height: 22px; fill: #ffffff; stroke: none; }

        .outcome {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            color: var(--text-2);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <div class="seg" role="group" aria-label="Filter reports" id="filters">
                <button type="button" data-filter="pending" aria-pressed="true">Pending <span class="count" data-count-for="pending"></span></button>
                <button type="button" data-filter="actioned" aria-pressed="false">Actioned <span class="count" data-count-for="actioned"></span></button>
                <button type="button" data-filter="all" aria-pressed="false">All <span class="count" data-count-for="all"></span></button>
            </div>
        </div>

        <div id="reports" class="item-list"></div>
    </div>

    <script src="assets/admin.js"></script>
    <script>
        const { ui } = AdminShell;
        const { esc } = ui;

        let allReports = [];
        let currentFilter = 'pending';

        const REASON_LABELS = {
            harassment: 'Harassment or bullying',
            spam: 'Spam or scam',
            inappropriate: 'Inappropriate content',
            underage: 'Underage user',
            impersonation: 'Impersonation',
            other: 'Other',
        };

        const CONTENT_TYPE_LABELS = {
            message: 'Message',
            channel: 'Channel',
            user: 'Profile',
            story: 'Story',
            pin: 'Pin',
            profile: 'Profile',
        };

        // Outcome label and badge tone per action.
        const ACTIONS = {
            dismissed: { label: 'Dismissed', tone: '' },
            reviewed: { label: 'Reviewed', tone: 'info' },
            warned: { label: 'Warned', tone: 'warn' },
            suspended: { label: 'Suspended', tone: 'orange' },
            banned: { label: 'Banned', tone: 'bad' },
        };

        const REASON_CODES = [
            ['HARASSMENT', 'Harassment'],
            ['HATE_SPEECH', 'Hate speech'],
            ['SEXUAL_CONTENT', 'Sexual content'],
            ['MINOR_SAFETY', 'Minor safety'],
            ['SPAM', 'Spam'],
            ['IMPERSONATION', 'Impersonation'],
            ['SELF_HARM', 'Self-harm'],
            ['VIOLENCE', 'Violence'],
            ['ILLEGAL_CONTENT', 'Illegal content'],
            ['PRIVACY_VIOLATION', 'Privacy violation'],
            ['OTHER', 'Other'],
        ];

        // Confirm copy per action: titles are questions, buttons keep the verb.
        const CONFIRMS = {
            dismissed: { title: 'Dismiss this report?', body: 'No action is taken against the reported person.', confirmLabel: 'Dismiss' },
            reviewed: { title: 'Mark this report reviewed?', body: 'Closes the report without a penalty.', confirmLabel: 'Mark reviewed' },
            warned: { title: 'Warn this person?', body: 'They get a warning notification.', confirmLabel: 'Warn', needsReason: true },
            suspended: { title: 'Suspend this person?', body: 'They lose access until the suspension ends.', confirmLabel: 'Suspend', needsReason: true, destructive: true },
            banned: { title: 'Ban this person?', body: 'They lose access permanently.', confirmLabel: 'Ban', needsReason: true, destructive: true },
        };

        const VIDEO_EXTS = new Set(['mp4', 'mov', 'm4v', 'webm', 'qt']);
        const AUDIO_EXTS = new Set(['m4a', 'aac', 'mp3', 'wav', 'ogg', 'opus', 'caf']);

        const SNAPSHOT_STATUS_LABELS = {
            failed: 'Evidence capture failed, so no snapshot was saved for this report.',
            not_member: "The reporter couldn't read this chat, so no snapshot was taken.",
            message_missing: 'The reported message was already gone when the report was filed.',
        };

        const list = document.getElementById('reports');

        // ---- Loading ----

        // A refresh keeps the current list on screen (the button shows the wait).
        async function loadReports({ quiet = false } = {}) {
            if (!quiet || !allReports.length) ui.loading(list, 'Loading reports…');
            try {
                // GET /reports/list (CORS allows OPTIONS, GET only).
                const data = await AdminShell.api('social', '/reports/list', null, { method: 'GET' });
                allReports = data.reports || [];
                updateCounts();
                render();
            } catch (error) {
                ui.error(list, { title: "Couldn't load reports", error, onRetry: loadReports });
            }
        }

        function filtered() {
            if (currentFilter === 'all') return allReports;
            return allReports.filter(r => (currentFilter === 'pending' ? r.status === 'pending' : r.status !== 'pending'));
        }

        function updateCounts() {
            const pending = allReports.filter(r => r.status === 'pending').length;
            const counts = { pending, actioned: allReports.length - pending, all: allReports.length };
            document.querySelectorAll('[data-count-for]').forEach(el => {
                el.textContent = String(counts[el.dataset.countFor]);
            });
            AdminShell.setCount('reports', pending);
        }

        // ---- Rendering ----

        function render() {
            const items = filtered();
            if (!items.length) {
                const copy = {
                    pending: { title: 'No reports waiting', body: 'New reports appear here as people file them.' },
                    actioned: { title: 'No actioned reports yet', body: 'Reports you act on move here.' },
                    all: { title: 'No reports yet', body: 'Reports appear here as people file them.' },
                }[currentFilter];
                ui.empty(list, { ...copy, icon: 'flag' });
                return;
            }
            // Every report field is untrusted (reporter-typed ids included), so
            // all of it goes through esc(); actions read data attributes.
            list.innerHTML = items.map(renderReport).join('');
        }

        function renderReport(report) {
            const pending = report.status === 'pending';
            const typeLabel = CONTENT_TYPE_LABELS[report.content_type] || '';
            return `
                <article class="item${pending ? '' : ' done'}" data-report-id="${esc(report.report_id)}" data-reported-id="${esc(report.reported_id)}">
                    <div class="item-head">
                        <div>
                            <div class="item-title">
                                ${esc(REASON_LABELS[report.reason] || report.reason || 'Report')}
                                ${typeLabel ? `<span class="badge">${esc(typeLabel)}</span>` : ''}
                            </div>
                        </div>
                        <span class="item-time">${ui.timeTag(report.created_at)}</span>
                    </div>

                    <div class="report-people">
                        ${personBlock('Reporter', report.reporter_id, report.reporter_username, 'reporter')}
                        ${personBlock('Reported user', report.reported_id, report.reported_username, 'reported-user')}
                    </div>

                    ${report.details ? `
                        <div style="margin-top:14px">
                            <div class="label-sm">Reporter's note</div>
                            <div class="quote">${esc(report.details)}</div>
                        </div>` : ''}

                    ${renderEvidence(report)}

                    <div class="item-actions">
                        ${pending ? `
                            <button type="button" class="btn" data-action="dismissed">Dismiss</button>
                            <button type="button" class="btn" data-action="reviewed">Mark reviewed</button>
                            <span class="spacer"></span>
                            <button type="button" class="btn" data-action="warned">Warn</button>
                            <button type="button" class="btn danger" data-action="suspended">Suspend</button>
                            <button type="button" class="btn danger" data-action="banned">Ban</button>
                        ` : renderOutcome(report)}
                    </div>
                </article>`;
        }

        function personBlock(label, id, username, roleClass) {
            const href = id ? `users.html?id=${encodeURIComponent(id)}&env=${encodeURIComponent(AdminShell.env)}` : '';
            const name = `@${username || 'Unknown'}`;
            return `
                <div>
                    <div class="label-sm">${esc(label)}</div>
                    ${href ? `<a class="who-name ${roleClass}" href="${esc(href)}">${esc(name)}</a>` : `<span class="who-name">${esc(name)}</span>`}
                    <span class="mono faint" title="${esc(id)}">${esc(String(id || '').slice(0, 8))}</span>
                </div>`;
        }

        function renderOutcome(report) {
            const action = ACTIONS[report.action_taken] || { label: report.action_taken || 'Actioned', tone: '' };
            return `
                <div style="flex:1">
                    <div class="outcome">
                        <span class="badge ${action.tone}">${esc(action.label)}</span>
                        ${report.actioned_by ? `<span>by <span class="mono" title="${esc(report.actioned_by)}">${esc(String(report.actioned_by).slice(0, 8))}</span></span>` : ''}
                        ${report.updated_at ? `<span>${ui.timeTag(report.updated_at)}</span>` : ''}
                    </div>
                    ${report.admin_notes ? `<div class="quote" style="margin-top:8px">${esc(report.admin_notes)}</div>` : ''}
                </div>`;
        }

        // ---- Evidence (content_text, snapshot, copied media) ----

        function renderEvidence(report) {
            const sections = [
                contentSection(report),
                snapshotStatusSection(report),
                snapshotSection(report),
                evidenceGallery(report),
            ].filter(Boolean);
            return sections.length ? `<div class="evidence">${sections.join('')}</div>` : '';
        }

        function evidenceSection(label, body) {
            return `<div><div class="label-sm">${esc(label)}</div>${body}</div>`;
        }

        function contentSection(report) {
            const text = report.content_text;
            if (!text) return '';
            const original = report.content_original_text;
            const label = report.content_type === 'channel' ? 'Reported channel' : 'Reported message';
            return evidenceSection(label, `
                <div class="quote">${esc(text)}</div>
                ${original && original !== text ? `<div class="evidence-original">Edited, original: ${esc(original)}</div>` : ''}
            `);
        }

        function snapshotStatusSection(report) {
            const status = report.snapshot_status;
            if (!status || status === 'ok') return '';
            const label = SNAPSHOT_STATUS_LABELS[status] || `Snapshot status: ${status}`;
            return `<div class="snapshot-status ${status === 'failed' ? 'failed' : ''}">${esc(label)}</div>`;
        }

        function parseSnapshot(raw) {
            if (Array.isArray(raw)) return raw;
            if (typeof raw !== 'string' || !raw) return null;
            try {
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : null;
            } catch (_) {
                return null;
            }
        }

        function snapshotSection(report) {
            if (!report.content_snapshot) return '';
            const entries = parseSnapshot(report.content_snapshot);
            const label = report.content_type === 'channel' ? 'Channel at report time' : 'Conversation at report time';
            if (!entries) return evidenceSection(label, '<div class="snap-note">Snapshot is unreadable.</div>');
            if (!entries.length) return evidenceSection(label, '<div class="snap-note">No messages captured.</div>');
            const rows = entries.map(entry => snapshotRow(entry, report)).join('');
            return evidenceSection(`${label} (${entries.length})`, `<ol class="snapshot">${rows}</ol>`);
        }

        function snapshotRow(entry, report) {
            if (!entry || typeof entry !== 'object') return '';
            const text = typeof entry.text === 'string' ? entry.text : '';
            const original = typeof entry.originalText === 'string' ? entry.originalText : '';
            const edited = entry.editedAt != null || (original && original !== text);
            const editedTitle = entry.editedAt != null ? ` title="Edited ${esc(ui.time(entry.editedAt, { seconds: true }))}"` : '';

            const marks = [
                entry.reported ? '<span class="badge warn">Reported</span>' : '',
                edited ? `<span class="badge info"${editedTitle}>Edited</span>` : '',
                entry.isDeleted ? '<span class="badge bad">Deleted</span>' : '',
            ].join('');

            const classes = ['snap-msg', entry.reported ? 'reported' : '', entry.isDeleted ? 'deleted' : '']
                .filter(Boolean).join(' ');

            return `
                <li class="${classes}">
                    <div class="snap-meta">
                        ${senderLabel(entry.senderId, report)}
                        ${marks}
                        <span class="snap-time" title="${esc(ui.time(entry.timestamp, { seconds: true }))}">${esc(ui.time(entry.timestamp))}</span>
                    </div>
                    ${text ? `<div class="snap-text">${esc(text)}</div>` : ''}
                    ${original && original !== text ? `
                        <div class="snap-original"><div class="label-sm">Before edit</div>${esc(original)}</div>` : ''}
                    ${entryMedia(entry)}
                </li>`;
        }

        // The reporter and reported user are named above, so their rows show
        // just the name in the same colour; anyone else gets a short id.
        function senderLabel(senderId, report) {
            const id = typeof senderId === 'string' ? senderId : '';
            if (!id) return '<span class="snap-sender other">Unknown sender</span>';
            if (id === report.reported_id) {
                return `<span class="snap-sender reported-user" title="Reported user · ${esc(id)}">@${esc(report.reported_username || 'Unknown')}</span>`;
            }
            if (id === report.reporter_id) {
                return `<span class="snap-sender reporter" title="Reporter · ${esc(id)}">@${esc(report.reporter_username || 'Unknown')}</span>`;
            }
            return `<span class="snap-sender other" title="${esc(id)}">User ${esc(id.slice(0, 8))}</span>`;
        }

        // reports/list signs snapshot media only when it's this report's own
        // evidence copy; anything else arrives nulled with mediaUnavailable.
        function entryMedia(entry) {
            const media = safeMediaUrl(entry.mediaUrl);
            const thumb = safeMediaUrl(entry.thumbnailUrl);
            if (media) {
                const kind = entry.type === 'video' ? 'video' : mediaKindOf(media);
                return `<div class="media-strip">${mediaThumb(media, kind, thumb)}</div>`;
            }
            if (thumb) return `<div class="media-strip">${mediaThumb(thumb, 'image')}</div>`;
            if (!entry.mediaUnavailable) return '';
            const what = entry.type === 'video' ? 'Video' : entry.type === 'image' ? 'Image' : 'Media';
            return `<div class="snap-note">${what} not captured</div>`;
        }

        function evidenceGallery(report) {
            const urls = (Array.isArray(report.evidence_urls) ? report.evidence_urls : [])
                .map(safeMediaUrl)
                .filter(Boolean);
            if (!urls.length) return '';
            const tiles = urls.map(url => mediaThumb(url, mediaKindOf(url))).join('');
            return evidenceSection(`Evidence files (${urls.length})`, `<div class="media-strip">${tiles}</div>`);
        }

        // A tile that opens [src] full size. [preview] is what the tile shows
        // instead (a video's poster frame, an image thumbnail).
        function mediaThumb(src, kind, preview) {
            const label = kind === 'video' ? 'Open video' : kind === 'audio' ? 'Play audio' : 'Open image';
            let face = '';
            if (preview) face = `<img src="${esc(preview)}" alt="" loading="lazy">`;
            else if (kind === 'video') face = `<video src="${esc(src)}" preload="metadata" muted playsinline></video>`;
            else if (kind === 'image') face = `<img src="${esc(src)}" alt="" loading="lazy">`;
            const badge = kind === 'video' || kind === 'audio' ? `<span class="media-badge">${ui.icon('play')}</span>` : '';
            return `<button type="button" class="media-thumb" data-media-src="${esc(src)}" data-media-kind="${kind}"
                        title="${label}" aria-label="${label}">${face}${badge}</button>`;
        }

        // Only the backend's signed https URLs are ever loaded into the page.
        function safeMediaUrl(url) {
            return typeof url === 'string' && /^https:\/\//i.test(url) ? url : null;
        }

        function mediaKindOf(url) {
            let ext = '';
            try {
                ext = new URL(url).pathname.split('.').pop().toLowerCase();
            } catch (_) { /* not a URL: treat as image */ }
            if (VIDEO_EXTS.has(ext)) return 'video';
            if (AUDIO_EXTS.has(ext)) return 'audio';
            return 'image';
        }

        // ---- Actions ----

        async function takeAction(card, action, button) {
            const spec = CONFIRMS[action];
            if (!spec) return;
            const fields = spec.needsReason ? [
                { name: 'reason_code', label: 'Reason', type: 'select', options: REASON_CODES, required: true, placeholder: 'Choose a reason…' },
                { name: 'notes', label: 'Notes', type: 'textarea', placeholder: 'Context for the audit log (optional)' },
            ] : [
                { name: 'notes', label: 'Notes', type: 'textarea', placeholder: 'Optional' },
            ];
            const values = await ui.confirm({
                title: spec.title,
                body: esc(spec.body),
                confirmLabel: spec.confirmLabel,
                destructive: !!spec.destructive,
                fields,
            });
            if (!values) return;
            try {
                await ui.busy(button, () => AdminShell.api('social', '/reports/action', {
                    report_id: card.dataset.reportId,
                    action,
                    target_user_id: card.dataset.reportedId,
                    reason_code: values.reason_code || null,
                    admin_notes: values.notes || '',
                }));
                // The report leaves Pending, which is the confirmation.
                await loadReports({ quiet: true });
            } catch (error) {
                ui.notice(`Couldn't ${spec.confirmLabel.toLowerCase()}: ${error.message}`, { tone: 'bad' });
            }
        }

        // ---- Wiring ----

        document.getElementById('filters').addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-filter]');
            if (!btn) return;
            currentFilter = btn.dataset.filter;
            document.querySelectorAll('#filters button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
            render();
        });

        list.addEventListener('click', (e) => {
            const tile = e.target.closest('[data-media-src]');
            if (tile) {
                ui.media(tile.dataset.mediaSrc, tile.dataset.mediaKind);
                return;
            }
            const button = e.target.closest('button[data-action]');
            const card = button && button.closest('[data-report-id]');
            if (card) takeAction(card, button.dataset.action, button);
        });

        // Signed URLs expire after an hour (Refresh re-signs); label the tile
        // instead of showing a broken image. Media errors don't bubble.
        list.addEventListener('error', (e) => {
            if (!['IMG', 'VIDEO'].includes(e.target.tagName)) return;
            const tile = e.target.closest('.media-thumb');
            if (tile) tile.textContent = 'Unavailable';
        }, true);

        AdminShell.init({ active: 'reports.html', title: 'Reports', onReady: loadReports });

        document.getElementById('page-actions').innerHTML =
            `<button type="button" class="btn" id="refresh">${ui.icon('refresh')}Refresh</button>`;
        document.getElementById('refresh').addEventListener('click', (e) => ui.busy(e.currentTarget, () => loadReports({ quiet: true })));
    </script>
</body>
</html>
