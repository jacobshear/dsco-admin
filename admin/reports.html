<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports — DSCO Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filters button {
            padding: 8px 16px;
            border: 1px solid var(--line-strong);
            background: transparent;
            color: var(--ink);
            border-radius: var(--pill);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .filters button:hover,
        .filters button.active {
            background: var(--info);
            border-color: var(--info);
            color: #0a0a0c;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--panel);
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            border: 1px solid var(--line);
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--info);
        }

        .stat-card .label {
            color: var(--ink-50);
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .stat-card.pending .number { color: var(--warn); }
        .stat-card.actioned .number { color: var(--good); }

        .reports-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .report-card {
            background: var(--panel);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--line);
            border-left: 4px solid var(--warn);
        }

        .report-card.actioned {
            border-left-color: var(--good);
            opacity: 0.7;
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .report-reason {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .report-time {
            color: var(--ink-35);
            font-size: 0.85rem;
        }

        .report-users {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        .user-info label {
            color: var(--ink-35);
            font-size: 0.8rem;
            display: block;
            margin-bottom: 5px;
        }

        .user-info .username {
            font-weight: 500;
        }

        .user-info .user-id {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--ink-35);
        }

        .report-details {
            background: var(--panel-2);
            padding: 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 15px;
            color: var(--ink-70);
        }

        .report-details:empty {
            display: none;
        }

        .report-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .report-actions button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn-dismiss {
            background: var(--accent-dim);
            border: 1px solid var(--line-strong);
            color: var(--ink);
        }

        .btn-reviewed {
            background: var(--info);
            color: #0a0a0c;
        }

        .btn-warn {
            background: var(--warn);
            color: #0a0a0c;
        }

        .btn-suspend {
            background: var(--orange);
            color: #0a0a0c;
        }

        .btn-ban {
            background: var(--bad);
            color: #fff;
        }

        .report-actions button:hover {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--ink-35);
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--ink-35);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .report-users {
                grid-template-columns: 1fr;
            }
        }

        /* Action Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--panel);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 450px;
            width: 90%;
            border: 1px solid var(--line);
        }

        .modal h3 {
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal .close-btn {
            background: none;
            border: none;
            color: var(--ink);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--ink-50);
        }

        .modal select,
        .modal textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            background: var(--panel-2);
            color: var(--ink);
            font-size: 14px;
            font-family: inherit;
        }

        .modal select option {
            background: var(--panel-2);
        }

        .modal textarea {
            min-height: 80px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
        }

        .modal-actions .btn-cancel {
            background: rgba(255, 255, 255, 0.08);
            color: var(--ink);
        }

        .modal-actions .btn-confirm {
            background: var(--bad);
            color: #fff;
        }

        .modal-actions .btn-confirm.warn {
            background: var(--warn);
            color: #0a0a0c;
        }

        .modal-actions .btn-confirm.suspend {
            background: var(--orange);
            color: #0a0a0c;
        }

        .modal-actions .btn-confirm:disabled {
            background: var(--line-strong);
            cursor: not-allowed;
        }

        .action-type-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 8px;
        }

        .action-type-badge.warned { background: var(--warn-bg); color: var(--warn); }
        .action-type-badge.suspended { background: var(--orange-bg); color: var(--orange); }
        .action-type-badge.banned { background: var(--bad-bg); color: var(--bad); }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <div class="number" id="total-count">-</div>
                <div class="label">Total reports</div>
            </div>
            <div class="stat-card pending">
                <div class="number" id="pending-count">-</div>
                <div class="label">Pending</div>
            </div>
            <div class="stat-card actioned">
                <div class="number" id="actioned-count">-</div>
                <div class="label">Actioned</div>
            </div>
        </div>

        <div class="filters">
            <button class="active" onclick="filterReports('all')">All</button>
            <button onclick="filterReports('pending')">Pending</button>
            <button onclick="filterReports('actioned')">Actioned</button>
            <button onclick="loadReports()" style="margin-left: auto;">↻ Refresh</button>
        </div>

        <div class="error-banner" id="error-message"></div>

        <div id="reports-container" class="reports-list">
            <div class="loading">Loading reports...</div>
        </div>
    </div>

    <!-- Action Modal -->
    <div class="modal" id="action-modal">
        <div class="modal-content">
            <h3>
                <span id="modal-title">Take Action</span>
                <button class="close-btn" onclick="closeActionModal()">&times;</button>
            </h3>
            <p id="modal-desc" style="margin-bottom: 16px; color: var(--ink-50);"></p>
            <label>Reason Code <span style="color: var(--bad);">*</span></label>
            <select id="action-reason-code">
                <option value="">Select reason...</option>
                <option value="HARASSMENT">Harassment</option>
                <option value="HATE_SPEECH">Hate Speech</option>
                <option value="SEXUAL_CONTENT">Sexual Content</option>
                <option value="MINOR_SAFETY">Minor Safety</option>
                <option value="SPAM">Spam</option>
                <option value="IMPERSONATION">Impersonation</option>
                <option value="SELF_HARM">Self-Harm</option>
                <option value="VIOLENCE">Violence</option>
                <option value="ILLEGAL_CONTENT">Illegal Content</option>
                <option value="PRIVACY_VIOLATION">Privacy Violation</option>
                <option value="OTHER">Other</option>
            </select>
            <label>Notes (optional)</label>
            <textarea id="action-notes" placeholder="Additional context for the action..."></textarea>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeActionModal()">Cancel</button>
                <button class="btn-confirm" id="confirm-action-btn" onclick="confirmAction()">Confirm</button>
            </div>
        </div>
    </div>

    <script src="assets/admin.js"></script>
    <script>
        let allReports = [];
        let currentFilter = 'all';
        let pendingAction = null; // {reportId, action, targetUserId}

        const REASON_LABELS = {
            'harassment': 'Harassment or bullying',
            'spam': 'Spam or scam',
            'inappropriate': 'Inappropriate content',
            'underage': 'Underage user',
            'impersonation': 'Impersonation',
            'other': 'Other'
        };

        const ACTION_LABELS = {
            'warned': 'Warn User',
            'suspended': 'Suspend User',
            'banned': 'Ban User'
        };

        async function loadReports() {
            const container = document.getElementById('reports-container');
            container.innerHTML = '<div class="loading">Loading reports...</div>';
            hideError();

            try {
                // Backend registers GET /reports/list (query params for filters).
                // POST is not allowed — CORS preflight only lists OPTIONS,GET.
                const data = await AdminShell.api('social', '/reports/list', null, { method: 'GET' });
                allReports = data.reports || [];
                updateStats();
                renderReports();
            } catch (error) {
                console.error('Error loading reports:', error);
                showError(`Failed to load reports: ${error.message || 'check your connection'}`);
            }
        }

        function updateStats() {
            const pending = allReports.filter(r => r.status === 'pending').length;
            const actioned = allReports.filter(r => r.status === 'actioned').length;

            document.getElementById('total-count').textContent = allReports.length;
            document.getElementById('pending-count').textContent = pending;
            document.getElementById('actioned-count').textContent = actioned;
        }

        function filterReports(filter) {
            currentFilter = filter;

            document.querySelectorAll('.filters button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            renderReports();
        }

        function renderReports() {
            const container = document.getElementById('reports-container');

            let filtered = allReports;
            if (currentFilter === 'pending') {
                filtered = allReports.filter(r => r.status === 'pending');
            } else if (currentFilter === 'actioned') {
                filtered = allReports.filter(r => r.status === 'actioned');
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📋</div>
                        <p>No reports found</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(report => `
                <div class="report-card ${report.status === 'actioned' ? 'actioned' : ''}" id="report-${report.report_id}">
                    <div class="report-header">
                        <div class="report-reason">${REASON_LABELS[report.reason] || report.reason}</div>
                        <div class="report-time">${formatTime(report.created_at)}</div>
                    </div>

                    <div class="report-users">
                        <div class="user-info">
                            <label>Reporter</label>
                            <div class="username">@${report.reporter_username || 'Unknown'}</div>
                            <div class="user-id">${report.reporter_id}</div>
                        </div>
                        <div class="user-info">
                            <label>Reported User</label>
                            <div class="username">@${report.reported_username || 'Unknown'}</div>
                            <div class="user-id">${report.reported_id}</div>
                        </div>
                    </div>

                    ${report.details ? `<div class="report-details">${escapeHtml(report.details)}</div>` : ''}

                    ${report.status === 'pending' ? `
                        <div class="report-actions">
                            <button class="btn-dismiss" onclick="takeAction('${report.report_id}', 'dismissed', '${report.reported_id}')">Dismiss</button>
                            <button class="btn-reviewed" onclick="takeAction('${report.report_id}', 'reviewed', '${report.reported_id}')">Mark Reviewed</button>
                            <button class="btn-warn" onclick="takeAction('${report.report_id}', 'warned', '${report.reported_id}')">Warn</button>
                            <button class="btn-suspend" onclick="takeAction('${report.report_id}', 'suspended', '${report.reported_id}')">Suspend</button>
                            <button class="btn-ban" onclick="takeAction('${report.report_id}', 'banned', '${report.reported_id}')">Ban</button>
                        </div>
                    ` : `
                        <div style="color: var(--good);">✓ ${report.action_taken || 'Actioned'}</div>
                    `}
                </div>
            `).join('');
        }

        function takeAction(reportId, action, targetUserId) {
            // For dismiss/reviewed, just confirm and proceed
            if (action === 'dismissed' || action === 'reviewed') {
                const label = action === 'dismissed' ? 'dismiss this report' : 'mark as reviewed';
                if (confirm(`Are you sure you want to ${label}?`)) {
                    executeAction(reportId, action, targetUserId, null, '');
                }
                return;
            }

            // For warn/suspend/ban, show the modal with reason code dropdown
            pendingAction = { reportId, action, targetUserId };
            showActionModal(action);
        }

        function showActionModal(action) {
            const modal = document.getElementById('action-modal');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const btn = document.getElementById('confirm-action-btn');

            title.innerHTML = `${ACTION_LABELS[action]} <span class="action-type-badge ${action}">${action}</span>`;

            const descriptions = {
                'warned': 'The user will receive a warning notification.',
                'suspended': 'The user will be temporarily suspended from the platform.',
                'banned': 'The user will be permanently banned from the platform.'
            };
            desc.textContent = descriptions[action] || '';

            // Style confirm button based on action
            btn.className = 'btn-confirm';
            if (action === 'warned') btn.classList.add('warn');
            else if (action === 'suspended') btn.classList.add('suspend');

            btn.textContent = ACTION_LABELS[action] || 'Confirm';

            // Reset form
            document.getElementById('action-reason-code').value = '';
            document.getElementById('action-notes').value = '';

            modal.classList.add('active');
        }

        function closeActionModal() {
            document.getElementById('action-modal').classList.remove('active');
            pendingAction = null;
        }

        async function confirmAction() {
            if (!pendingAction) return;

            const reasonCode = document.getElementById('action-reason-code').value;
            const notes = document.getElementById('action-notes').value.trim();

            if (!reasonCode) {
                alert('Please select a reason code.');
                return;
            }

            const btn = document.getElementById('confirm-action-btn');
            btn.disabled = true;
            btn.textContent = 'Processing...';

            await executeAction(
                pendingAction.reportId,
                pendingAction.action,
                pendingAction.targetUserId,
                reasonCode,
                notes
            );

            btn.disabled = false;
            btn.textContent = ACTION_LABELS[pendingAction?.action] || 'Confirm';
            closeActionModal();
        }

        async function executeAction(reportId, action, targetUserId, reasonCode, notes) {
            try {
                await AdminShell.api('social', '/reports/action', {
                    report_id: reportId,
                    action: action,
                    target_user_id: targetUserId,
                    reason_code: reasonCode,
                    admin_notes: notes || ''
                });
                loadReports();
            } catch (error) {
                console.error('Error taking action:', error);
                showError(`Failed to process action: ${error.message}`);
            }
        }

        function formatTime(isoString) {
            if (!isoString) return 'Unknown';
            const date = new Date(isoString);
            return date.toLocaleString();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            const el = document.getElementById('error-message');
            el.textContent = message;
            el.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeActionModal();
        });

        document.getElementById('action-modal').addEventListener('click', (e) => {
            if (e.target.id === 'action-modal') closeActionModal();
        });

        AdminShell.init({ active: 'reports.html', title: 'Reports', onReady: loadReports });
    </script>
</body>
</html>
